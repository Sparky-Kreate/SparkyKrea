<!DOCTYPE html>
<html lang="es" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SparkyKrea - Asesoría Publicitaria Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brandVinotinto: '#800020',
                        brandVinotintoHover: '#600018',
                        brandVerde: '#10B981',
                        brandVerdeHover: '#059669',
                        darkBg: '#121212',
                        darkSidebar: '#18181b',
                        darkCard: '#242427',
                        darkBorder: '#3f3f46'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #52525b; }
    </style>
</head>
<body class="bg-darkBg text-gray-100 h-full w-full flex flex-col md:flex-row antialiased select-none">

    <!-- OVERLAY MÓVIL PARA CERRAR MENÚ -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/70 z-30 hidden md:hidden transition-opacity"></div>

    <!-- SIDEBAR / MENÚ LATERAL -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-72 bg-darkSidebar border-r border-darkBorder flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out h-full">
        <!-- Header Sidebar -->
        <div class="p-4 flex items-center justify-between border-b border-darkBorder shrink-0">
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brandVinotinto to-brandVerde flex items-center justify-center font-bold text-white shadow-md">
                    <i class="fa-solid fa-rectangle-ad text-base"></i>
                </div>
                <div class="flex flex-col">
                    <span class="font-bold text-lg tracking-wide leading-tight">
                        <span class="text-brandVinotinto">Sparky</span><span class="text-brandVerde">Krea</span>
                    </span>
                    <span class="text-[10px] text-gray-400 font-medium">Asesoría Publicitaria</span>
                </div>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white p-2">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Botón Nuevo Chat -->
        <div class="p-3 shrink-0">
            <button onclick="startNewChat()" class="w-full py-2.5 px-4 bg-brandVinotinto hover:bg-brandVinotintoHover text-white rounded-xl font-medium shadow-md transition flex items-center justify-center gap-2 text-sm border border-rose-900/40">
                <i class="fa-solid fa-plus text-xs"></i>
                <span>Nuevo proyecto publicitario</span>
            </button>
        </div>

        <!-- Historial de Chats -->
        <div class="flex-1 overflow-y-auto custom-scrollbar px-3 py-2">
            <div class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider px-3 mb-2 flex items-center justify-between">
                <span>Campañas Recientes</span>
            </div>
            <div id="chat-history" class="space-y-1">
                <!-- Historial dinámico -->
            </div>
        </div>

        <div class="p-3 border-t border-darkBorder text-[11px] text-gray-500 text-center shrink-0">
            SparkyKrea &copy; 2026
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 flex flex-col h-full w-full overflow-hidden bg-darkBg relative">
        
        <!-- Header Superior -->
        <header class="h-14 border-b border-darkBorder flex items-center justify-between px-4 bg-darkBg shrink-0">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="p-2 text-gray-300 hover:text-white bg-darkCard rounded-lg border border-darkBorder md:hidden">
                    <i class="fa-solid fa-bars-staggered text-sm"></i>
                </button>
                <div class="font-bold text-base md:text-lg tracking-wide">
                    <span class="text-brandVinotinto">Sparky</span><span class="text-brandVerde">Krea</span>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="startNewChat()" class="flex items-center gap-2 text-xs bg-darkCard hover:bg-darkBorder text-gray-200 px-3 py-1.5 rounded-lg border border-darkBorder transition">
                    <i class="fa-solid fa-rotate-right text-brandVerde"></i>
                    <span class="hidden sm:inline">Nueva Asesoría</span>
                </button>
            </div>
        </header>

        <!-- Contenedor Principal -->
        <div id="chat-container" class="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-6 max-w-4xl mx-auto w-full flex flex-col">
            
            <!-- Pantalla de Bienvenida -->
            <div id="welcome-screen" class="my-auto text-center py-4 flex flex-col items-center justify-center">
                <div class="w-14 h-14 bg-gradient-to-tr from-brandVinotinto to-brandVerde rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg text-2xl text-white">
                    <i class="fa-solid fa-clapperboard"></i>
                </div>
                
                <h1 id="dynamic-greeting" class="text-2xl md:text-3xl font-bold text-white mb-2">
                    ¡Hola! ¿En qué publicidad te puedo ayudar hoy?
                </h1>
                
                <p class="text-gray-400 text-xs md:text-sm max-w-md mx-auto leading-relaxed">
                    Soy tu asistente de <span class="text-brandVinotinto font-semibold">Sparky</span><span class="text-brandVerde font-semibold">Krea</span>. Escribe cualquier videojuego, marca o servicio para comenzar.
                </p>
            </div>

            <!-- Lista de Mensajes -->
            <div id="messages-list" class="space-y-4 hidden w-full pb-4"></div>
        </div>

        <!-- Entrada de Texto -->
        <div class="p-3 md:p-4 border-t border-darkBorder bg-darkBg shrink-0">
            <div class="max-w-4xl mx-auto relative">
                <form onsubmit="handleSend(event)" class="relative flex items-center">
                    <input 
                        type="text"
                        id="user-input" 
                        placeholder="Escribe el producto, juego o servicio aquí..." 
                        autocomplete="off"
                        class="w-full pl-4 pr-12 py-3 bg-darkCard border border-darkBorder focus:border-brandVerde rounded-xl text-white placeholder-gray-500 focus:outline-none text-sm transition"
                    />
                    <button type="submit" class="absolute right-2 p-2 bg-brandVinotinto hover:bg-brandVinotintoHover text-white rounded-lg transition flex items-center justify-center">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </form>
                <div class="text-center text-[11px] text-gray-500 mt-1.5">
                    SparkyKrea • Asesoría técnica, guiones profesionales y banda sonora.
                </div>
            </div>
        </div>

    </main>

    <script>
        let conversations = JSON.parse(localStorage.getItem('sparkykrea_chats')) || [];
        let currentChatId = null;
        let pendingTopic = null;

        function getGreeting() {
            const hour = new Date().getHours();
            if (hour >= 5 && hour < 12) return '¡Buenos días!';
            if (hour >= 12 && hour < 19) return '¡Buenas tardes!';
            return '¡Buenas noches!';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const greetingText = `¡Hola! ${getGreeting()} ¿En qué publicidad te puedo ayudar hoy?`;
            document.getElementById('dynamic-greeting').textContent = greetingText;
            renderSidebar();
        });

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function startNewChat() {
            currentChatId = Date.now().toString();
            pendingTopic = null;
            document.getElementById('welcome-screen').classList.remove('hidden');
            document.getElementById('messages-list').classList.add('hidden');
            document.getElementById('messages-list').innerHTML = '';
            document.getElementById('user-input').value = '';
            
            const sidebar = document.getElementById('sidebar');
            if (!sidebar.classList.contains('-translate-x-full')) {
                toggleSidebar();
            }
        }

        function deleteChat(id, e) {
            e.stopPropagation();
            conversations = conversations.filter(c => c.id !== id);
            localStorage.setItem('sparkykrea_chats', JSON.stringify(conversations));
            if (currentChatId === id) {
                startNewChat();
            } else {
                renderSidebar();
            }
        }

        function handleSend(e) {
            if (e) e.preventDefault();
            const input = document.getElementById('user-input');
            const query = input.value.trim();
            if (!query) return;

            if (!currentChatId) {
                currentChatId = Date.now().toString();
            }

            document.getElementById('welcome-screen').classList.add('hidden');
            const messagesList = document.getElementById('messages-list');
            messagesList.classList.remove('hidden');

            messagesList.innerHTML += `
                <div class="flex gap-3 justify-end">
                    <div class="bg-brandVinotinto text-white p-3.5 rounded-2xl rounded-tr-none max-w-[85%] text-sm shadow-md">
                        ${escapeHtml(query)}
                    </div>
                </div>
            `;

            input.value = '';
            scrollToBottom();

            const loadingId = 'loading-' + Date.now();
            messagesList.innerHTML += `
                <div id="${loadingId}" class="flex gap-3 justify-start items-center text-gray-400 text-xs py-2">
                    <div class="w-7 h-7 rounded-lg bg-darkCard border border-darkBorder flex items-center justify-center text-brandVerde">
                        <i class="fa-solid fa-spinner fa-spin text-xs"></i>
                    </div>
                    <span>Diseñando estrategia y guion publicitario...</span>
                </div>
            `;
            scrollToBottom();

            setTimeout(() => {
                document.getElementById(loadingId)?.remove();
                const botResponse = processPublicityRequest(query);

                messagesList.innerHTML += `
                    <div class="flex gap-3 justify-start">
                        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-brandVinotinto to-brandVerde flex-shrink-0 flex items-center justify-center text-white font-bold text-xs shadow-md">
                            SK
                        </div>
                        <div class="bg-darkCard border border-darkBorder text-gray-200 p-4 rounded-2xl rounded-tl-none max-w-[88%] text-sm leading-relaxed shadow-md space-y-3">
                            ${botResponse}
                        </div>
                    </div>
                `;
                
                saveMessageToHistory(query, botResponse);
                scrollToBottom();
            }, 600);
        }

        function selectDurationFromDropdown(val) {
            if (val === 'custom') {
                const customVal = prompt("Ingresa el tiempo deseado (Ej: 45 segundos, 2 minutos, 8 minutos):");
                if (customVal) {
                    document.getElementById('user-input').value = customVal;
                    handleSend();
                }
            } else if (val) {
                document.getElementById('user-input').value = val;
                handleSend();
            }
        }

        function parseDurationInSeconds(text) {
            const clean = text.toLowerCase();
            let minutes = 0;
            let seconds = 0;

            const minMatch = clean.match(/(\d+)\s*(min|minuto|minutos)/);
            const secMatch = clean.match(/(\d+)\s*(seg|segundo|segundos)/);
            const onlyNumberMatch = clean.match(/(\d+)/);

            if (minMatch) minutes = parseInt(minMatch[1]);
            if (secMatch) seconds = parseInt(secMatch[1]);

            if (!minMatch && !secMatch && onlyNumberMatch) {
                const num = parseInt(onlyNumberMatch[1]);
                if (num <= 10) minutes = num;
                else seconds = num;
            }

            const totalSeconds = (minutes * 60) + seconds;
            return totalSeconds > 0 ? totalSeconds : 30;
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // Genera bloques cronológicos ultra detallados para cualquier tiempo
        function generateDetailedScript(topic, totalSeconds) {
            let steps = [];
            
            if (totalSeconds <= 15) {
                steps = [
                    { time: "0:00 - 0:03", visual: `Plano detalle de alto impacto (Macro). Aparición del título deslumbrante de ${topic}.`, audio: `Grito de atención / SFX "Swoosh" pesado + Frase gancho impactante.` },
                    { time: "0:03 - 0:10", visual: `Cortes ultrarrápidos (0.5s cada uno) mostrando las mejores características o jugadas de ${topic}.`, audio: `Voz dinámica acelerada + Beat fuerte al ritmo de las imágenes.` },
                    { time: "0:10 - 0:15", visual: `Pantalla de cierre con logotipo gigante, oferta tentadora e íconos de acción.`, audio: `Locución directa: "¡Pruébalo ahora, enlace aquí abajo!" + Remate de audio.` }
                ];
            } else if (totalSeconds <= 30) {
                steps = [
                    { time: "0:00 - 0:05", visual: `Plano subjetivo (POV) mostrando una situación común o problema antes de conocer ${topic}.`, audio: `Pregunta directa al espectador con fondo musical suspenso.` },
                    { time: "0:05 - 0:15", visual: `Transición explosiva hacia la solución: Revelación visual principal de ${topic} en acción.`, audio: `El beat explota (Drop de la canción). Frase de valor único.` },
                    { time: "0:15 - 0:25", visual: `3 Tomas seguidas: Plano medio (interacción), primer plano (calidad/textura/detalle) y resultado.`, audio: `Explicación rápida de los beneficios principales.` },
                    { time: "0:25 - 0:30", visual: `Banner promocional, animación de flechas apuntando al botón de descarga/compra.`, audio: `Call to Action final con urgencia: "Disponibilidad limitada. ¡Haz clic ya!"` }
                ];
            } else if (totalSeconds <= 60) {
                steps = [
                    { time: "0:00 - 0:08", visual: `Gancho en primer plano. Personaje o demostración intrigante relacionada con ${topic}.`, audio: `Frase controvertida o dato curioso que atrape la atención inmediatamente.` },
                    { time: "0:08 - 0:20", visual: `Plano general mostrando el entorno completo y la llegada o activación de ${topic}.`, audio: `Inicio de la música principal. Voz descriptiva enérgica.` },
                    { time: "0:20 - 0:38", visual: `Secuencia de prueba: Muestra detallada de las 3 ventajas técnicas o de entretenimiento más potentes.`, audio: `Puntos claves expresados con claridad y breves efectos de sonido entre puntos.` },
                    { time: "0:38 - 0:50", visual: `Reacción en vivo / Testimonio / Demostración en tiempo real disfrutando ${topic}.`, audio: `Voz secundaria o efecto de validación/comunidad.` },
                    { time: "0:50 - 1:00", visual: `Cierre con logo, redes sociales y botón interactivo destacado.`, audio: `Llamado a la acción claro y fading suave de la música.` }
                ];
            } else {
                // Duraciones largas (3 min, 5 min, 10 min, etc.)
                const stepDuration = Math.floor(totalSeconds / 6);
                let currentSec = 0;

                const labels = [
                    "Introducción & Planteamiento del Problema",
                    "Revelación de la Solución (" + topic + ")",
                    "Demostración Técnica & Calidad en Detalle",
                    "Comparativa / Ventajas Exclusivas frente a alternativas",
                    "Prueba de Campo / Experiencia de uso real",
                    "Oferta Especial, Garantía & Cierre con CTA"
                ];

                for (let i = 0; i < 6; i++) {
                    let nextSec = (i === 5) ? totalSeconds : currentSec + stepDuration;
                    steps.push({
                        time: `${formatTime(currentSec)} - ${formatTime(nextSec)}`,
                        visual: `[Estructura Bloque ${i+1}]: Tomas para ${labels[i]}. Alterna entre plano general, primeros planos cinematográficos y B-Roll estético.`,
                        audio: `Desarrollo de locución fluida. Transiciones musicales graduales adaptadas a este bloque.`
                    });
                    currentSec = nextSec;
                }
            }

            return steps.map(s => `
                <div class="border-l-2 border-brandVerde pl-3 my-2 space-y-1">
                    <p class="font-bold text-white text-xs">⏱️ <span>${s.time}</span></p>
                    <p class="text-gray-300">📹 <strong>Visual & Cámara:</strong> ${s.visual}</p>
                    <p class="text-gray-400">🎙️ <strong>Locución & Audio:</strong> ${s.audio}</p>
                </div>
            `).join("");
        }

        function processPublicityRequest(input) {
            const clean = input.toLowerCase().trim();

            const hasTimeKeywords = /(\d+|segundo|segundos|minuto|minutos|min|seg)/i.test(clean);
            
            // SI YA TENEMOS UN TEMA REGISTRADO Y RECIBIMOS EL TIEMPO:
            if (pendingTopic && hasTimeKeywords) {
                const totalSec = parseDurationInSeconds(clean);
                const scriptHTML = generateDetailedScript(pendingTopic, totalSec);
                const currentTopic = pendingTopic;
                pendingTopic = null;

                return `
                    <div class="space-y-4">
                        <div class="border-b border-darkBorder pb-2">
                            <h2 class="text-base font-bold text-brandVerde">🎬 Estrategia de Producción Publicitaria Pro</h2>
                            <p class="text-xs text-gray-400">Proyecto: <strong class="text-white">${escapeHtml(currentTopic)}</strong> | Duración: <strong class="text-white">${formatTime(totalSec)}</strong></p>
                        </div>

                        <!-- 1. GUION PASO A PASO -->
                        <div class="bg-darkSidebar p-3.5 rounded-xl border border-darkBorder space-y-2 text-xs">
                            <p class="text-brandVerde font-bold uppercase tracking-wider">📜 GUION PASO A PASO (CRONOGRAMA EXACTO):</p>
                            ${scriptHTML}
                        </div>

                        <!-- 2. ESTRATEGIA DE GRABACIÓN Y EDICIÓN -->
                        <div class="bg-darkSidebar p-3.5 rounded-xl border border-darkBorder space-y-2 text-xs">
                            <p class="text-brandVerde font-bold uppercase tracking-wider">🎥 ESTRATEGIA DE GRABACIÓN & RODAJE:</p>
                            <p>• <strong>Iluminación:</strong> Usa luz principal a 45° (Softbox) y luz de acento trasera en color contraste para separar el sujeto/producto del fondo.</p>
                            <p>• <strong>Planos recomendados:</strong> Intercala entre planos detalle (Macro) y planos medios dinámicos en movimiento (Gimbal o cámara en mano estable).</p>
                            <p>• <strong>Ritmo de Edición:</strong> Aplica cortes de velocidad (Speed Ramps), zooms de impacto en palabras clave y subtítulos dinámicos centro-pantalla con tipografía gruesa.</p>
                        </div>

                        <!-- 3. MÚSICA Y BANDA SONORA -->
                        <div class="bg-darkSidebar p-3.5 rounded-xl border border-darkBorder space-y-2 text-xs">
                            <p class="text-brandVerde font-bold uppercase tracking-wider">🎵 BANDA SONORA & OPCIONES DE CANCIONES:</p>
                            <p class="text-gray-300">Te sugerimos estas opciones para la música de fondo. <em>Puedes elegir cualquiera de estas o utilizar una similar a tu propio gusto:</em></p>
                            <ul class="list-disc list-inside text-gray-400 space-y-1">
                                <li><strong>Opción Enérgica / Trap-Phonk:</strong> Ideal para videojuegos, deportes o juventud (Beats pesados con graves potentes).</li>
                                <li><strong>Opción Pop / Electronic House:</strong> Excelente para moda, maquillaje, aplicaciones y productos tecnológicos.</li>
                                <li><strong>Opción Synthwave 80s / Retro:</strong> Perfecta para darle un estilo estilizado, nocturno o cyberpunk.</li>
                                <li><strong>Opción Lofi / Chillhop:</strong> Recomendada para servicios, comida, relajación o marcas educativas.</li>
                                <li><strong>Opción Cinematic / Epic Orchestral:</strong> Para promociones solemnes, tráilers o eventos de gran impacto.</li>
                            </ul>
                        </div>
                    </div>
                `;
            }

            // SI ES EL INICIO O UN NUEVO TEMA:
            pendingTopic = input;

            return `
                <div class="space-y-3">
                    <p>Perfecto. Diseñaré la estrategia completa para: <strong class="text-brandVerde">"${escapeHtml(input)}"</strong>.</p>
                    
                    <div class="p-3 bg-darkSidebar rounded-xl border border-darkBorder space-y-2">
                        <label for="duration-select" class="block text-xs font-semibold text-gray-300">
                            ⏱️ Selecciona o indica la duración deseada para el video:
                        </label>
                        
                        <select id="duration-select" onchange="selectDurationFromDropdown(this.value)" class="w-full bg-darkCard border border-darkBorder text-white text-xs rounded-lg p-2.5 focus:outline-none focus:border-brandVerde cursor-pointer">
                            <option value="">-- Elige un tiempo de la lista --</option>
                            <option value="10 segundos">10 Segundos (Ultra rápido / Story-Reel)</option>
                            <option value="20 segundos">20 Segundos (Anuncio Dinámico)</option>
                            <option value="30 segundos">30 Segundos (Comercial Estándar)</option>
                            <option value="60 segundos">60 Segundos (1 Minuto / Explicativo)</option>
                            <option value="3 minutos">3 Minutos (Review / Caso Extenso)</option>
                            <option value="5 minutos">5 Minutos (Presentación Completa)</option>
                            <option value="10 minutos">10 Minutos (Especial / Guion Largo)</option>
                            <option value="custom">✍️ Escribir tiempo personalizado...</option>
                        </select>
                    </div>
                </div>
            `;
        }

        function scrollToBottom() {
            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;
        }

        function saveMessageToHistory(userText, botText) {
            let chat = conversations.find(c => c.id === currentChatId);
            if (!chat) {
                chat = { 
                    id: currentChatId, 
                    title: userText.substring(0, 22) + (userText.length > 22 ? '...' : ''),
                    messages: [] 
                };
                conversations.unshift(chat);
            }
            
            chat.messages.push({ sender: 'user', text: userText });
            chat.messages.push({ sender: 'bot', text: botText });

            localStorage.setItem('sparkykrea_chats', JSON.stringify(conversations));
            renderSidebar();
        }

        function renderSidebar() {
            const historyContainer = document.getElementById('chat-history');
            if (conversations.length === 0) {
                historyContainer.innerHTML = `<div class="text-xs text-gray-500 italic px-3 py-2">Sin campañas guardadas</div>`;
                return;
            }
            historyContainer.innerHTML = '';
            conversations.forEach(c => {
                const active = c.id === currentChatId;
                historyContainer.innerHTML += `
                    <div onclick="selectChat('${c.id}')" class="group flex items-center justify-between px-3 py-2 rounded-lg cursor-pointer text-xs transition ${active ? 'bg-brandVinotinto/30 border border-brandVinotinto/50 text-white font-medium' : 'text-gray-400 hover:bg-darkCard hover:text-gray-200'}">
                        <div class="flex items-center gap-2 truncate">
                            <i class="fa-solid fa-film text-brandVerde text-[10px]"></i>
                            <span class="truncate">${escapeHtml(c.title)}</span>
                        </div>
                        <button onclick="deleteChat('${c.id}', event)" class="opacity-0 group-hover:opacity-100 p-1 text-gray-500 hover:text-rose-400 transition" title="Eliminar chat">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                `;
            });
        }

        function selectChat(id) {
            currentChatId = id;
            const chat = conversations.find(c => c.id === id);
            if (!chat) return;

            document.getElementById('welcome-screen').classList.add('hidden');
            const messagesList = document.getElementById('messages-list');
            messagesList.classList.remove('hidden');
            messagesList.innerHTML = '';

            chat.messages.forEach(m => {
                if (m.sender === 'user') {
                    messagesList.innerHTML += `
                        <div class="flex gap-3 justify-end">
                            <div class="bg-brandVinotinto text-white p-3.5 rounded-2xl rounded-tr-none max-w-[85%] text-sm shadow-md">
                                ${escapeHtml(m.text)}
                            </div>
                        </div>
                    `;
                } else {
                    messagesList.innerHTML += `
                        <div class="flex gap-3 justify-start">
                            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-brandVinotinto to-brandVerde flex-shrink-0 flex items-center justify-center text-white font-bold text-xs shadow-md">
                                SK
                            </div>
                            <div class="bg-darkCard border border-darkBorder text-gray-200 p-4 rounded-2xl rounded-tl-none max-w-[88%] text-sm leading-relaxed shadow-md space-y-3">
                                ${m.text}
                            </div>
                        </div>
                    `;
                }
            });

            renderSidebar();
            scrollToBottom();

            const sidebar = document.getElementById('sidebar');
            if (!sidebar.classList.contains('-translate-x-full')) {
                toggleSidebar();
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
