<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SparkyKrea Studio's</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --wine:#800020;
    --green:#10B981;
    --bg:#08090c;
    --panel:#0d0f13;
    --card:#111318;
    --border:#20242c;
    --white:#f5f5f5;
    --muted:#858a94;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:var(--bg);
    color:var(--white);
    height:100vh;
    overflow:hidden;
}

/* ================= SPLASH ================= */

#splash{
    position:fixed;
    inset:0;
    z-index:9999;
    background:#08090c;
    display:flex;
    justify-content:center;
    align-items:center;
    animation:splashOut .8s ease 2.2s forwards;
}

.splash-logo{
    text-align:center;
    animation:logoIn 1s ease;
}

.logo-icon{
    width:75px;
    height:75px;
    margin:auto;
}

.logo-name{
    margin-top:15px;
    font-size:28px;
    font-weight:800;
    letter-spacing:-1px;
}

.logo-name span:first-child{
    color:var(--wine);
}

.logo-name span:nth-child(2){
    color:var(--green);
}

.logo-studio{
    font-size:10px;
    letter-spacing:5px;
    color:white;
    margin-top:3px;
}

@keyframes logoIn{
    from{
        opacity:0;
        transform:scale(.85);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes splashOut{
    to{
        opacity:0;
        visibility:hidden;
        pointer-events:none;
    }
}

/* ================= APP ================= */

#app{
    height:100vh;
    display:flex;
}

/* ================= SIDEBAR ================= */

.sidebar{
    width:270px;
    background:#0b0d11;
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:20px 15px;
    flex-shrink:0;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:4px 7px 24px;
}

.brand-icon{
    width:35px;
    height:35px;
}

.brand-text{
    font-size:16px;
    font-weight:800;
}

.brand-text .s{
    color:var(--wine);
}

.brand-text .k{
    color:var(--green);
}

.brand-text small{
    display:block;
    font-size:7px;
    letter-spacing:3px;
    color:#fff;
    margin-top:1px;
}

.new-btn{
    width:100%;
    border:1px solid #292d35;
    background:#12151a;
    color:white;
    border-radius:11px;
    padding:12px;
    font-size:13px;
    cursor:pointer;
    transition:.2s;
}

.new-btn:hover{
    background:#171a20;
}

.history-title{
    color:#707680;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    margin:25px 8px 10px;
}

.history{
    overflow:auto;
    flex:1;
}

.history-item{
    padding:10px;
    border-radius:9px;
    color:#b9bdc5;
    font-size:12px;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:3px;
}

.history-item:hover{
    background:#14171c;
    color:white;
}

.sidebar-bottom{
    border-top:1px solid var(--border);
    padding-top:14px;
    text-align:center;
    color:#555b65;
    font-size:10px;
}

/* ================= MAIN ================= */

.main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

/* ================= HEADER ================= */

.header{
    height:62px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    flex-shrink:0;
}

.header-title{
    font-size:14px;
    font-weight:600;
}

.header-logo{
    display:flex;
    align-items:center;
    gap:8px;
}

.header-logo .mini-icon{
    width:27px;
    height:27px;
}

.header-logo-text{
    font-size:11px;
    font-weight:700;
}

.header-logo-text .s{
    color:var(--wine);
}

.header-logo-text .k{
    color:var(--green);
}

.header-logo-text small{
    display:block;
    font-size:5px;
    letter-spacing:2px;
}

/* ================= CHAT ================= */

.chat{
    flex:1;
    overflow-y:auto;
    padding:35px 20px 120px;
}

.chat-inner{
    max-width:850px;
    margin:auto;
}

/* ================= WELCOME ================= */

.welcome{
    min-height:55vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.welcome-icon{
    width:82px;
    height:82px;
    margin-bottom:20px;
}

.welcome h1{
    font-size:30px;
    letter-spacing:-1px;
    margin-bottom:9px;
}

.welcome p{
    color:#777d87;
    font-size:13px;
    max-width:470px;
    line-height:1.7;
}

/* ================= MESSAGES ================= */

.message{
    display:flex;
    margin-bottom:23px;
    animation:messageIn .25s ease;
}

.message.user{
    justify-content:flex-end;
}

.message.bot{
    justify-content:flex-start;
}

.bubble{
    max-width:82%;
    padding:14px 16px;
    border-radius:13px;
    font-size:13px;
    line-height:1.65;
    white-space:normal;
}

.user .bubble{
    background:#15171c;
    border:1px solid #20232a;
    color:#e8e8e8;
}

.bot .bubble{
    background:#101216;
    border:1px solid #1b1e24;
    color:#fff;
}

/* headings inside bot */

.bot-title{
    font-size:17px;
    font-weight:700;
    margin-bottom:10px;
    color:white;
}

.section{
    margin-top:15px;
}

.section strong{
    color:#fff;
    display:block;
    margin-bottom:4px;
}

.motivation{
    margin-top:18px;
    padding-top:13px;
    border-top:1px solid #22252b;
    color:#c7c9cd;
    font-style:italic;
}

/* ================= IDEA CARDS ================= */

.idea{
    border:1px solid #20232a;
    background:#0d0f13;
    border-radius:11px;
    padding:13px;
    margin:10px 0;
}

.idea-number{
    font-weight:700;
    color:#fff;
    margin-bottom:6px;
}

.idea span{
    color:#aaaeb6;
}

/* ================= TYPING ================= */

.typing{
    display:flex;
    gap:4px;
    padding:6px 2px;
}

.typing i{
    width:5px;
    height:5px;
    border-radius:50%;
    background:#737780;
    animation:typing 1s infinite;
}

.typing i:nth-child(2){
    animation-delay:.15s;
}

.typing i:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{
    0%,100%{opacity:.25}
    50%{opacity:1}
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(5px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ================= COMPOSER ================= */

.composer-area{
    position:fixed;
    bottom:0;
    left:270px;
    right:0;
    padding:15px 20px 18px;
    background:linear-gradient(transparent,#08090c 25%);
}

.composer{
    max-width:850px;
    margin:auto;
    border:1px solid #292d34;
    background:#101216;
    border-radius:15px;
    display:flex;
    align-items:flex-end;
    padding:9px;
}

textarea{
    flex:1;
    resize:none;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    font-family:inherit;
    font-size:13px;
    padding:9px;
    max-height:130px;
}

textarea::placeholder{
    color:#626771;
}

.send{
    width:38px;
    height:38px;
    border-radius:10px;
    border:0;
    background:#e8e8e8;
    color:#111;
    font-size:18px;
    cursor:pointer;
}

.send:hover{
    background:white;
}

.footer{
    text-align:center;
    color:#484d56;
    font-size:9px;
    margin-top:7px;
}

/* ================= DURATION PANEL ================= */

.duration-wrap{
    position:relative;
    margin-top:15px;
}

.duration-button{
    background:#111419;
    border:1px solid #292d34;
    color:white;
    border-radius:9px;
    padding:10px 14px;
    cursor:pointer;
    font-size:12px;
}

.duration-button:hover{
    background:#171a20;
}

.duration-panel{
    display:none;
    position:absolute;
    bottom:48px;
    left:0;
    width:250px;
    padding:10px;
    background:#0d0f13;
    border:1px solid #292d34;
    border-radius:13px;
    box-shadow:0 15px 40px rgba(0,0,0,.45);
    z-index:50;
}

.duration-panel.open{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}

.duration-option{
    background:#111419;
    border:1px solid #20242b;
    color:#ddd;
    padding:10px 7px;
    border-radius:8px;
    cursor:pointer;
    font-size:11px;
}

.duration-option:hover{
    background:#191c22;
    border-color:#333842;
}

/* ================= MOBILE ================= */

.mobile-menu{
    display:none;
    background:none;
    border:0;
    color:white;
    font-size:21px;
    cursor:pointer;
}

@media(max-width:700px){

    .sidebar{
        position:fixed;
        z-index:100;
        left:-280px;
        top:0;
        bottom:0;
        transition:.25s;
    }

    .sidebar.open{
        left:0;
    }

    .mobile-menu{
        display:block;
        margin-right:10px;
    }

    .header{
        padding:0 14px;
    }

    .header-title{
        display:flex;
        align-items:center;
    }

    .header-logo-text{
        display:none;
    }

    .chat{
        padding:25px 12px 115px;
    }

    .bubble{
        max-width:92%;
    }

    .welcome h1{
        font-size:24px;
    }

    .welcome p{
        font-size:12px;
    }

    .composer-area{
        left:0;
        padding:10px 10px 14px;
    }

    .duration-panel{
        width:230px;
    }
}
</style>
</head>

<body>

                    <rect x="29" y="49" width="42" height="25"

                    <circle cx="50" cy="61" r="8"
                            fill="none"

                            stroke-width="3"/>
                </svg>

                    <span class="s">Sparky</span><span class="k">Krea</span>
                    <small>STUDIO'S</small>

            placeholder="Cuéntame qué quieres crear..."

<script>

/* =========================================================
   SPARKYKREA ENGINE
========================================================= */

const input = document.getElementById("input");
const send = document.getElementById("send");
const chat = document.getElementById("chat");
const chatInner = chat.querySelector(".chat-inner");
const welcome = document.getElementById("welcome");
const history = document.getElementById("history");

let greetingShown = false;
let pendingDuration = false;
let currentProject = null;
let motivationIndex = 0;


/* =========================================================
   SALUDO — SOLO UNA VEZ
========================================================= */

function getGreeting(){

    const hour = new Date().getHours();

    if(hour >= 5 && hour < 12){
        return "Buenos días";
    }

    if(hour >= 12 && hour < 19){
        return "Buenas tardes";
    }

    return "Buenas noches";
}


function showGreeting(){

    if(greetingShown) return;

    greetingShown = true;

    addBotMessage(
        `${getGreeting()} 👋<br><br>
        Soy SparkyKrea. Cuéntame qué tienes en mente y yo me encargo de analizarlo.`
    );
}


/* =========================================================
   MOTIVACIONES
========================================================= */

const motivations = [

    "Una buena idea puede empezar pequeña y terminar siendo enorme.",
    "No necesitas tenerlo todo claro para empezar. Vamos paso a paso.",
    "La creatividad mejora cuando te atreves a probar cosas diferentes.",
    "Tu próxima idea podría ser la que marque la diferencia.",
    "Haz que alguien quiera quedarse hasta el último segundo.",
    "Crear también es experimentar. Si algo no funciona, lo cambiamos.",
    "Una idea sencilla, bien ejecutada, puede sorprender muchísimo.",
    "No busques solamente publicar: busca dejar algo en quien lo vea.",
    "Cada video es una oportunidad para mejorar el siguiente.",
    "La originalidad aparece cuando dejas de copiar fórmulas.",
    "Empieza con lo que tienes y construye desde ahí.",
    "Un buen concepto merece una buena ejecución.",
    "No subestimes una idea que todavía está tomando forma.",
    "Hazlo interesante, hazlo tuyo.",
    "La constancia convierte las ideas en proyectos.",
    "Tu creatividad no necesita permiso para empezar.",
    "Prueba, analiza y vuelve a intentarlo. Así nacen las buenas ideas.",
    "Lo importante no es que sea perfecto, sino que tenga algo que decir.",
    "Cada proyecto puede enseñarte algo nuevo.",
    "Ahora toca convertir la idea en algo que la gente quiera ver."

];

function motivation(){

    const text = motivations[motivationIndex % motivations.length];

    motivationIndex++;

    return `
        <div class="motivation">
            ${text}
        </div>
    `;
}


/* =========================================================
   DURACIONES
========================================================= */

const durations = [
    "10 segundos",
    "15 segundos",
    "30 segundos",
    "45 segundos",
    "60 segundos",
    "90 segundos",
    "2 minutos",
    "3 minutos",
    "5 minutos"
];


function showDurationSelector(){

    const id = "duration-" + Date.now();

    const html = `

        <div class="duration-wrap">

            <button
                class="duration-button"
                onclick="toggleDuration('${id}')"
            >
                ⏱ Elegir duración
            </button>

            <div
                class="duration-panel"
                id="${id}"
            >

                ${durations.map(d => `
                    <button
                        class="duration-option"
                        onclick="selectDuration('${d.replace(/'/g,"\\'")}')"
                    >
                        ${d}
                    </button>
                `).join("")}

                <button
                    class="duration-option"
                    onclick="customDuration()"
                >
                    Personalizado
                </button>

            </div>

        </div>
    `;

    addBotMessage(html);
}


function toggleDuration(id){

    const panel = document.getElementById(id);

    if(panel){
        panel.classList.toggle("open");
    }
}


function selectDuration(duration){

    pendingDuration = false;

    if(!currentProject){

        currentProject = {
            topic:"contenido",
            type:"video",
            duration:duration
        };

    }else{

        currentProject.duration = duration;

    }

    addUserMessage(duration);

    showTyping();

    setTimeout(() => {

        removeTyping();

        addBotMessage(
            buildLongScript(currentProject)
        );

    },700);
}


function customDuration(){

    const value = prompt(
        "Escribe la duración aproximada. Ejemplo: 75 segundos o 4 minutos."
    );

    if(!value) return;

    selectDuration(value);
}


/* =========================================================
   ANALIZADOR
========================================================= */

function normalize(text){

    return text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"");
}


function detectPlatform(text){

    const t = normalize(text);

    const platforms = [
        "tiktok",
        "instagram",
        "youtube",
        "shorts",
        "reels",
        "facebook",
        "twitter",
        "x "
    ];

    for(const p of platforms){

        if(t.includes(p)){
            return p.trim();
        }

    }

    return null;
}


function detectGame(text){

    const t = normalize(text);

    const games = [
        "gta 6",
        "gta vi",
        "gta",
        "valorant",
        "minecraft",
        "roblox",
        "fortnite",
        "clash royale",
        "brawl stars",
        "free fire"
    ];

    for(const game of games){

        if(t.includes(game)){
            return game;
        }

    }

    return null;
}


function detectType(text){

    const t = normalize(text);

    if(
        t.includes("publicidad") ||
        t.includes("anuncio") ||
        t.includes("promocionar") ||
        t.includes("promocion")
    ){
        return "publicidad";
    }

    if(
        t.includes("guion") ||
        t.includes("guión")
    ){
        return "guion";
    }

    if(
        t.includes("meme")
    ){
        return "meme";
    }

    if(
        t.includes("video") ||
        t.includes("video")
    ){
        return "video";
    }

    if(
        t.includes("idea") ||
        t.includes("que hago") ||
        t.includes("no se que hacer") ||
        t.includes("no se que publicar")
    ){
        return "ideas";
    }

    return "contenido";
}


function detectTopic(text){

    const game = detectGame(text);

    if(game){
        return game;
    }

    const platform = detectPlatform(text);

    if(platform){
        return `contenido para ${platform}`;
    }

    return text
        .replace(/quiero/gi,"")
        .replace(/hacer/gi,"")
        .replace(/un/gi,"")
        .replace(/una/gi,"")
        .replace(/por favor/gi,"")
        .trim();
}


function analyze(text){

    const type = detectType(text);
    const topic = detectTopic(text);
    const platform = detectPlatform(text);
    const game = detectGame(text);

    const durationWords =
        /(\d+)\s*(seg|segundos|min|minutos)/i.test(text);

    return {
        raw:text,
        type,
        topic,
        platform,
        game,
        durationWords
    };
}


/* =========================================================
   DETECTAR DURACIÓN ESCRITA
========================================================= */

function extractDuration(text){

    const match = text.match(
        /(\d+)\s*(seg|segundos|min|minutos)/i
    );

    if(!match) return null;

    const number = parseInt(match[1]);

    if(
        match[2].toLowerCase().startsWith("min")
    ){
        return `${number} minuto${number === 1 ? "" : "s"}`;
    }

    return `${number} segundo${number === 1 ? "" : "s"}`;
}


/* =========================================================
   CREAR GUION
========================================================= */

function buildLongScript(project){

    const duration = project.duration || "30 segundos";
    const topic = project.topic || "tu idea";

                </p>

                </p>
            </div>
        `;

    }

    else if(duration.includes("60")){

        lengthText = `
            <div class="section">
                <strong>🎙️ Guion completo — aproximadamente 60 segundos</strong>

                <p>
                    “Imagina descubrir ${topic} por primera vez.

                </p>

    else{

                    <b>INTRODUCCIÓN</b><br>

/* =========================================================
   RESPUESTA INTELIGENTE
========================================================= */

function generateResponse(text){

    const context = analyze(text);

    /* Si el usuario está eligiendo duración */

    const writtenDuration = extractDuration(text);

    if(pendingDuration && writtenDuration){

        currentProject.duration = writtenDuration;

        pendingDuration = false;

        addUserMessage(text);

        showTyping();

        setTimeout(() => {

            removeTyping();

            addBotMessage(
                buildLongScript(currentProject)
            );

        },700);

        return;
    }


    /*
       Si dice algo como:
       "sí", "si", "dale", etc.
       y había una pregunta pendiente,
       NO repetimos la pregunta.
    */

    if(
        pendingDuration &&
        /^(si|sí|dale|claro|ok|okay|va|perfecto|yes)$/i.test(text.trim())
    ){

        addUserMessage(text);

        addBotMessage(`
            Perfecto. Solo me falta saber la duración aproximada
            para adaptar el guion correctamente.
            ${showDurationSelector()}
        `);

        return;
    }


    /*
       Analizar la intención.
       Si ya tenemos suficiente información,
       preguntar solamente lo que falta.
    */

    if(
        context.type === "publicidad" ||
        context.type === "guion" ||
        context.type === "video"
    ){

        currentProject = {
            topic:context.topic,
            type:context.type,
            platform:context.platform
        };

        pendingDuration = true;

        addBotMessage(`

            <div class="bot-title">
                Perfecto, ya tengo la idea.
            </div>

            <div class="section">
                Voy a plantearlo como un contenido sobre
                <strong>${capitalize(context.topic)}</strong>
                ${context.platform ? `pensado para ${context.platform}` : "para formato de video"}.
            </div>

            <div class="section">
                Antes de escribirlo necesito adaptar el ritmo,
                la cantidad de información y el desarrollo a una
                duración concreta.
            </div>

            <div class="section">
                <strong>¿Cuánto quieres que dure aproximadamente?</strong>
                Elige una opción:
            </div>

            ${buildDurationHTML()}

        `);

        return;
    }


    /* Ideas */

    if(
        context.type === "ideas" ||
        /no se que hacer|no sé qué hacer|no tengo idea|que puedo hacer|qué puedo hacer/i.test(text)
    ){

        const topic = context.game || "contenido";

        addBotMessage(`
            <div class="bot-title">
                💡 Vamos a desbloquear ideas.
            </div>

            <div class="section">
                Como estás pensando en <strong>${capitalize(topic)}</strong>,
                te propongo varias direcciones diferentes en lugar
                de darte siempre la misma fórmula.
            </div>

            <div class="idea">
                <div class="idea-number">01 — El descubrimiento</div>
                <span>Empieza con algo que parezca desconocido y
                revela poco a poco de qué se trata.</span>
            </div>

            <div class="idea">
                <div class="idea-number">02 — El reto creativo</div>
                <span>Plantea una condición dentro del contenido
                y construye el video alrededor de ella.</span>
            </div>

            <div class="idea">
                <div class="idea-number">03 — La opinión</div>
                <span>Presenta una opinión polémica o inesperada
                y desarrolla argumentos para mantener la atención.</span>
            </div>

            <div class="idea">
                <div class="idea-number">04 — El experimento</div>
                <span>Haz algo diferente y documenta qué sucede.</span>
            </div>

            <div class="idea">
                <div class="idea-number">05 — La historia</div>
                <span>Convierte el tema en una pequeña historia con
                inicio, conflicto y final.</span>
            </div>

            ${motivation()}
        `);

        return;
    }


    /* Respuesta genérica */

    addBotMessage(`

        <div class="bot-title">
            Entendido.
        </div>

        <div class="section">
            Analicé lo que me dijiste y puedo ayudarte a convertirlo
            en una idea, guion, publicidad, video o concepto para
            redes.
        </div>

        <div class="section">
            Cuéntame qué quieres conseguir con esa idea y la
            desarrollaré desde ahí.
        </div>

        ${motivation()}

    `);
}


/* =========================================================
   HTML DEL SELECTOR
========================================================= */

function buildDurationHTML(){

    return `

        <div class="duration-wrap">

            <button
                class="duration-button"
                onclick="toggleDuration('main-duration-panel')"
            >
                ⏱ Elegir duración
            </button>

            <div
                class="duration-panel"
                id="main-duration-panel"
            >

                ${durations.map(d => `
                    <button
                        class="duration-option"
                        onclick="selectDuration('${d}')"
                    >
                        ${d}
                    </button>
                `).join("")}

                <button
                    class="duration-option"
                    onclick="customDuration()"
                >
                    Personalizado
                </button>

            </div>

        </div>
    `;
}


/* =========================================================
   UTILIDADES
========================================================= */

function capitalize(text){

    if(!text) return "";

    return text.charAt(0).toUpperCase() + text.slice(1);
}


/* =========================================================
   CHAT
========================================================= */

function addUserMessage(text){

    welcome.style.display = "none";

    const message = document.createElement("div");

    message.className = "message user";

    message.innerHTML = `
        <div class="bubble">
            ${escapeHTML(text)}
        </div>
    `;

    chatInner.appendChild(message);

    scrollChat();
}


function addBotMessage(html){

    welcome.style.display = "none";

    const message = document.createElement("div");

    message.className = "message bot";

    message.innerHTML = `
        <div class="bubble">
            ${html}
        </div>
    `;

    chatInner.appendChild(message);

    scrollChat();

    saveHistory();

}


function showTyping(){

    const typing = document.createElement("div");

    typing.className = "message bot";

    typing.id = "typing";

    typing.innerHTML = `
        <div class="bubble">
            <div class="typing">
                <i></i>
                <i></i>
                <i></i>
            </div>
        </div>
    `;

    chatInner.appendChild(typing);

    scrollChat();
}


function removeTyping(){

    const typing = document.getElementById("typing");

    if(typing){
        typing.remove();
    }
}


function scrollChat(){

    setTimeout(() => {

        chat.scrollTo({
            top:chat.scrollHeight,
            behavior:"smooth"
        });

    },50);
}


function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;")
        .replace(/\n/g,"<br>");
}


/* =========================================================
   ENVIAR
========================================================= */

function sendMessage(){

    const text = input.value.trim();

    if(!text) return;

    input.value = "";

    input.style.height = "auto";

    if(!greetingShown){
        showGreeting();
    }

    addUserMessage(text);

    showTyping();

    setTimeout(() => {

        removeTyping();

        generateResponse(text);

    },650);
}


send.addEventListener("click",sendMessage);


input.addEventListener("keydown",e => {

    if(e.key === "Enter" && !e.shiftKey){

        e.preventDefault();

        sendMessage();

    }

});


input.addEventListener("input",() => {

    input.style.height = "auto";

    input.style.height =
        Math.min(input.scrollHeight,130) + "px";

});


/* =========================================================
   HISTORIAL
========================================================= */

function saveHistory(){

    const messages = [...chatInner.querySelectorAll(".message")];

    if(!messages.length) return;

    const firstUser =
        chatInner.querySelector(".message.user .bubble");

    if(!firstUser) return;

    const title =
        firstUser.innerText.substring(0,45);

    let chats =
        JSON.parse(localStorage.getItem("sparky_chats") || "[]");

    if(!chats.includes(title)){

        chats.unshift(title);

        chats = chats.slice(0,40);

        localStorage.setItem(
            "sparky_chats",
            JSON.stringify(chats)
        );

        renderHistory();

    }
}


function renderHistory(){

    const chats =
        JSON.parse(localStorage.getItem("sparky_chats") || "[]");

    history.innerHTML = "";

    chats.forEach(title => {

        const item =
            document.createElement("div");

        item.className = "history-item";

        item.textContent = title;

        item.onclick = () => {

            input.value = title;

            input.focus();

        };

        history.appendChild(item);

    });
}


/* =========================================================
   NUEVO PROYECTO
========================================================= */

document.getElementById("newProject")
    .addEventListener("click",() => {

        chatInner.innerHTML = "";

        chatInner.appendChild(welcome);

        welcome.style.display = "flex";

        greetingShown = false;
        pendingDuration = false;
        currentProject = null;

        input.value = "";

    });


/* =========================================================
   MOBILE MENU
========================================================= */

document.getElementById("mobileMenu")
    .addEventListener("click",() => {

        document
            .getElementById("sidebar")
            .classList.toggle("open");

    });


/* =========================================================
   ATAJOS
========================================================= */

document.addEventListener("keydown",e => {

    if(e.key === "/" && document.activeElement !== input){

        e.preventDefault();

        input.focus();

    }

    if(e.key === "Escape"){

        document
            .getElementById("sidebar")
            .classList.remove("open");

    }

});


/* =========================================================
   INICIO
========================================================= */

renderHistory();

setTimeout(() => {

    document.getElementById("splash").style.display = "none";

},3200);

</script>
