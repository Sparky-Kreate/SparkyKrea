    </main>

    <script>
        let conversations = JSON.parse(localStorage.getItem('sparkykrea_chats')) || [];
        let currentChatId = null;
        let pendingTopic = null;
        let pendingDetail = null;
        let awaitingSpecificQuestion = false;

        function getTimeGreeting() {
            const hour = new Date().getHours();
            if (hour >= 5 && hour < 12) return 'Estimado usuario, tenga muy buenos días.';
            if (hour >= 12 && hour < 19) return 'Es un placer saludarle, tenga muy buenas tardes.';
            return 'Le damos la más cordial bienvenida, tenga excelentes noches.';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const greetingText = `¡Hola! ${getTimeGreeting()} ¿En qué proyecto publicitario le gustaría que colaboremos el día de hoy?`;
            document.getElementById('dynamic-greeting').textContent = greetingText;
            renderSidebar();
        });

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function startNewChat() {
            currentChatId = Date.now().toString();
            pendingTopic = null;
            pendingDetail = null;
            awaitingSpecificQuestion = false;
            document.getElementById('welcome-screen').classList.remove('hidden');
            document.getElementById('messages-list').classList.add('hidden');
            document.getElementById('messages-list').innerHTML = '';
            document.getElementById('user-input').value = '';
            
            const sidebar = document.getElementById('sidebar');
            if (!sidebar.classList.contains('-translate-x-full')) {
                toggleSidebar();
            }
        }

        function deleteChat(id, e) {
            e.stopPropagation();
            conversations = conversations.filter(c => c.id !== id);
            localStorage.setItem('sparkykrea_chats', JSON.stringify(conversations));
            if (currentChatId === id) {
                startNewChat();
            } else {
                renderSidebar();
            }
        }

        function isSimpleGreeting(text) {
            const clean = text.toLowerCase().trim().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
            const greetings = ['hola', 'buenas', 'buenas tardes', 'buenos dias', 'buenas noches', 'que tal', 'saludos', 'xd', 'lol', 'hey', 'ok', 'oigan'];
            return greetings.includes(clean) || clean.length <= 3;
        }

        function handleSend(e) {
            if (e) e.preventDefault();
            const input = document.getElementById('user-input');
            const query = input.value.trim();
            if (!query) return;

            if (!currentChatId) {
                currentChatId = Date.now().toString();
            }

            document.getElementById('welcome-screen').classList.add('hidden');
            const messagesList = document.getElementById('messages-list');
            messagesList.classList.remove('hidden');

            messagesList.innerHTML += `
                <div class="flex gap-2.5 justify-end">
                    <div class="bg-brandVinotinto text-white py-2 px-3 rounded-xl rounded-tr-none max-w-[85%] text-xs shadow-md">
                        ${escapeHtml(query)}
                    </div>
                </div>
            `;

            input.value = '';
            scrollToBottom();

            const loadingId = 'loading-' + Date.now();
            messagesList.innerHTML += `
                <div id="${loadingId}" class="flex gap-2.5 justify-start items-center text-gray-400 text-xs py-1">
                    <div class="w-6 h-6 rounded-lg bg-darkCard border border-darkBorder flex items-center justify-center text-brandVerde">
                        <i class="fa-solid fa-spinner fa-spin text-[10px]"></i>
                    </div>
                    <span class="text-[11px]">Diseñando estrategia publicitaria con elegancia...</span>
                </div>
            `;
            scrollToBottom();

            setTimeout(() => {
                document.getElementById(loadingId)?.remove();
                const botResponse = processPublicityRequest(query);

                messagesList.innerHTML += `
                    <div class="flex gap-2.5 justify-start">
                        <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-brandVinotinto to-brandVerde flex-shrink-0 flex items-center justify-center text-white font-bold text-[10px] shadow-md">
                            SK
                        </div>
                        <div class="bg-darkCard border border-darkBorder text-gray-200 p-3 rounded-xl rounded-tl-none max-w-[90%] text-xs leading-relaxed shadow-md space-y-2">
                            ${botResponse}
                        </div>
                    </div>
                `;
                
                saveMessageToHistory(query, botResponse);
                scrollToBottom();
            }, 400);
        }

        function selectDurationFromDropdown(val) {
            if (!val) return;
            if (val === 'custom') {
                const customVal = prompt("Por favor, indique la duración deseada de forma exacta (Ejemplo: 45 segundos, 2 minutos):");
                if (customVal) {
                    document.getElementById('user-input').value = customVal;
                    handleSend();
                }
            } else {
                document.getElementById('user-input').value = val;
                handleSend();
            }
        }

        function parseDurationInSeconds(text) {
            const clean = text.toLowerCase();
            let minutes = 0;
            let seconds = 0;

            const minMatch = clean.match(/(\d+)\s*(min|minuto|minutos)/);
            const secMatch = clean.match(/(\d+)\s*(seg|segundo|segundos)/);
            const onlyNumberMatch = clean.match(/(\d+)/);

            if (minMatch) minutes = parseInt(minMatch[1]);
            if (secMatch) seconds = parseInt(secMatch[1]);

            if (!minMatch && !secMatch && onlyNumberMatch) {
                const num = parseInt(onlyNumberMatch[1]);
                if (num <= 10) minutes = num;
                else seconds = num;
            }

            const totalSeconds = (minutes * 60) + seconds;
            return totalSeconds > 0 ? totalSeconds : 30;
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // GENERADOR DE GUIONES RECARGADO CON MÚLTIPLES IDEAS Y TÉCNICAS
        function generateSpecificScript(topic, detail, totalSeconds) {
            const topicClean = (topic + " " + (detail || "")).toLowerCase();
            let steps = [];
            let creativeHooks = [];
            let visualEffectsIdeas = [];

            // PIZZERÍA / RESTAURANT / COMIDA
            if (topicClean.includes("piz") || topicClean.includes("restauran") || topicClean.includes("comida") || topicClean.includes("burger") || topicClean.includes("cafe")) {
                creativeHooks = [
                    "🔥 <strong>Enfoque Sensorial Exquisito:</strong> 'El arte culinario se define en el primer aroma que despierta tus sentidos.'",
                    "🔥 <strong>Enfoque Dinámico POV:</strong> 'Permítame mostrarle el detrás de escena del platillo más codiciado de la ciudad.'",
                    "🔥 <strong>Enfoque Urgencia Elegante:</strong> 'Una receta tradicional perfeccionada para transformar su noche ordinaria en una experiencia memorable.'"
                ];
                visualEffectsIdeas = [
                    "✨ <strong>Macro Shot de Texturas:</strong> Tomas extremadamente cercanas al queso fundiéndose y el dorado perfecto de la masa.",
                    "✨ <strong>Transición Lumínica:</strong> Destello de luz cálida simulando la salida directa del horno de piedra."
                ];

                if (totalSeconds <= 20) {
                    steps = [
                        { time: "0:00 - 0:04", visual: "Plano cenital elegante abriendo un empaque artesanal con salida de vapor sutil.", audio: "Música instrumental refinada + 'La excelencia gastronómica ahora a su alcance.'" },
                        { time: "0:04 - 0:14", visual: "Secuencia rítmica de ingredientes frescos, aceites de oliva y emplatado impecable.", audio: "Ritmo comercial sofisticado + 'Ingredientes seleccionados con riguroso estándar de calidad.'" },
                        { time: "0:14 - 0:20", visual: "Plano final con datos de contacto, ubicación y distintivo de la marca.", audio: "Locución pausada: 'Permítanos consentir su paladar hoy mismo.'" }
                    ];
                } else {
                    const t1 = formatTime(Math.floor(totalSeconds * 0.25));
                    const t2 = formatTime(Math.floor(totalSeconds * 0.65));
                    const tFinal = formatTime(totalSeconds);
                    steps = [
                        { time: `0:00 - ${t1}`, visual: "Presentación institucional en primera persona dando la bienvenida al establecimiento con total hospitalidad.", audio: "Banda sonora cálida y acogedora + 'Sean bienvenidos a un espacio donde la tradición se fusiona con el buen gusto.'" },
                        { time: `${t1} - ${t2}`, visual: "Elaboración artesanal detallada: amasado profesional, selección de especias y horneado controlado.", audio: "Efectos sonoros limpios y voz guía describiendo cada paso con elegancia." },
                        { time: `${t2} - ${tFinal}`, visual: "Cierre corporativo mostrando el producto final servido en mesa con vajilla distinguida.", audio: "Locución final: 'Visítenos o realice su pedido preferencial a través de nuestros canales oficiales.'" }
                    ];
                }
            } 
            // GAMING / VALORANT / LOL / TFT / STREAMERS
            else if (topicClean.includes("valorant") || topicClean.includes("lol") || topicClean.includes("league") || topicClean.includes("tft") || topicClean.includes("game") || topicClean.includes("juego")) {
                const char = detail ? detail : "el personaje seleccionado";
                creativeHooks = [
                    "🔥 <strong>Enfoque Táctico Magistral:</strong> 'La maestría en el competitivo no depende del azar, sino de la precisión absoluta con " + char + ".'",
                    "🔥 <strong>Enfoque Analítico:</strong> 'Desglosamos la estrategia definitiva que transformará su rendimiento en cada partida clasificatoria.'"
                ];
                visualEffectsIdeas = [
                    "✨ <strong>Superposición HUD Avanzada:</strong> Gráficos esquemáticos flotantes con análisis de mapa y timing de habilidades.",
                    "✨ <strong>Cámara Lenta Dinámica:</strong> Efecto cinematográfico en el instante preciso de la jugada clave (Clutch)."
                ];

                steps = [
                    { time: "0:00 - 0:05", visual: `Secuencia cinemática de alta definición mostrando la habilidad definitiva de ${char}.`, audio: "Música electrónica envolvente + 'Eleve su nivel de juego al siguiente peldaño estratégico.'" },
                    { time: "0:05 - " + formatTime(Math.floor(totalSeconds * 0.8)), visual: "Demostración de jugabilidad en tiempo real con marcas tácticas y explicación paso a paso de posicionamiento.", audio: "Locución técnica, clara y pulida orientada al rendimiento del espectador." },
                    { time: formatTime(Math.floor(totalSeconds * 0.8)) + " - " + formatTime(totalSeconds), visual: "Pantalla de cierre corporativa invitando a formar parte de la comunidad exclusiva.", audio: "CTA: 'Suscríbase y perfeccione su estilo de juego con nosotros.'" }
                ];
            }
            // FUTBOL / DEPORTES / ATLETAS
            else if (topicClean.includes("fut") || topicClean.includes("deporte") || topicClean.includes("equip") || topicClean.includes("entrena")) {
                const target = detail ? detail : "el atleta profesional";
                creativeHooks = [
                    "🔥 <strong>Enfoque de Élite:</strong> 'La verdadera grandeza deportiva se construye en la constancia silenciosa de cada entrenamiento.'",
                    "🔥 <strong>Enfoque Motivacional Sofisticado:</strong> 'Superar los límites establecidos requiere disciplina, visión y el equipamiento adecuado.'"
                ];
                visualEffectsIdeas = [
                    "✨ <strong>Cámara Lenta Dramática (240fps):</strong> Detalle del impacto sobre el césped o la tensión muscular en máxima competencia.",
                    "✨ <strong>Corrección de Color Cinemática:</strong> Tonos contrastados y elegantes que realzan la épica del momento."
                ];

                steps = [

                    { time: "0:06 - " + formatTime(Math.floor(totalSeconds * 0.75)), visual: "Montaje dinámico de jugadas técnicas, velocidad de ejecución y dominio absoluto del balón.", audio: "Efectos ambientales de estadio y voz institucional." },
                    { time: formatTime(Math.floor(totalSeconds * 0.75)) + " - " + formatTime(totalSeconds), visual: "Exhibición de indumentaria de alto rendimiento con logotipo corporativo central.", audio: "CTA: 'Equípate con la distinción de los profesionales.'" }
                ];
            }
            // GENERAL / PRODUCTOS / SERVICIOS
            else {
                creativeHooks = [
                    "🔥 <strong>Enfoque de Solución Ejecutiva:</strong> 'Descubra cómo optimizar su tiempo y recursos mediante una solución diseñada para exigentes.'",
                    "🔥 <strong>Enfoque de Innovación:</strong> 'Una propuesta vanguardista creada para redefinir los estándares de su sector.'"
                ];
                visualEffectsIdeas = [
                    "✨ <strong>Comparativa de Precisión:</strong> Pantalla dividida mostrando la eficiencia operativa antes y después.",
                    "✨ <strong>Tipografía Cinematográfica:</strong> Transiciones limpias de texto minimalista en tonos blancos y dorados/verdes."
                ];

                const t1 = formatTime(Math.floor(totalSeconds * 0.25));
                const t2 = formatTime(Math.floor(totalSeconds * 0.75));
                const tFinal = formatTime(totalSeconds);
                steps = [
                    { time: `0:00 - ${t1}`, visual: "Plano general estético que contextualiza la solución a una necesidad corporativa o personal.", audio: "Introducción auditiva pulida y profesional + 'Presentamos una alternativa concebida para la excelencia.'" },
                    { time: `${t1} - ${t2}`, visual: "Demostración de atributos, calidad de materiales o funcionamiento impecable en primer plano.", audio: "Exposición detallada de los beneficios diferenciales de la marca." },
                    { time: `${t2} - ${tFinal}`, visual: "Cierre institucional con sello de garantía y medios oficiales de contacto.", audio: "Locución de cierre: 'Le invitamos a conocer más detalles a través de nuestros canales corporativos.'" }
                ];
            }

            return {
                hooks: creativeHooks,
                sfx: visualEffectsIdeas,
                scriptSteps: steps.map(s => `
                    <div class="border-l-2 border-brandVerde pl-2.5 my-1.5 space-y-0.5">
                        <p class="font-bold text-white text-[11px]">🎬 <span>Toma ${s.time}</span></p>
                        <p class="text-gray-300">📹 <strong>Visual:</strong> ${s.visual}</p>
                        <p class="text-gray-400">🎙️ <strong>Audio & Locución:</strong> ${s.audio}</p>
                    </div>
                `).join("")
            };
        }

        // BANDA SONORA RECARGADA CON UNA AMPLIA GAMA DE CANTANTES Y GÉNEROS
        function getDiverseMusicSugg() {
            return `
                <ul class="space-y-1.5 text-gray-300 text-[11px]">
                    <li>🎵 <strong>Pop Contemporáneo & Comercial:</strong> Artistas de referencia: <em>Dua Lipa, Taylor Swift, The Weeknd, Ariana Grande, Harry Styles, Bruno Mars</em>. Ideal para dar un toque moderno, comercial y elegante a cualquier marca.</li>
                    <li>🔥 <strong>Urbano, Reggaetón & Latin Trap:</strong> Artistas de referencia: <em>Bad Bunny, Rosalía, J Balvin, Karol G, Feid, Rauw Alejandro, Daddy Yankee</em>. Perfecto para producciones enérgicas, juveniles y de alto impacto visual.</li>
                    <li>🎸 <strong>Rock, Indie & Alternativo:</strong> Artistas de referencia: <em>Arctic Monkeys, Imagine Dragons, Coldplay, Tame Impala, The Killers, Queen</em>. Excelente para transmitir dinamismo, fuerza y prestigio.</li>
                    <li>🎧 <strong>Lofi, Chillhop & Instrumental Acústico:</strong> Artistas de referencia: <em>Lofi Girl, Joji, Tomppabeats, Norah Jones, Ludovico Einaudi</em>. Recomendado para establecimientos tranquilos, cafeterías, spas o tutoriales explicativos.</li>
                    <li>🎻 <strong>Clásica, Orquestal & Épica Cinemática:</strong> Artistas de referencia: <em>Hans Zimmer, Ludwig Göransson, Max Richter, Antonio Vivaldi</em>. Ideal para dar solemnidad, categoría superior y profundidad emocional a marcas de lujo o deportes.</li>
                    <li>🎹 <strong>Jazz, Soul & R&B Sofisticado:</strong> Artistas de referencia: <em>Frank Sinatra, Amy Winehouse, Alicia Keys, John Legend, Sade</em>. Indispensable para restaurantes exclusivos, coctelerías y servicios de alta gama.</li>
                </ul>
            `;
        }

        function processPublicityRequest(input) {
            const clean = input.toLowerCase().trim();
            const greeting = getTimeGreeting();

            // CASO 1: Saludo simple
            if (isSimpleGreeting(clean) && !pendingTopic && !awaitingSpecificQuestion) {
                return `<p>Es un verdadero placer saludarle. ${greeting} ¿Qué producto, marca o servicio exclusivo le gustaría que desarrollemos hoy?</p>`;
            }

            // CASO 2: Respondiendo a una PREGUNTA ESPECÍFICA previa (ej. ¿Qué personaje? ¿Qué futbolista?)
            if (awaitingSpecificQuestion) {
                pendingDetail = input;
                awaitingSpecificQuestion = false;

                return `
                    <div class="space-y-2">
                        <p>Hemos tomado nota de su selección: <strong class="text-brandVerde">"${escapeHtml(input)}"</strong>. Una elección sumamente acertada. 🎯</p>
                        <p class="text-gray-300">Para continuar con la estructuración técnica, le solicitamos seleccionar o indicar la duración prevista para este material audiovisual:</p>
                        
                        <div class="pt-1">
                            <select onchange="selectDurationFromDropdown(this.value)" class="w-full bg-darkSidebar border border-darkBorder hover:border-brandVerde text-gray-200 text-xs rounded-xl p-2 focus:outline-none cursor-pointer transition">
                                <option value="">⏱️ Seleccione la duración estimada...</option>
                                <option value="15 segundos">15 Segundos (Formato Breve / Reels)</option>
                                <option value="30 segundos">30 Segundos (Spot Publicitario Estándar)</option>
                                <option value="60 segundos">1 Minuto (Presentación Ejecutiva)</option>
                                <option value="3 minutos">3 Minutos (Formato Detallado)</option>
                                <option value="custom">✍️ Especificar duración personalizada...</option>
                            </select>
                        </div>
                    </div>
                `;
            }

            const hasTimeKeywords = /(\d+|segundo|segundos|minuto|minutos|min|seg)/i.test(clean);
            
            // CASO 3: Ya tenemos el tema y nos dan la duración del video
            if (pendingTopic && hasTimeKeywords) {
                const totalSec = parseDurationInSeconds(clean);
                const generated = generateSpecificScript(pendingTopic, pendingDetail, totalSec);
                const mainTopic = pendingTopic;
                const detailTopic = pendingDetail;

                pendingTopic = null;
                pendingDetail = null;

                return `
                    <div class="space-y-3">
                        <div class="border-b border-darkBorder pb-1.5">
                            <h2 class="text-xs font-bold text-brandVerde">🎬 Propuesta Guionizada & Asesoría Creativa Profesional</h2>
                            <p class="text-[11px] text-gray-400">Campaña: <strong class="text-white">${escapeHtml(mainTopic)} ${detailTopic ? '(' + escapeHtml(detailTopic) + ')' : ''}</strong> | Duración: <strong class="text-white">${formatTime(totalSec)}</strong></p>
                        </div>

                        <!-- IDEAS DE GANCHOS Y ENFOQUES -->
                        <div class="bg-darkSidebar p-2.5 rounded-xl border border-darkBorder text-[11px] space-y-1">
                            <p class="text-brandVerde font-bold uppercase tracking-wider">💡 ESTRATEGIAS DE APERTURA (PRIMEROS SEGUNDOS):</p>
                            ${generated.hooks.join('<br>')}
                        </div>

                        <!-- GUION PASO A PASO -->
                        <div class="bg-darkSidebar p-2.5 rounded-xl border border-darkBorder text-[11px]">
                            <p class="text-brandVerde font-bold uppercase tracking-wider mb-1.5">📜 GUION TÉCNICO Y PLANIFICACIÓN DE TOMAS:</p>
                            ${generated.scriptSteps}
                        </div>

                        <!-- IDEAS DE EFECTOS Y TRANSICIONES -->
                        <div class="bg-darkSidebar p-2.5 rounded-xl border border-darkBorder text-[11px] space-y-1">
                            <p class="text-brandVerde font-bold uppercase tracking-wider">⚡ RECOMENDACIONES VISUALES Y ESTÉTICAS:</p>
                            ${generated.sfx.join('<br>')}
                            <p>• <strong>Dinámica de edición:</strong> Se sugiere alternar la escala de planos de manera fluida para sostener la atención del espectador.</p>
                        </div>

                        <!-- MÚSICA RECOMENDADA CON ARTISTAS -->
                        <div class="bg-darkSidebar p-2.5 rounded-xl border border-darkBorder text-[11px] space-y-1">
                            <p class="text-brandVerde font-bold uppercase tracking-wider">🎵 SELECCIÓN MUSICAL Y REFERENTES ARTÍSTICOS:</p>
                            ${getDiverseMusicSugg()}
                        </div>
                    </div>
                `;
            }

            // CASO 4: Nueva solicitud. EVALUAR SI REQUIERE PREGUNTA ESPECÍFICA
            pendingTopic = input;

            if (clean.includes("valorant") || clean.includes("lol") || clean.includes("league of legends") || clean.includes("tft") || clean.includes("overwatch") || clean.includes("free fire")) {
                awaitingSpecificQuestion = true;
                return `
                    <div class="space-y-2">
                        <p>Excelente elección. Para estructurar la campaña publicitaria de <strong class="text-brandVerde">"${escapeHtml(input)}"</strong> con el máximo nivel de rigor:</p>
                        <p class="text-gray-300">🎮 <strong>¿Podría indicarnos qué Agente, Campeón o Personaje específico desea que encabece el foco de este anuncio?</strong></p>
                    </div>
                `;
            }

            if (clean.includes("futbol") || clean.includes("fútbol") || clean.includes("futbolista") || clean.includes("deporte") || clean.includes("equipo")) {
                awaitingSpecificQuestion = true;
                return `
                    <div class="space-y-2">
                        <p>Comprendido perfectamente. Para dotar a esta producción deportiva sobre <strong class="text-brandVerde">"${escapeHtml(input)}"</strong> de una narrativa impecable:</p>
                        <p class="text-gray-300">⚽ <strong>¿Qué futbolista, atleta o institución deportiva será el protagonista central de esta pieza?</strong></p>
                    </div>
                `;
            }

            // Para negocios directos pasa directamente a la duración
            return `
                <div class="space-y-2">
                    <p>Es un honor colaborar en el desarrollo publicitario de <strong class="text-brandVerde">"${escapeHtml(input)}"</strong>.</p>
                    <p class="text-gray-300">Le rogamos nos indique la duración estimada del material audiovisual para estructurar las secuencias técnicas con precisión:</p>
                    
                    <div class="pt-1">
                        <select onchange="selectDurationFromDropdown(this.value)" class="w-full bg-darkSidebar border border-darkBorder hover:border-brandVerde text-gray-200 text-xs rounded-xl p-2 focus:outline-none cursor-pointer transition">
                            <option value="">⏱️ Seleccione la duración estimada...</option>
                            <option value="15 segundos">15 Segundos (Formato Breve / Reels)</option>
                            <option value="30 segundos">30 Segundos (Spot Publicitario Estándar)</option>
                            <option value="60 segundos">1 Minuto (Presentación Ejecutiva)</option>
                            <option value="3 minutos">3 Minutos (Formato Detallado)</option>
                            <option value="custom">✍️ Especificar duración personalizada...</option>
                        </select>
                    </div>
                </div>
            `;
        }

        function scrollToBottom() {
            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;
        }

        function saveMessageToHistory(userText, botText) {
            let chat = conversations.find(c => c.id === currentChatId);
            if (!chat) {
                chat = { 
                    id: currentChatId, 
                    title: userText.substring(0, 20) + (userText.length > 20 ? '...' : ''),
                    messages: [] 
                };
                conversations.unshift(chat);
            }
            
            chat.messages.push({ sender: 'user', text: userText });
            chat.messages.push({ sender: 'bot', text: botText });

            localStorage.setItem('sparkykrea_chats', JSON.stringify(conversations));
            renderSidebar();
        }

        function renderSidebar() {
            const historyContainer = document.getElementById('chat-history');
            if (conversations.length === 0) {
                historyContainer.innerHTML = `<div class="text-[11px] text-gray-500 italic px-2 py-1">Sin campañas guardadas</div>`;
                return;
            }
            historyContainer.innerHTML = '';
            conversations.forEach(c => {
                const active = c.id === currentChatId;
                historyContainer.innerHTML += `
                    <div onclick="selectChat('${c.id}')" class="group flex items-center justify-between px-2.5 py-1.5 rounded-lg cursor-pointer text-xs transition ${active ? 'bg-brandVinotinto/30 border border-brandVinotinto/50 text-white font-medium' : 'text-gray-400 hover:bg-darkCard hover:text-gray-200'}">
                        <div class="flex items-center gap-2 truncate">
                            <i class="fa-solid fa-film text-brandVerde text-[10px]"></i>
                            <span class="truncate text-[11px]">${escapeHtml(c.title)}</span>
                        </div>
                        <button onclick="deleteChat('${c.id}', event)" class="opacity-0 group-hover:opacity-100 p-1 text-gray-500 hover:text-rose-400 transition" title="Eliminar chat">
                            <i class="fa-solid fa-trash-can text-[10px]"></i>
                        </button>
                    </div>
                `;
            });
        }

        function selectChat(id) {
            currentChatId = id;
            const chat = conversations.find(c => c.id === id);
            if (!chat) return;

            document.getElementById('welcome-screen').classList.add('hidden');
            const messagesList = document.getElementById('messages-list');
            messagesList.classList.remove('hidden');
            messagesList.innerHTML = '';

            chat.messages.forEach(m => {
                if (m.sender === 'user') {
                    messagesList.innerHTML += `
                        <div class="flex gap-2.5 justify-end">
                            <div class="bg-brandVinotinto text-white py-2 px-3 rounded-xl rounded-tr-none max-w-[85%] text-xs shadow-md">
                                ${escapeHtml(m.text)}
                            </div>
                        </div>
                    `;
                } else {
                    messagesList.innerHTML += `
                        <div class="flex gap-2.5 justify-start">
                            <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-brandVinotinto to-brandVerde flex-shrink-0 flex items-center justify-center text-white font-bold text-[10px] shadow-md">
                                SK
                            </div>
                            <div class="bg-darkCard border border-darkBorder text-gray-200 p-3 rounded-xl rounded-tl-none max-w-[90%] text-xs leading-relaxed shadow-md space-y-2">
                                ${m.text}
                            </div>
                        </div>
                    `;
                }
            });

            renderSidebar();
            scrollToBottom();

            const sidebar = document.getElementById('sidebar');
            if (!sidebar.classList.contains('-translate-x-full')) {
                toggleSidebar();
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
