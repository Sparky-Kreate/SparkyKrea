    </main>

    <script>
        let conversations = JSON.parse(localStorage.getItem('sparkykrea_chats')) || [];
        let currentChatId = null;
        let pendingTopic = null;
        let pendingDetail = null;
        let awaitingSpecificQuestion = false;

        function getTimeGreeting() {
            const hour = new Date().getHours();
            if (hour >= 5 && hour < 12) return '¡Buenos días!';
            if (hour >= 12 && hour < 19) return '¡Buenas tardes!';
            return '¡Buenas noches!';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const greetingText = `¡Hola! ${getTimeGreeting()} ¿En qué publicidad te puedo ayudar hoy?`;
            document.getElementById('dynamic-greeting').textContent = greetingText;
            renderSidebar();
        });

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function startNewChat() {
            currentChatId = Date.now().toString();
            pendingTopic = null;
            pendingDetail = null;
            awaitingSpecificQuestion = false;
            document.getElementById('welcome-screen').classList.remove('hidden');
            document.getElementById('messages-list').classList.add('hidden');
            document.getElementById('messages-list').innerHTML = '';
            document.getElementById('user-input').value = '';
            
            const sidebar = document.getElementById('sidebar');
            if (!sidebar.classList.contains('-translate-x-full')) {
                toggleSidebar();
            }
        }

        function deleteChat(id, e) {
            e.stopPropagation();
            conversations = conversations.filter(c => c.id !== id);
            localStorage.setItem('sparkykrea_chats', JSON.stringify(conversations));
            if (currentChatId === id) {
                startNewChat();
            } else {
                renderSidebar();
            }
        }

        function isSimpleGreeting(text) {
            const clean = text.toLowerCase().trim().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
            const greetings = ['hola', 'buenas', 'buenas tardes', 'buenos dias', 'buenas noches', 'que tal', 'saludos', 'xd', 'lol', 'hey', 'ok', 'oigan'];
            return greetings.includes(clean) || clean.length <= 3;
        }

        function handleSend(e) {
            if (e) e.preventDefault();
            const input = document.getElementById('user-input');
            const query = input.value.trim();
            if (!query) return;

            if (!currentChatId) {
                currentChatId = Date.now().toString();
            }

            document.getElementById('welcome-screen').classList.add('hidden');
            const messagesList = document.getElementById('messages-list');
            messagesList.classList.remove('hidden');

            messagesList.innerHTML += `
                <div class="flex gap-2.5 justify-end">
                    <div class="bg-brandVinotinto text-white py-2 px-3 rounded-xl rounded-tr-none max-w-[85%] text-xs shadow-md">
                        ${escapeHtml(query)}
                    </div>
                </div>
            `;

            input.value = '';
            scrollToBottom();

            const loadingId = 'loading-' + Date.now();
            messagesList.innerHTML += `
                <div id="${loadingId}" class="flex gap-2.5 justify-start items-center text-gray-400 text-xs py-1">
                    <div class="w-6 h-6 rounded-lg bg-darkCard border border-darkBorder flex items-center justify-center text-brandVerde">
                        <i class="fa-solid fa-spinner fa-spin text-[10px]"></i>
                    </div>
                    <span class="text-[11px]">Procesando...</span>
                </div>
            `;
            scrollToBottom();

            setTimeout(() => {
                document.getElementById(loadingId)?.remove();
                const botResponse = processPublicityRequest(query);

                messagesList.innerHTML += `
                    <div class="flex gap-2.5 justify-start">
                        <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-brandVinotinto to-brandVerde flex-shrink-0 flex items-center justify-center text-white font-bold text-[10px] shadow-md">
                            SK
                        </div>
                        <div class="bg-darkCard border border-darkBorder text-gray-200 p-3 rounded-xl rounded-tl-none max-w-[90%] text-xs leading-relaxed shadow-md space-y-2">
                            ${botResponse}
                        </div>
                    </div>
                `;
                
                saveMessageToHistory(query, botResponse);
                scrollToBottom();
            }, 400);
        }

        function selectDurationFromDropdown(val) {
            if (!val) return;
            if (val === 'custom') {
                const customVal = prompt("Ingresa la duración exacta (Ejemplo: 45 segundos, 2 minutos):");
                if (customVal) {
                    document.getElementById('user-input').value = customVal;
                    handleSend();
                }
            } else {
                document.getElementById('user-input').value = val;
                handleSend();
            }
        }

        function parseDurationInSeconds(text) {
            const clean = text.toLowerCase();
            let minutes = 0;
            let seconds = 0;

            const minMatch = clean.match(/(\d+)\s*(min|minuto|minutos)/);
            const secMatch = clean.match(/(\d+)\s*(seg|segundo|segundos)/);
            const onlyNumberMatch = clean.match(/(\d+)/);

            if (minMatch) minutes = parseInt(minMatch[1]);
            if (secMatch) seconds = parseInt(secMatch[1]);

            if (!minMatch && !secMatch && onlyNumberMatch) {
                const num = parseInt(onlyNumberMatch[1]);
                if (num <= 10) minutes = num;
                else seconds = num;
            }

            const totalSeconds = (minutes * 60) + seconds;
            return totalSeconds > 0 ? totalSeconds : 30;
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // GENERADOR DE GUIONES NARRATIVOS ESPECÍFICOS Y TÉCNICOS
        function generateSpecificScript(topic, detail, totalSeconds) {
            const topicClean = (topic + " " + (detail || "")).toLowerCase();
            let steps = [];

            // PIZZERÍA / RESTAURANTE
            if (topicClean.includes("piz") || topicClean.includes("restauran") || topicClean.includes("comida") || topicClean.includes("burger")) {
                if (totalSeconds <= 15) {
                    steps = [
                        { time: "0:00 - 0:04", visual: "Entra una llamada o notificación de pedido en pantalla. Transición rápida en primera persona a la cocina encendida.", audio: "SFX timbre de pedido + '¡Nos pidieron una especial en tiempo récord!'" },
                        { time: "0:04 - 0:11", visual: "Cortes ultra veloces: estirado de masa, queso derramándose y salsa fresca entrando al horno caliente.", audio: "Música alegre/rápida + 'Masa crujiente y los mejores ingredientes frescos.'" },
                        { time: "0:11 - 0:15", visual: "Caja cerrada entregándose al cliente en puerta con logo prominente y teléfono.", audio: "Locución: 'Pídela ya mismo con envío gratis aquí abajo.'" }
                    ];
                } else if (totalSeconds <= 30) {
                    steps = [
                        { time: "0:00 - 0:07", visual: "Cliente mirando su teléfono con hambre. Un repartidor abre la caja dejando salir vapor.", audio: "SFX crujido + '¿Antojo de algo verdaderamente artesanal?'" },
                        { time: "0:07 - 0:18", visual: "Plano cenital: preparación en vivo, tirando la masa, esparciendo quesos y horneado perfecto.", audio: "Voz en off: 'Preparada al momento con la receta tradicional de la casa.'" },
                        { time: "0:18 - 0:25", visual: "Corte de la rebanada en cámara lenta mostrando el hilo de queso derretido.", audio: "Música al máximo + 'Sabor inigualable desde el primer bocado.'" },
                        { time: "0:25 - 0:30", visual: "Muestra de la ubicación del local, menú rápido y botón de pedir en WhatsApp.", audio: "CTA: '¡Haz clic y recibe tu promoción 2x1 hoy!'" }
                    ];
                } else {
                    const t1 = formatTime(Math.floor(totalSeconds * 0.2));
                    const t2 = formatTime(Math.floor(totalSeconds * 0.5));
                    const t3 = formatTime(Math.floor(totalSeconds * 0.8));
                    const tFinal = formatTime(totalSeconds);
                    steps = [
                        { time: `0:00 - ${t1}`, visual: "Te entra un pedido especial al local y presentas las instalaciones en primera persona (POV) saludando al espectador.", audio: "Música de ambiente + 'Hoy les voy a mostrar cómo preparamos el pedido más grande del día.'" },
                        { time: `${t1} - ${t2}`, visual: "Proceso completo de preparación: amasado, aderezos especiales, horneado y emplatado técnico.", audio: "Efectos de sonido reales del horneado + Explicación del secreto del sabor de la casa." },
                        { time: `${t2} - ${t3}`, visual: "Reacción en vivo de un cliente o prueba de control de calidad por el chef al salir del horno.", audio: "Locución entusiasta: 'Crujiente, jugosa y lista para enviar a cualquier parte de la ciudad.'" },
                        { time: `${t3} - ${tFinal}`, visual: "Cierre con empaque elegante, promociones del mes y enlaces directos de pedido.", audio: "Locución final: 'Escribe a nuestro WhatsApp o visítanos en nuestro local.'" }
                    ];
                }
            } 
            // GAMING / VALORANT / LOL / TFT
            else if (topicClean.includes("valorant") || topicClean.includes("lol") || topicClean.includes("league") || topicClean.includes("tft") || topicClean.includes("game") || topicClean.includes("juego")) {
                const char = detail ? detail : "tu personaje favorito";
                if (totalSeconds <= 20) {
                    steps = [
                        { time: "0:00 - 0:05", visual: `Zoom in agresivo al agente/campeón (${char}) ejecutando una habilidad definitiva.`, audio: "SFX de habilidad gamer + 'Si juegas con este personaje, estabas cometiendo este error.'" },
                        { time: "0:05 - 0:14", visual: "Gameplay a 60fps comparando la jugada mala vs la estrategia pro correcta.", audio: "Música Trap/Phonk + 'Aplica esta alineación para dominar tus partidas esta semana.'" },
                        { time: "0:14 - 0:20", visual: "Pantalla con tu canal/stream o app gamer y botón de seguir/descargar.", audio: "Locución: 'Sígueme para no perderte la guía completa.'" }
                    ];
                } else {
                    const t1 = formatTime(Math.floor(totalSeconds * 0.25));
                    const t2 = formatTime(Math.floor(totalSeconds * 0.65));
                    const tFinal = formatTime(totalSeconds);
                    steps = [
                        { time: `0:00 - ${t1}`, visual: `Cinemática impactante de ${char} seguida de una jugada clave (Clutch/Pentakill).`, audio: "Drop de música electrónica + 'La mejor guía/combo para subir de rango con este pick.'" },
                        { time: `${t1} - ${t2}`, visual: "Explicación detallada en juego: armado de ítems, posicionamiento de habilidades y trucos de mapa.", audio: "Voz rápida y clara narrando cada movimiento clave sin tiempos muertos." },
                        { time: `${t2} - ${tFinal}`, visual: "Resumen de victorias, tabla de clasificación e invitación a unirse a la comunidad/discord.", audio: "CTA: 'Guarda este video y comparte con tu duo.'" }
                    ];
                }
            }
            // FUTBOL / DEPORTES
            else if (topicClean.includes("fut") || topicClean.includes("deporte") || topicClean.includes("equip") || topicClean.includes("entrena")) {
                const target = detail ? detail : "el atleta";
                steps = [
                    { time: "0:00 - 0:05", visual: `Primer plano de atado de agujetas y salto al campo de ${target}.`, audio: "Música Épica / Beats fuertes + 'La disciplina no descansa.'" },
                    { time: "0:05 - 0:20", visual: "Tomas de entrenamiento de alta intensidad, jugadas de habilidad y tiros a gol.", audio: "Voz motivacional + Sonido de balón e impacto." },
                    { time: "0:20 - " + formatTime(totalSeconds), visual: "Muestra de producto/marca deportiva usada y pantalla final con llamado a la acción.", audio: "CTA: 'Equípate como los profesionales. Enlace en bio.'" }
                ];
            }
            // GENERAL / PRODUCTOS / SERVICIOS
            else {
                const t1 = formatTime(Math.floor(totalSeconds * 0.2));
                const t2 = formatTime(Math.floor(totalSeconds * 0.7));
                const tFinal = formatTime(totalSeconds);
                steps = [
                    { time: `0:00 - ${t1}`, visual: "Plano de problema o necesidad común resuelta de forma directa y llamativa.", audio: "Gancho auditivo: 'Si estabas buscando la solución definitiva a esto, mira esto.'" },
                    { time: `${t1} - ${t2}`, visual: "Demostración práctica del servicio/producto en primera persona mostrando resultados inmediatos.", audio: "Explicación de características, calidad y valor diferencial." },
                    { time: `${t2} - ${tFinal}`, visual: "Toma estética final con oferta por tiempo limitado y llamado a actuar.", audio: "Locución final con promoción y llamada a la acción." }
                ];
            }

            return steps.map(s => `
                <div class="border-l-2 border-brandVerde pl-2.5 my-1.5 space-y-0.5">
                    <p class="font-bold text-white text-[11px]">🎬 <span>Toma ${s.time}</span></p>
                    <p class="text-gray-300">📹 <strong>Visual:</strong> ${s.visual}</p>
                    <p class="text-gray-400">🎙️ <strong>Audio:</strong> ${s.audio}</p>
                </div>
            `).join("");
        }

        // RECOMENDACIÓN DE MÚSICA DIVERSIFICADA CON ARTISTAS REALES
        function getDiverseMusicSugg() {
            return `
                <ul class="space-y-1 text-gray-300 text-[11px]">
                    <li>🔥 <strong>Urban / Trap / Phonk (Rápido & Dinámico):</strong> Estilo <em>Bad Bunny, Travis Scott, Bizarrap, Kordhell</em>. Ideal para enganchar jóvenes y clips de impacto.</li>
                    <li>✨ <strong>Pop Moderno / Electro House (Comercial & Alegre):</strong> Estilo <em>Dua Lipa, The Weeknd, Calvin Harris, Bruno Mars</em>. Perfecto para restaurantes, ropa y marcas.</li>
                    <li>🎧 <strong>Lofi Chill / Instrumental (Relajante & Explicativo):</strong> Estilo <em>Lofi Girl / ChilledCow, Tomppabeats, Kueq</em>. Ideal para tutoriales y negocios locales tranquilizadores.</li>
                    <li>🎸 <strong>Rock / Épico Motivado (Impacto & Fuerza):</strong> Estilo <em>Imagine Dragons, The Score, Hans Zimmer</em>. Excelente para deportes, fútbol y retos.</li>
                </ul>
            `;
        }

        function processPublicityRequest(input) {
            const clean = input.toLowerCase().trim();
            const greeting = getTimeGreeting();

            // CASO 1: Saludo simple
            if (isSimpleGreeting(clean) && !pendingTopic && !awaitingSpecificQuestion) {
                return `<p>${greeting} ¿En qué producto, marca, juego o servicio te puedo ayudar a promocionar hoy?</p>`;
            }

            // CASO 2: Respondiendo a una PREGUNTA ESPECÍFICA previa (ej. ¿Qué personaje? ¿Qué futbolista?)
            if (awaitingSpecificQuestion) {
                pendingDetail = input;
                awaitingSpecificQuestion = false;

                return `
                    <div class="space-y-2">
                        <p>¡Excelente elección con <strong class="text-brandVerde">"${escapeHtml(input)}"</strong>! 🎯</p>
                        <p class="text-gray-300">Ahora, selecciona o dime la duración de tu video publicitario para armarte el guion técnico exacto:</p>
                        
                        <div class="pt-1">
                            <select onchange="selectDurationFromDropdown(this.value)" class="w-full bg-darkSidebar border border-darkBorder hover:border-brandVerde text-gray-200 text-xs rounded-xl p-2 focus:outline-none cursor-pointer transition">
                                <option value="">⏱️ Selecciona la duración del video...</option>
                                <option value="15 segundos">15 Segundos (TikTok / Reels)</option>
                                <option value="30 segundos">30 Segundos (Publicidad Estándar)</option>
                                <option value="60 segundos">1 Minuto (Demostración Completa)</option>
                                <option value="3 minutos">3 Minutos (Video Extenso)</option>
                                <option value="custom">✍️ Escribir tiempo personalizado...</option>
                            </select>
                        </div>
                    </div>
                `;
            }

            const hasTimeKeywords = /(\d+|segundo|segundos|minuto|minutos|min|seg)/i.test(clean);
            
            // CASO 3: Ya tenemos el tema y nos dan la duración del video
            if (pendingTopic && hasTimeKeywords) {
                const totalSec = parseDurationInSeconds(clean);
                const scriptHTML = generateSpecificScript(pendingTopic, pendingDetail, totalSec);
                const mainTopic = pendingTopic;
                const detailTopic = pendingDetail;

                pendingTopic = null;
                pendingDetail = null;

                return `
                    <div class="space-y-3">
                        <div class="border-b border-darkBorder pb-1.5">
                            <h2 class="text-xs font-bold text-brandVerde">🎬 Guion Publicitario Técnico & Plan de Rodaje</h2>
                            <p class="text-[11px] text-gray-400">Proyecto: <strong class="text-white">${escapeHtml(mainTopic)} ${detailTopic ? '(' + escapeHtml(detailTopic) + ')' : ''}</strong> | Tiempo Total: <strong class="text-white">${formatTime(totalSec)}</strong></p>
                        </div>

                        <!-- GUION PASO A PASO PASO A PASO -->
                        <div class="bg-darkSidebar p-2.5 rounded-xl border border-darkBorder text-[11px]">
                            <p class="text-brandVerde font-bold uppercase tracking-wider mb-1.5">📜 GUION Y DIRECCIÓN DE CÁMARA:</p>
                            ${scriptHTML}
                        </div>

                        <!-- PLAN DE GRABACIÓN -->
                        <div class="bg-darkSidebar p-2.5 rounded-xl border border-darkBorder text-[11px] space-y-1">
                            <p class="text-brandVerde font-bold uppercase tracking-wider">🎥 CONSEJOS TÉCNICOS DE PRODUCCIÓN:</p>
                            <p>• <strong>Ritmo de corte:</strong> Cambia de plano o toma cada 2.5 a 4 segundos para evitar que la audiencia pierda interés.</p>
                            <p>• <strong>Iluminación:</strong> Asegura luz suave sobre la acción principal y mantén los textos centrados para legibilidad móvil.</p>
                        </div>

                        <!-- MÚSICA RECOMENDADA CON ARTISTAS -->
                        <div class="bg-darkSidebar p-2.5 rounded-xl border border-darkBorder text-[11px] space-y-1">
                            <p class="text-brandVerde font-bold uppercase tracking-wider">🎵 ARTISTAS Y BANDA SONORA RECOMENDADA:</p>
                            ${getDiverseMusicSugg()}
                        </div>
                    </div>
                `;
            }

            // CASO 4: Nueva solicitud. EVALUAR SI REQUIERE PREGUNTA ESPECÍFICA
            pendingTopic = input;

            // Detectar si requiere pregunta específica (Juegos, Deportes, etc.)
            if (clean.includes("valorant") || clean.includes("lol") || clean.includes("league of legends") || clean.includes("tft") || clean.includes("overwatch") || clean.includes("free fire")) {
                awaitingSpecificQuestion = true;
                return `
                    <div class="space-y-2">
                        <p>${greeting} ¡Excelente! Para hacer la publicidad de <strong class="text-brandVerde">"${escapeHtml(input)}"</strong> impecable:</p>
                        <p class="text-gray-300">🎮 <strong>¿Qué Agente, Campeón o Personaje específico vas a destacar o usar en esta publicidad?</strong></p>
                    </div>
                `;
            }

            if (clean.includes("futbol") || clean.includes("fútbol") || clean.includes("futbolista") || clean.includes("deporte") || clean.includes("equipo")) {
                awaitingSpecificQuestion = true;
                return `
                    <div class="space-y-2">
                        <p>${greeting} ¡Buenísimo! Para enfocar las tomas deportivas de <strong class="text-brandVerde">"${escapeHtml(input)}"</strong>:</p>
                        <p class="text-gray-300">⚽ <strong>¿Qué futbolista, atleta o equipo es el protagonista principal de esta campaña?</strong></p>
                    </div>
                `;
            }

            // Para negocios directos (Pizzería, Barbero, Tienda, etc.) pasa directamente al tiempo
            return `
                <div class="space-y-2">
                    <p>${greeting} ¡Listo! Trabajemos en la publicidad para <strong class="text-brandVerde">"${escapeHtml(input)}"</strong>.</p>
                    <p class="text-gray-300">¿Cuánto tiempo quieres que dure el video para armar la estructura exacta por tomas?</p>
                    
                    <div class="pt-1">
                        <select onchange="selectDurationFromDropdown(this.value)" class="w-full bg-darkSidebar border border-darkBorder hover:border-brandVerde text-gray-200 text-xs rounded-xl p-2 focus:outline-none cursor-pointer transition">
                            <option value="">⏱️ Selecciona la duración del video...</option>
                            <option value="15 segundos">15 Segundos (Shorts / TikTok)</option>
                            <option value="30 segundos">30 Segundos (Anuncio Estándar)</option>
                            <option value="60 segundos">1 Minuto (Presentación Completa)</option>
                            <option value="3 minutos">3 Minutos (Largo Formato)</option>
                            <option value="custom">✍️ Escribir tiempo personalizado...</option>
                        </select>
                    </div>
                </div>
            `;
        }

        function scrollToBottom() {
            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;
        }

        function saveMessageToHistory(userText, botText) {
            let chat = conversations.find(c => c.id === currentChatId);
            if (!chat) {
                chat = { 
                    id: currentChatId, 
                    title: userText.substring(0, 20) + (userText.length > 20 ? '...' : ''),
                    messages: [] 
                };
                conversations.unshift(chat);
            }
            
            chat.messages.push({ sender: 'user', text: userText });
            chat.messages.push({ sender: 'bot', text: botText });

            localStorage.setItem('sparkykrea_chats', JSON.stringify(conversations));
            renderSidebar();
        }

        function renderSidebar() {
            const historyContainer = document.getElementById('chat-history');
            if (conversations.length === 0) {
                historyContainer.innerHTML = `<div class="text-[11px] text-gray-500 italic px-2 py-1">Sin campañas guardadas</div>`;
                return;
            }
            historyContainer.innerHTML = '';
            conversations.forEach(c => {
                const active = c.id === currentChatId;
                historyContainer.innerHTML += `
                    <div onclick="selectChat('${c.id}')" class="group flex items-center justify-between px-2.5 py-1.5 rounded-lg cursor-pointer text-xs transition ${active ? 'bg-brandVinotinto/30 border border-brandVinotinto/50 text-white font-medium' : 'text-gray-400 hover:bg-darkCard hover:text-gray-200'}">
                        <div class="flex items-center gap-2 truncate">
                            <i class="fa-solid fa-film text-brandVerde text-[10px]"></i>
                            <span class="truncate text-[11px]">${escapeHtml(c.title)}</span>
                        </div>
                        <button onclick="deleteChat('${c.id}', event)" class="opacity-0 group-hover:opacity-100 p-1 text-gray-500 hover:text-rose-400 transition" title="Eliminar chat">
                            <i class="fa-solid fa-trash-can text-[10px]"></i>
                        </button>
                    </div>
                `;
            });
        }

        function selectChat(id) {
            currentChatId = id;
            const chat = conversations.find(c => c.id === id);
            if (!chat) return;

            document.getElementById('welcome-screen').classList.add('hidden');
            const messagesList = document.getElementById('messages-list');
            messagesList.classList.remove('hidden');
            messagesList.innerHTML = '';

            chat.messages.forEach(m => {
                if (m.sender === 'user') {
                    messagesList.innerHTML += `
                        <div class="flex gap-2.5 justify-end">
                            <div class="bg-brandVinotinto text-white py-2 px-3 rounded-xl rounded-tr-none max-w-[85%] text-xs shadow-md">
                                ${escapeHtml(m.text)}
                            </div>
                        </div>
                    `;
                } else {
                    messagesList.innerHTML += `
                        <div class="flex gap-2.5 justify-start">
                            <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-brandVinotinto to-brandVerde flex-shrink-0 flex items-center justify-center text-white font-bold text-[10px] shadow-md">
                                SK
                            </div>
                            <div class="bg-darkCard border border-darkBorder text-gray-200 p-3 rounded-xl rounded-tl-none max-w-[90%] text-xs leading-relaxed shadow-md space-y-2">
                                ${m.text}
                            </div>
                        </div>
                    `;
                }
            });

            renderSidebar();
            scrollToBottom();

            const sidebar = document.getElementById('sidebar');
            if (!sidebar.classList.contains('-translate-x-full')) {
                toggleSidebar();
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
