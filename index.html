<script>  
  
/* =========================================================  
   SPARKYKREA  
   MOTOR PUBLICITARIO PRO  
   ACTUALIZACIÓN  
   ========================================================= */  
  
  
let conversations =  
    JSON.parse(localStorage.getItem('sparkykrea_chats')) || [];  
  
let currentChatId = null;  
  
let pendingTopic = null;  
let pendingDetail = null;  
let pendingCategory = null;  
  
let awaitingCharacterChoice = false;  
let awaitingCharacterName = false;  
let awaitingDuration = false;  
  
  
/* =========================================================  
   SALUDOS  
   ========================================================= */  
  
const greetingsMorning = [  
    '¡Buenos días! 👋 ¿En qué puedo ayudarte hoy?',  
    '¡Buenos días! ☀️ ¿Qué vamos a crear hoy?',  
    '¡Buenos días! 👋 Cuéntame tu idea y empezamos.',  
    '¡Buenos días! ✨ ¿Qué proyecto tienes en mente?'  
];  
  
const greetingsAfternoon = [  
    '¡Buenas tardes! 👋 ¿En qué puedo ayudarte hoy?',  
    '¡Buenas tardes! ✨ ¿Qué vamos a crear hoy?',  
    '¡Buenas tardes! 👋 Cuéntame qué tienes en mente.',  
    '¡Buenas tardes! 🚀 Vamos a darle forma a esa idea.'  
];  
  
const greetingsNight = [  
    '¡Buenas noches! 🌙 ¿En qué puedo ayudarte hoy?',  
    '¡Buenas noches! ✨ ¿Listo para crear algo increíble?',  
    '¡Buenas noches! 👋 Cuéntame qué quieres preparar.',  
    '¡Buenas noches! 🚀 Vamos a convertir esa idea en algo genial.'  
];  
  
  
function randomItem(array) {  
    return array[Math.floor(Math.random() * array.length)];  
}  
  
  
function getTimeGreeting() {  
  
    const hour = new Date().getHours();  
  
    if (hour >= 5 && hour < 12) {  
        return randomItem(greetingsMorning);  
    }  
  
    if (hour >= 12 && hour < 19) {  
        return randomItem(greetingsAfternoon);  
    }  
  
    return randomItem(greetingsNight);  
}  
  
  
/* =========================================================  
   INICIO  
   ========================================================= */  
  
document.addEventListener('DOMContentLoaded', () => {  
  
    document.getElementById('dynamic-greeting').textContent =  
        getTimeGreeting();  
  
    renderSidebar();  
  
});  
  
  
/* =========================================================  
   SIDEBAR  
   ========================================================= */  
  
function toggleSidebar() {  
  
    const sidebar =  
        document.getElementById('sidebar');  
  
    const overlay =  
        document.getElementById('sidebar-overlay');  
  
    sidebar.classList.toggle('-translate-x-full');  
  
    overlay.classList.toggle('hidden');  
  
}  
  
  
function startNewChat() {  
  
    currentChatId = Date.now().toString();  
  
    pendingTopic = null;  
    pendingDetail = null;  
    pendingCategory = null;  
  
    awaitingCharacterChoice = false;  
    awaitingCharacterName = false;  
    awaitingDuration = false;  
  
    document  
        .getElementById('welcome-screen')  
        .classList.remove('hidden');  
  
    document  
        .getElementById('messages-list')  
        .classList.add('hidden');  
  
    document  
        .getElementById('messages-list')  
        .innerHTML = '';  
  
    document  
        .getElementById('user-input')  
        .value = '';  
  
    const sidebar =  
        document.getElementById('sidebar');  
  
    if (!sidebar.classList.contains('-translate-x-full')) {  
        toggleSidebar();  
    }  
  
}  
  
  
function deleteChat(id, e) {  
  
    e.stopPropagation();  
  
    conversations =  
        conversations.filter(c => c.id !== id);  
  
    localStorage.setItem(  
        'sparkykrea_chats',  
        JSON.stringify(conversations)  
    );  
  
    if (currentChatId === id) {  
  
        startNewChat();  
  
    } else {  
  
        renderSidebar();  
  
    }  
  
}  
  
  
/* =========================================================  
   SALUDOS DEL USUARIO  
   ========================================================= */  
  
function isSimpleGreeting(text) {  
  
    const clean =  
        text  
        .toLowerCase()  
        .trim()  
        .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");  
  
    const greetings = [  
        'hola',  
        'buenas',  
        'buenos dias',  
        'buenas tardes',  
        'buenas noches',  
        'que tal',  
        'saludos',  
        'hey',  
        'holaa',  
        'holaaa'  
    ];  
  
    return greetings.includes(clean);  
  
}  
  
  
/* =========================================================  
   DETECCIÓN DE CATEGORÍAS  
   ========================================================= */  
  
function detectCategory(text) {  
  
    const clean =  
        text  
        .toLowerCase()  
        .normalize("NFD")  
        .replace(/[\u0300-\u036f]/g, "");  
  
    if (  
        /\bvalorant\b/.test(clean) ||  
        /\blol\b/.test(clean) ||  
        /league of legends/.test(clean) ||  
        /\btft\b/.test(clean) ||  
        /\boverwatch\b/.test(clean) ||  
        /\bfree fire\b/.test(clean) ||  
        /\bfortnite\b/.test(clean) ||  
        /\bcall of duty\b/.test(clean) ||  
        /\bcod\b/.test(clean) ||  
        /\bapex\b/.test(clean) ||  
        /\bpubg\b/.test(clean) ||  
        /\bgta\b/.test(clean) ||  
        /\bminecraft\b/.test(clean) ||  
        /\bclash royale\b/.test(clean) ||  
        /\bjuego\b/.test(clean) ||  
        /\bgaming\b/.test(clean)  
    ) {  
        return 'gaming';  
    }  
  
  
    if (  
        /\bpizza\b/.test(clean) ||  
        /\bpizzeria\b/.test(clean) ||  
        /\brestaurante\b/.test(clean) ||  
        /\bcomida\b/.test(clean) ||  
        /\bburger\b/.test(clean) ||  
        /\bhamburguesa\b/.test(clean) ||  
        /\bcafe\b/.test(clean) ||  
        /\bcafeteria\b/.test(clean) ||  
        /\bpanaderia\b/.test(clean) ||  
        /\bpostre\b/.test(clean) ||  
        /\bhelado\b/.test(clean)  
    ) {  
        return 'food';  
    }  
  
  
    if (  
        /\bfutbol\b/.test(clean) ||  
        /\bfutbolista\b/.test(clean) ||  
        /\bdeporte\b/.test(clean) ||  
        /\bdeportivo\b/.test(clean) ||  
        /\bequipo\b/.test(clean) ||  
        /\bbaloncesto\b/.test(clean) ||  
        /\bbasket\b/.test(clean) ||  
        /\btenis\b/.test(clean)  
    ) {  
        return 'sports';  
    }  
  
  
    if (  
        /\bservicio\b/.test(clean) ||  
        /\btienda\b/.test(clean) ||  
        /\bmarca\b/.test(clean) ||  
        /\bproducto\b/.test(clean) ||  
        /\bnegocio\b/.test(clean)  
    ) {  
        return 'business';  
    }  
  
  
    return 'general';  
  
}  
  
  
/* =========================================================  
   ENVÍO  
   ========================================================= */  
  
function handleSend(e) {  
  
    if (e) e.preventDefault();  
  
    const input =  
        document.getElementById('user-input');  
  
    const query =  
        input.value.trim();  
  
    if (!query) return;  
  
  
    if (!currentChatId) {  
        currentChatId = Date.now().toString();  
    }  
  
  
    document  
        .getElementById('welcome-screen')  
        .classList.add('hidden');  
  
  
    const messagesList =  
        document.getElementById('messages-list');  
  
    messagesList.classList.remove('hidden');  
  
  
    messagesList.innerHTML += `  
  
        <div class="flex gap-2.5 justify-end">  
  
            <div class="bg-brandVinotinto text-white py-2 px-3 rounded-xl rounded-tr-none max-w-[85%] text-xs shadow-md">  
  
                ${escapeHtml(query)}  
  
            </div>  
  
        </div>  
  
    `;  
  
  
    input.value = '';  
  
    scrollToBottom();  
  
  
    const loadingId =  
        'loading-' + Date.now();  
  
  
    messagesList.innerHTML += `  
  
        <div id="${loadingId}"  
            class="flex gap-2.5 justify-start items-center text-gray-400 text-xs py-1">  
  
            <div class="w-6 h-6 rounded-lg bg-darkCard border border-darkBorder flex items-center justify-center text-brandVerde">  
  
                <i class="fa-solid fa-spinner fa-spin text-[10px]"></i>  
  
            </div>  
  
            <span class="text-[11px]">  
                Preparando una idea diferente...  
            </span>  
  
        </div>  
  
    `;  
  
  
    scrollToBottom();  
  
  
    setTimeout(() => {  
  
        document  
            .getElementById(loadingId)  
            ?.remove();  
  
  
        const botResponse =  
            processPublicityRequest(query);

/* =========================================================  
   PARSEAR DURACIÓN  
   ========================================================= */  
  
function parseDurationInSeconds(text) {  
  
    const clean =  
        text.toLowerCase();  
  
    let minutes = 0;  
    let seconds = 0;  
  
  
    const minMatch =  
        clean.match(/(\d+)\s*(min|minuto|minutos)/);  
  
    const secMatch =  
        clean.match(/(\d+)\s*(seg|segundo|segundos)/);  
  
    const onlyNumberMatch =  
        clean.match(/\b(\d+)\b/);  
  
  
    if (minMatch) {  
        minutes = parseInt(minMatch[1]);  
    }  
  
  
    if (secMatch) {  
        seconds = parseInt(secMatch[1]);  
    }  
  
  
    if (!minMatch && !secMatch && onlyNumberMatch) {  
  
        const num =  
            parseInt(onlyNumberMatch[1]);  
  
        if (num <= 10) {  
            minutes = num;  
        } else {  
            seconds = num;  
        }  
  
    }  
  
  
    const totalSeconds =  
        (minutes * 60) + seconds;  
  
  
    return totalSeconds > 0  
        ? totalSeconds  
        : 30;  
  
}  
  
  
function formatTime(sec) {  
  
    const m =  
        Math.floor(sec / 60);  
  
    const s =  
        sec % 60;  
  
    return `${m}:${s < 10 ? '0' : ''}${s}`;  
  
}  
  
  
/* =========================================================  
   GENERADOR DE TIEMPOS  
   ========================================================= */  
  
function createTimeline(totalSeconds, category) {  
  
    const safe =  
        Math.max(totalSeconds, 10);  
  
  
    let first =  
        Math.max(3, Math.floor(safe * 0.25));  
  
    let second =  
        Math.max(first + 2, Math.floor(safe * 0.65));  
  
  
    if (second >= safe) {  
        second = Math.max(first + 1, safe - 2);  
    }  
  
  
    if (first >= second) {  
        first = Math.max(1, Math.floor(safe * 0.2));  
        second = Math.max(first + 1, Math.floor(safe * 0.7));  
    }  
  
  
    return {  
        first,  
        second,  
        final: safe  
    };  
  
}

                ${getTimeGreeting()}  
            </p>  
  
            <p class="text-gray-300">  
                Cuéntame qué quieres promocionar y  
                SparkyKrea te ayuda a convertirlo en una idea.  
            </p>  
  
        `;  
  
    }  
  
  
    /* =====================================================  
       RESPUESTA: ¿ES SOBRE UN PERSONAJE?  
       ===================================================== */  
  
    if (awaitingCharacterChoice) {  
  
        const answer =  
            clean;  
  
        const yes =  
            /^(si|sí|yes|claro|exacto|correcto|aja|ajá)$/i.test(answer);  
  
        const no =  
            /^(no|nop|nah|ninguno)$/i.test(answer);  
  
  
        if (yes) {  
  
            awaitingCharacterChoice = false;  
            awaitingCharacterName = true;  
  
            return `  
  
                <div class="space-y-2">  
  
                    <p>  
                        Perfecto 🎯. Entonces vamos a hacerlo mucho más preciso.  
                    </p>  
  
                    <p class="text-gray-300">  
                        🎮 ¿Qué personaje, agente, campeón o héroe quieres que sea el protagonista?  
                    </p>  
  
                    <p class="text-gray-500 text-[11px]">  
                        Por ejemplo: Reyna, Jett, Sage, Yasuo, Garen, etc.  
                    </p>  
  
                </div>  
  
            `;  
  
        }  
  
  
        if (no) {  
  
            pendingDetail = null;  
  
            awaitingCharacterChoice = false;  
            awaitingDuration = true;  
  
            return `  
  
                <div class="space-y-2">  
  
                    <p>  
                        Perfecto 👍. Entonces enfocaremos el anuncio en  
                        <strong class="text-brandVerde">  
                            ${escapeHtml(pendingTopic)}  
                        </strong>  
                        como juego en general.  
                    </p>  
  
                    <p class="text-gray-300">  
                        Ahora dime cuánto quieres que dure el video:  
                    </p>  
  
                    ${durationSelector()}  
  
                </div>  
  
            `;  
  
        }  
  
  
        return `  
  
            <div class="space-y-2">  
  
                <p>  
                    Solo necesito saber una cosa:  
                </p>  
  
                <p class="text-gray-300">  
                    🎮 ¿Quieres que el anuncio sea sobre un personaje específico?  
                </p>  
  
                <p class="text-gray-500 text-[11px]">  
                    Responde simplemente <strong>Sí</strong> o <strong>No</strong>.  
                </p>  
  
            </div>  
  
        `;  
  
    }  
  
  
    /* =====================================================  
       NOMBRE DEL PERSONAJE  
       ===================================================== */  
  
    if (awaitingCharacterName) {  
  
        pendingDetail =  
            input.trim();  
  
        awaitingCharacterName = false;  
        awaitingDuration = true;  
  
  
        return `  
  
            <div class="space-y-2">  
  
                <p>  
                    🔥 Perfecto. El protagonista será  
                    <strong class="text-brandVerde">  
                        "${escapeHtml(pendingDetail)}"  
                    </strong>.  
                </p>  
  
                <p class="text-gray-300">  
                    Ahora podemos construir el guion alrededor de ese personaje.  
                </p>  
  
                <p class="text-gray-300">  
                    ⏱️ ¿Cuánto quieres que dure el video?  
                </p>  
  
                ${durationSelector()}  
  
            </div>  
  
        `;  
  
    }  
  
  
    /* =====================================================  
       DURACIÓN  
       ===================================================== */  
  
    const hasTimeKeywords =  
        /(\d+|segundo|segundos|minuto|minutos|min|seg)/i.test(clean);  
  
  
    if (  
        (awaitingDuration || pendingTopic) &&  
        hasTimeKeywords  
    ) {  
  
        const totalSec =  
            parseDurationInSeconds(clean);  
  
  
        const category =  
            pendingCategory ||  
            detectCategory(pendingTopic);  
  
  
        const generated =  
            generateSpecificScript(  
                pendingTopic,  
                pendingDetail,  
                totalSec  
            );  
  
  
        const mainTopic =  
            pendingTopic;  
  
        const detailTopic =  
            pendingDetail;  
  
  
        pendingTopic = null;  
        pendingDetail = null;  
        pendingCategory = null;  
        awaitingDuration = false;  
  
  
        return `  
  
            <div class="space-y-3">  
  
  
                <!-- ENCABEZADO -->  
  
                <div class="border-b border-darkBorder pb-1.5">  
  
                    <h2 class="text-xs font-bold text-brandVerde">  
  
                        🎬 Guion creativo de SparkyKrea  
  
                    </h2>  
  
                    <p class="text-[11px] text-gray-400">  
  
                        Campaña:  
                        <strong class="text-white">  
                            ${escapeHtml(mainTopic)}  
                            ${detailTopic  
                                ? '(' + escapeHtml(detailTopic) + ')'  
                                : ''  
                            }  
                        </strong>  
  
                        |  
  
                        Duración:  
                        <strong class="text-white">  
                            ${formatTime(totalSec)}  
                        </strong>  
  
                    </p>  
  
                </div>  
  
  
                <!-- GANCHOS -->  
  
                <div class="bg-darkSidebar p-2.5 rounded-xl border border-darkBorder text-[11px] space-y-1">  
  
                    <p class="text-brandVerde font-bold uppercase tracking-wider">  
  
                        💡 IDEAS PARA EMPEZAR  
  
                    </p>  
  
                    ${generated.hooks.join('<br>')}  
  
                </div>  
  
  
                <!-- GUION -->  
  
                <div class="bg-darkSidebar p-2.5 rounded-xl border border-darkBorder text-[11px]">  
  
                    <p class="text-brandVerde font-bold uppercase tracking-wider mb-1.5">  
  
                        📜 GUION PASO A PASO  
  
                    </p>  
  
                    ${generated.scriptSteps}  
  
                </div>  
  
  
                <!-- EFECTOS -->  
  
                <div class="bg-darkSidebar p-2.5 rounded-xl border border-darkBorder text-[11px] space-y-1">  
  
                    <p class="text-brandVerde font-bold uppercase tracking-wider">  
  
                        ⚡ EFECTOS Y EDICIÓN  
  
                    </p>  
  
                    ${generated.effects.join('<br>')}  
  
                </div>  
  
  
                <!-- MÚSICA -->  
  
                <div class="bg-darkSidebar p-2.5 rounded-xl border border-darkBorder text-[11px] space-y-1">  
  
                    <p class="text-brandVerde font-bold uppercase tracking-wider">  
  
                        🎵 ESTILO MUSICAL  
  
                    </p>  
  
                    ${getDiverseMusicSugg(category)}  
  
                </div>  
  
  
                <!-- MOTIVACIÓN -->  
  
                <div class="bg-brandVinotinto/20 border border-brandVinotinto/40 p-2.5 rounded-xl text-[11px]">  
  
                    <p class="text-white font-semibold">  
  
                        🚀 Y ahora viene lo bueno:  
  
                    </p>  
  
                    <p class="text-gray-300">  
  
                        No necesitas hacerlo perfecto desde el primer intento.  
                        Empieza con una idea, prueba una versión y ve mejorándola.  
                        Una buena campaña también nace de una chispa.  
  
                    </p>  
  
                </div>  
  
  
            </div>  
  
        `;  
  
    }  
  
  
    /* =====================================================  
       NUEVO TEMA  
       ===================================================== */  
  
    pendingTopic =  
        input.trim();  
  
    pendingCategory =  
        detectCategory(input);  
  
  
    /* =====================================================  
       GAMING  
       ===================================================== */  
  
    if (pendingCategory === 'gaming') {  
  
        awaitingCharacterChoice = true;  
  
        return `  
  
            <div class="space-y-2">  
  
                <p>  
                    🎮 Buena elección.  
                </p>  
  
                <p>  
                    Vamos a preparar algo específico para  
                    <strong class="text-brandVerde">  
                        "${escapeHtml(input)}"  
                    </strong>.  
                </p>  
  
                <p class="text-gray-300">  
                    Antes de crear el guion necesito afinar una cosa:  
                </p>  
  
                <p class="text-white font-semibold">  
                    ¿Quieres que el anuncio sea sobre un personaje específico?  
                </p>  
  
                <p class="text-gray-500 text-[11px]">  
                    Responde <strong>Sí</strong> o <strong>No</strong>.  
                </p>  
  
            </div>  
  
        `;  
  
    }  
  
  
    /* =====================================================  
       DEPORTES  
       ===================================================== */  
  
    if (pendingCategory === 'sports') {  
  
        awaitingCharacterName = true;  
  
        return `  
  
            <div class="space-y-2">  
  
                <p>  
                    ⚽ Perfecto. Podemos hacer que el anuncio tenga una identidad mucho más marcada.  
                </p>  
  
                <p class="text-gray-300">  
                    ¿Quién quieres que sea el protagonista?  
                </p>  
  
                <p class="text-gray-500 text-[11px]">  
                    Puede ser un futbolista, atleta, equipo o figura deportiva.  
                </p>  
  
            </div>  
  
        `;  
  
    }  
  
  
    /* =====================================================  
       COMIDA / RESTAURANTE  
       ===================================================== */  
  
    if (pendingCategory === 'food') {  
  
        awaitingDuration = true;  
  
        return `  
  
            <div class="space-y-2">  
  
                <p>  
                    🍕 ¡Perfecto!  
                </p>  
  
                <p>  
                    Vamos a hacer que el anuncio se centre realmente en  
                    <strong class="text-brandVerde">  
                        "${escapeHtml(input)}"  
                    </strong>.  
                </p>  
  
                <p class="text-gray-300">  
                    El guion puede enfocarse en preparación, ingredientes,  
                    presentación y la experiencia de probarlo.  
                </p>  
  
                <p class="text-gray-300">  
                    ⏱️ Ahora dime cuánto quieres que dure:  
                </p>  
  
                ${durationSelector()}  
  
            </div>  
  
        `;  
  
    }  
  
  
    /* =====================================================  
       GENERAL  
       ===================================================== */  
  
    awaitingDuration = true;  
  
    return `  
  
        <div class="space-y-2">  
  
            <p>  
                ✨ Me gusta la idea.  
            </p>  
  
            <p>  
                Vamos a trabajar específicamente con  
                <strong class="text-brandVerde">  
                    "${escapeHtml(input)}"  
                </strong>.  
            </p>  
  
            <p class="text-gray-300">  
                Para ajustar el ritmo, la cantidad de escenas  
                y la narración necesito saber la duración.  
            </p>  
  
            ${durationSelector()}  
  
        </div>  
  
    `;  
  
}  
  
  
/* =========================================================  
   SCROLL  
   ========================================================= */  
  
function scrollToBottom() {  
  
    const container =  
        document.getElementById('chat-container');  
  
    container.scrollTop =  
        container.scrollHeight;  
  
}  
  
  
/* =========================================================  
   GUARDAR HISTORIAL  
   ========================================================= */  
  
function saveMessageToHistory(userText, botText) {  
  
    let chat =  
        conversations.find(  
            c => c.id === currentChatId  
        );  
  
  
    if (!chat) {  
  
        chat = {  
  
            id: currentChatId,  
  
            title:  
                userText.substring(0, 20) +  
                (userText.length > 20 ? '...' : ''),  
  
            messages: []  
  
        };  
  
  
        conversations.unshift(chat);  
  
    }  
  
  
    chat.messages.push({  
  
        sender: 'user',  
        text: userText  
  
    });  
  
  
    chat.messages.push({  
  
        sender: 'bot',  
        text: botText  
  
    });  
  
  
    localStorage.setItem(  
        'sparkykrea_chats',  
        JSON.stringify(conversations)  
    );  
  
  
    renderSidebar();  
  
}  
  
  
/* =========================================================  
   RENDER SIDEBAR  
   ========================================================= */  
  
function renderSidebar() {  
  
    const historyContainer =  
        document.getElementById('chat-history');  
  
  
    if (conversations.length === 0) {  
  
        historyContainer.innerHTML = `  
  
            <div class="text-[11px] text-gray-500 italic px-2 py-1">  
  
                Sin campañas guardadas  
  
            </div>  
  
        `;  
  
        return;  
  
    }  
  
  
    historyContainer.innerHTML = '';  
  
  
    conversations.forEach(c => {  
  
        const active =  
            c.id === currentChatId;  
  
  
        historyContainer.innerHTML += `  
  
            <div  
                onclick="selectChat('${c.id}')"  
                class="group flex items-center justify-between px-2.5 py-1.5 rounded-lg cursor-pointer text-xs transition  
                ${active  
                    ? 'bg-brandVinotinto/30 border border-brandVinotinto/50 text-white font-medium'  
                    : 'text-gray-400 hover:bg-darkCard hover:text-gray-200'  
                }">  
  
  
                <div class="flex items-center gap-2 truncate">  
  
                    <i class="fa-solid fa-film text-brandVerde text-[10px]"></i>  
  
                    <span class="truncate text-[11px]">  
  
                        ${escapeHtml(c.title)}  
  
                    </span>  
  
                </div>  
  
  
                <button  
                    onclick="deleteChat('${c.id}', event)"  
                    class="opacity-0 group-hover:opacity-100 p-1 text-gray-500 hover:text-rose-400 transition"  
                    title="Eliminar chat">  
  
                    <i class="fa-solid fa-trash-can text-[10px]"></i>  
  
                </button>  
  
  
            </div>  
  
        `;  
  
    });  
  
}  
  
  
/* =========================================================  
   SELECCIONAR CHAT  
   ========================================================= */  
  
function selectChat(id) {  
  
    currentChatId = id;  
  
  
    const chat =  
        conversations.find(c => c.id === id);  
  
  
    if (!chat) return;  
  
  
    pendingTopic = null;  
    pendingDetail = null;  
    pendingCategory = null;  
  
    awaitingCharacterChoice = false;  
    awaitingCharacterName = false;  
    awaitingDuration = false;  
  
  
    document  
        .getElementById('welcome-screen')  
        .classList.add('hidden');  
  
  
    const messagesList =  
        document.getElementById('messages-list');  
  
  
    messagesList.classList.remove('hidden');  
  
    messagesList.innerHTML = '';  
  
  
    chat.messages.forEach(m => {  
  
        if (m.sender === 'user') {  
  
            messagesList.innerHTML += `  
  
                <div class="flex gap-2.5 justify-end">  
  
                    <div class="bg-brandVinotinto text-white py-2 px-3 rounded-xl rounded-tr-none max-w-[85%] text-xs shadow-md">  
  
                        ${escapeHtml(m.text)}  
  
                    </div>  
  
                </div>  
  
            `;  
  
        } else {  
  
            messagesList.innerHTML += `  
  
                <div class="flex gap-2.5 justify-start">  
  
                    <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-brandVinotinto to-brandVerde flex-shrink-0 flex items-center justify-center text-white font-bold text-[10px] shadow-md">  
  
                        SK  
  
                    </div>  
  
  
                    <div class="bg-darkCard border border-darkBorder text-gray-200 p-3 rounded-xl rounded-tl-none max-w-[90%] text-xs leading-relaxed shadow-md space-y-2">  
  
                        ${m.text}  
  
                    </div>  
  
                </div>  
  
            `;  
  
        }  
  
    });  
  
  
    renderSidebar();  
  
    scrollToBottom();  
  
  
    const sidebar =  
        document.getElementById('sidebar');  
  
  
    if (!sidebar.classList.contains('-translate-x-full')) {  
  
        toggleSidebar();  
  
    }  
  
}  
  
  
/* =========================================================  
   SEGURIDAD HTML  
   ========================================================= */  
  
function escapeHtml(str) {  
  
    return String(str)  
        .replace(/&/g, "&amp;")  
        .replace(/</g, "&lt;")  
        .replace(/>/g, "&gt;")  
        .replace(/"/g, "&quot;")  
        .replace(/'/g, "&#039;");  
  
}  
  
</script>  </body>  
</html>
