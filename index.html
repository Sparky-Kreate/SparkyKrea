
<!DOCTYPE html>
<html lang="es" class="h-full bg-zinc-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SparkyKrea Studio's - AI Script Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    /* Scrollbar minimalista */
    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
  </style>
</head>
<body class="h-full w-full overflow-hidden bg-zinc-950 text-zinc-100 flex flex-col antialiased">

  <!-- BARRA SUPERIOR (HEADER) -->
  <header class="w-full bg-zinc-900/90 backdrop-blur-md border-b border-zinc-800/80 px-4 py-2.5 flex items-center justify-between shrink-0 z-50">
    
    <!-- BRANDING LOGO -->
    <div class="flex items-center cursor-pointer select-none">
      <svg width="180" height="40" viewBox="0 0 240 60" xmlns="http://www.w3.org/2000/svg" class="h-9 w-auto">
        <defs>
          <filter id="proGlowHeader" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <!-- ISOTIPO: Cámara + Techo Studio + Estrella Gemini -->
        <g transform="translate(8, 6)" filter="url(#proGlowHeader)">
          <circle cx="24" cy="24" r="22" fill="#10B981" />
          <rect x="13" y="17" width="15" height="14" rx="2.5" fill="#FFFFFF" />
          <polygon points="28,21 35,16 35,32 28,27" fill="#FFFFFF" />
          <path d="M 11 18 L 20.5 10 L 30 18" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="20.5" cy="24" r="5" fill="none" stroke="#10B981" stroke-width="0.8" opacity="0.8" />
          <circle cx="20.5" cy="24" r="3.8" fill="none" stroke="#10B981" stroke-width="0.8" />
          <path d="M 20.5 21.5 C 20.5 22.88 19.38 24 18 24 C 19.38 24 20.5 25.12 20.5 26.5 C 20.5 25.12 21.62 24 23 24 C 21.62 24 20.5 22.88 20.5 21.5 Z" fill="#10B981" />
        </g>

        <!-- TEXTO TIPOGRÁFICO -->
        <g transform="translate(68, 30)">
          <text font-family="'Inter', sans-serif" font-weight="800" font-size="20" letter-spacing="-0.5">
            <tspan fill="#800020">Sparky</tspan><tspan fill="#10B981">Krea</tspan>
          </text>
          <text x="1" y="14" font-family="'Inter', sans-serif" font-weight="600" font-size="9" fill="#FFFFFF" letter-spacing="2.5">
            STUDIO'S
          </text>
        </g>
      </svg>
    </div>

    <!-- SELECTOR DE TIEMPO COMPACTO -->
    <div class="flex items-center gap-2">
      <div class="relative flex items-center">
        <span class="absolute left-2.5 text-zinc-400 text-xs pointer-events-none">⏱️</span>
        <select id="timeSelector" class="bg-zinc-800/90 text-zinc-200 hover:text-white text-xs font-medium pl-7 pr-3 py-1.5 rounded-full border border-zinc-700/60 hover:border-emerald-500/50 outline-none transition-all duration-200 cursor-pointer appearance-none shadow-sm">
          <option value="15">15s (Shorts/TikTok)</option>
          <option value="30" selected>30s (Comercial Estándar)</option>
          <option value="60">60s (Largo / YouTube)</option>
        </select>
      </div>
    </div>

  </header>

  <!-- WORKSPACE / CHAT -->
  <main class="flex-1 w-full max-w-4xl mx-auto flex flex-col justify-between overflow-hidden p-3 md:p-4 gap-3">
    
    <!-- ÁREA DE DIÁLOGOS -->
    <div id="chatContainer" class="flex-1 w-full overflow-y-auto custom-scrollbar flex flex-col gap-3 pr-1">
      
      <!-- Mensaje Inicial -->
      <div class="flex items-start gap-3 max-w-[85%]">
        <div class="w-8 h-8 rounded-full bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center shrink-0">
          <span class="text-xs">✨</span>
        </div>
        <div id="welcomeMessage" class="bg-zinc-900 border border-zinc-800/80 rounded-2xl rounded-tl-none p-3.5 text-sm text-zinc-200 shadow-sm leading-relaxed">
          <!-- El saludo dinámico se inyectará mediante JS -->
        </div>
      </div>

    </div>

    <!-- INPUT DE ENTRADA -->
    <div class="w-full shrink-0">
      <form id="chatForm" class="relative flex items-center">
        <input 
          type="text" 
          id="userInput"
          placeholder="Escribe la idea o producto para tu guion..." 
          class="w-full bg-zinc-900/90 border border-zinc-800 focus:border-emerald-500/60 text-sm text-zinc-100 placeholder-zinc-500 rounded-full pl-4 pr-12 py-3 outline-none transition-all duration-200 shadow-lg"
          autocomplete="off"
        >
        <button 
          type="submit" 
          class="absolute right-1.5 p-2 bg-[#800020] hover:bg-emerald-600 text-white rounded-full transition-all duration-200 flex items-center justify-center shadow-md"
          title="Enviar"
        >
          <svg class="w-4 h-4 transform rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19V5m0 0l-7 7m7-7l7 7"></path>
          </svg>
        </button>
      </form>
    </div>

  </main>

  <!-- LÓGICA JAVASCRIPT INTEGRADA -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const chatContainer = document.getElementById('chatContainer');
      const chatForm = document.getElementById('chatForm');
      const userInput = document.getElementById('userInput');
      const welcomeMessage = document.getElementById('welcomeMessage');
      const timeSelector = document.getElementById('timeSelector');

      // 1. Saludo dinámico según hora del día
      function getDynamicGreeting() {
        const hour = new Date().getHours();
        let greeting = "¡Hola!";
        if (hour >= 5 && hour < 12) greeting = "¡Buenos días!";
        else if (hour >= 12 && hour < 19) greeting = "¡Buenas tardes!";
        else greeting = "¡Buenas noches!";
        
        return `${greeting} Soy el asistente creativo de <strong class="text-emerald-400 font-semibold">SparkyKrea Studio's</strong>. Indica el tema o producto para generar el guion publicitario perfecto.`;
      }
      welcomeMessage.innerHTML = getDynamicGreeting();

      // 2. Filtro de entradas irrelevantes / spam
      function isInvalidInput(text) {
        const cleaned = text.trim().toLowerCase();
        const spamPatterns = ['xd', 'xdd', 'xddd', 'lol', 'asdf', 'test', 'hola', 'a'];
        return cleaned.length < 2 || spamPatterns.includes(cleaned);
      }

      // 3. Renderizado de mensajes en pantalla
      function appendMessage(text, isUser = false) {
        const wrapper = document.createElement('div');
        wrapper.className = `flex items-start gap-3 max-w-[85%] ${isUser ? 'ml-auto flex-row-reverse' : ''}`;

        const avatar = document.createElement('div');
        avatar.className = `w-8 h-8 rounded-full flex items-center justify-center shrink-0 ${
          isUser ? 'bg-[#800020]/20 border border-[#800020]/40' : 'bg-emerald-500/10 border border-emerald-500/30'
        }`;
        avatar.innerHTML = `<span class="text-xs">${isUser ? '👤' : '✨'}</span>`;

        const bubble = document.createElement('div');
        bubble.className = `p-3.5 text-sm shadow-sm leading-relaxed ${
          isUser 
            ? 'bg-[#800020] text-white rounded-2xl rounded-tr-none' 
            : 'bg-zinc-900 border border-zinc-800/80 text-zinc-200 rounded-2xl rounded-tl-none'
        }`;
        bubble.innerHTML = text;

        wrapper.appendChild(avatar);
        wrapper.appendChild(bubble);
        chatContainer.appendChild(wrapper);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      // 4. Manejo del evento Submit
      chatForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, true);
        userInput.value = '';

        // Filtrado inteligente
        if (isInvalidInput(text)) {
          setTimeout(() => {
            appendMessage('Por favor, ingresa una idea, producto o descripción válida para redactar el guion de tu anuncio.');
          }, 400);
          return;
        }

        // Generación de respuesta simulada
        const duration = timeSelector.value;
        setTimeout(() => {
          appendMessage(`🎬 <strong>Guion publicitario listo (${duration} segundos):</strong><br><br>` +
                        `<strong>[ESCENA 1]</strong> Entrada de impacto visual mostrando el producto.<br>` +
                        `<strong>[LOCUCIÓN]:</strong> ¿Buscas la máxima creatividad para tus campañas? Con <em>${text}</em> lo haces posible.<br>` +
                        `<strong>[CALL TO ACTION]:</strong> ¡Descúbrelo hoy en SparkyKrea Studio's!`);
        }, 800);
      });
    });
  </script>
</body>
</html>
