<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SparkyKrea - Agencia de Marketing & Publicidad</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vinotinto: {
                            DEFAULT: '#6B1D2F',
                            dark: '#4A1320',
                            light: '#8C273F'
                        },
                        dorado: {
                            DEFAULT: '#D4AF37',
                            light: '#F3E5AB',
                            dark: '#AA8C2C'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Animación para la transición de entrada */
        @keyframes fadeOut {
            from { opacity: 1; visibility: visible; }
            to { opacity: 0; visibility: hidden; }
        }
        .splash-screen {
            animation: fadeOut 0.5s ease-in-out 0.8s forwards;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-[100dvh] flex overflow-hidden">

    <!-- TRANSICIÓN DE ENTRADA (SPLASH SCREEN - Dura ~1 segundo) -->
    <div id="splashScreen" class="splash-screen fixed inset-0 bg-vinotinto-dark z-50 flex flex-col items-center justify-center space-y-4">
        <div class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-dorado to-dorado-light flex items-center justify-center text-vinotinto-dark shadow-2xl animate-bounce">
            <svg class="w-10 h-10" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 3L4 9v12h16V9l-8-6zm6 16H6v-8.5l6-4.5 6 4.5V19z"/>
                <circle cx="12" cy="14" r="3"/>
            </svg>
        </div>
        <div class="text-center">
            <h1 class="text-2xl font-bold tracking-widest text-dorado">SparkyKrea</h1>
            <p class="text-xs text-gray-300 tracking-wider mt-1">Agencia Publicitaria</p>
        </div>
    </div>

    <!-- FONDO OSCURO PARA MENÚ MÓVIL -->
    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden"></div>

    <!-- BARRA LATERAL / HISTORIAL -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-vinotinto-dark text-white flex flex-col justify-between border-r border-vinotinto-light shadow-2xl z-40 transform -translate-x-full md:translate-x-0 md:relative transition-transform duration-300">
        <div>
            <!-- Cabecera del Sidebar -->
            <div class="p-4 flex items-center justify-between border-b border-vinotinto/50">
                <div class="flex items-center space-x-2.5">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-dorado to-dorado-light flex items-center justify-center text-vinotinto-dark shadow-md flex-shrink-0">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 3L4 9v12h16V9l-8-6zm6 16H6v-8.5l6-4.5 6 4.5V19z"/>
                            <circle cx="12" cy="14" r="3"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="font-bold text-base tracking-wide text-dorado leading-tight">SparkyKrea</h1>
                        <p class="text-[10px] text-gray-300">Agencia Publicitaria</p>
                    </div>
                </div>
                <button onclick="toggleSidebar()" class="md:hidden text-dorado text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Botón Nuevo Guión -->
            <div class="p-4">
                <button onclick="nuevoChat(); toggleSidebar();" class="w-full bg-dorado hover:bg-dorado-dark text-vinotinto-dark font-semibold py-2.5 px-4 rounded-xl shadow transition flex items-center justify-center space-x-2 text-sm">
                    <i class="fa-solid fa-plus"></i>
                    <span>Nuevo Guión / Idea</span>
                </button>
            </div>

            <!-- Historial de Chats con opción de eliminar -->
            <div class="px-3 py-2 space-y-1 overflow-y-auto max-h-[calc(100vh-220px)]" id="historyList">
                <p class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider px-2 mb-2">Historial de Campañas</p>
            </div>
        </div>

        <!-- Pie de Sidebar -->
        <div class="p-4 border-t border-vinotinto/50 bg-vinotinto-dark/50 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-full bg-dorado text-vinotinto-dark font-bold flex items-center justify-center text-xs">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div>
                    <p class="text-xs font-medium text-white" id="userName">Creador</p>
                    <p class="text-[10px] text-dorado">Agencia Activa</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 flex flex-col h-full bg-white relative w-full overflow-hidden">
        
        <!-- CABECERA PRINCIPAL -->
        <header class="h-16 border-b border-gray-200 flex items-center justify-between px-4 bg-white shadow-sm z-20 flex-shrink-0">
            <div class="flex items-center space-x-3">
                <button onclick="toggleSidebar()" class="text-vinotinto text-xl p-1 md:hidden"><i class="fa-solid fa-bars"></i></button>
                
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-dorado to-dorado-light flex items-center justify-center text-vinotinto-dark shadow-sm">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 3L4 9v12h16V9l-8-6zm6 16H6v-8.5l6-4.5 6 4.5V19z"/>
                            <circle cx="12" cy="14" r="3"/>
                        </svg>
                    </div>
                    <span class="font-bold text-vinotinto text-sm md:text-base">SparkyKrea</span>
                </div>
            </div>

            <!-- Botón Login Arriba a la Derecha -->
            <div>
                <button onclick="abrirLogin()" class="bg-vinotinto hover:bg-vinotinto-light text-dorado text-xs md:text-sm font-semibold px-4 py-2 rounded-xl shadow transition border border-dorado/30">
                    <i class="fa-solid fa-right-to-bracket mr-1"></i> Entrar
                </button>
            </div>
        </header>

        <!-- CONTENEDOR DE MENSAJES -->
        <div id="chatContainer" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 bg-gray-50/50">
            <!-- Saludo inicial dinámico -->
        </div>

        <!-- BARRA DE ENTRADA FIJA ABAJO -->
        <div class="p-3 md:p-4 bg-white border-t border-gray-200 shadow-lg flex-shrink-0">
            <div class="max-w-4xl mx-auto">
                <div id="imagePreviewContainer" class="hidden mb-2 flex items-center space-x-2 bg-gray-100 p-2 rounded-xl w-fit border border-gray-200">
                    <img id="previewImg" src="" alt="Preview" class="w-10 h-10 object-cover rounded-lg">
                    <span id="fileName" class="text-xs text-gray-600 truncate max-w-xs"></span>
                    <button onclick="removerImagen()" class="text-red-500 hover:text-red-700 text-xs px-2"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <div class="flex items-center space-x-2 bg-gray-50 border border-gray-300 rounded-2xl p-1.5 md:p-2 focus-within:ring-2 focus-within:ring-dorado transition">
                    <label class="cursor-pointer p-2 text-gray-500 hover:text-vinotinto transition rounded-xl hover:bg-gray-200 flex-shrink-0">
                        <i class="fa-regular fa-image text-lg"></i>
                        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="mostrarPreview(event)">
                    </label>

                    <input type="text" id="userInput" placeholder="Escribe tu producto o servicio para crear la publicidad..." 
                           class="flex-1 bg-transparent border-none focus:outline-none text-gray-700 px-2 py-1 text-sm md:text-base"
                           onkeypress="if(event.key === 'Enter') enviarMensaje()">

                    <button onclick="enviarMensaje()" class="bg-vinotinto hover:bg-vinotinto-light text-dorado p-2.5 rounded-xl shadow transition flex items-center justify-center w-10 h-10 md:w-11 md:h-11 flex-shrink-0">
                        <i class="fa-solid fa-paper-plane text-sm"></i>
                    </button>
                </div>
                <div class="flex justify-between items-center mt-1 px-2">
                    <p class="text-[10px] text-gray-400">Generador profesional de guiones y estrategias publicitarias.</p>
                    <span class="text-[10px] text-vinotinto font-semibold">Vinotinto & Dorado Edition</span>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL DE INICIO DE SESIÓN -->
    <div id="loginModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-6 md:p-8 max-w-md w-full shadow-2xl border-t-4 border-dorado">
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-lg font-bold text-vinotinto">Acceso a SparkyKrea</h3>
                <button onclick="cerrarLogin()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Correo Electrónico</label>
                    <input type="email" id="loginEmail" placeholder="tucorreo@agencia.com" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-dorado">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Contraseña</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-dorado">
                </div>
                <button onclick="ejecutarLogin()" class="w-full bg-vinotinto hover:bg-vinotinto-dark text-dorado font-semibold py-3 rounded-xl shadow transition text-sm">
                    Ingresar al Panel
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE FUNCIONALIDAD -->
    <script>
        let imagenSeleccionada = null;
        let historialChats = [
            { id: 1, titulo: 'Campaña Principal' }
        ];

        window.onload = function() {
            mostrarSaludoInicial();
            actualizarHistorialUI();
        };

        function obtenerSaludoHorario() {
            const hora = new Date().getHours();
            if (hora < 12) return "Buenos días";
            if (hora < 19) return "Buenas tardes";
            return "Buenas noches";
        }

        function mostrarSaludoInicial() {
            const saludo = obtenerSaludoHorario();
            const container = document.getElementById('chatContainer');
            container.innerHTML = `
                <div class="flex items-start space-x-3">
                    <div class="w-9 h-9 md:w-10 md:h-10 rounded-xl bg-vinotinto text-dorado flex items-center justify-center font-bold shadow flex-shrink-0">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 3L4 9v12h16V9l-8-6zm6 16H6v-8.5l6-4.5 6 4.5V19z"/>
                            <circle cx="12" cy="14" r="3"/>
                        </svg>
                    </div>
                    <div class="bg-white border border-gray-200 p-4 rounded-2xl shadow-sm max-w-xl md:max-w-2xl text-gray-700 text-sm md:text-base space-y-1">
                        <p class="font-bold text-vinotinto">${saludo}, le da la bienvenida SparkyKrea.</p>
                        <p>¿Qué producto o servicio desea promocionar el día de hoy? Indíquenme los detalles o comparta una imagen de referencia para estructurar su campaña publicitaria.</p>
                    </div>
                </div>
            `;
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function mostrarPreview(event) {
            const file = event.target.files[0];
            if (file) {
                imagenSeleccionada = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('previewImg').src = e.target.result;
                    document.getElementById('fileName').textContent = file.name;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        function removerImagen() {
            imagenSeleccionada = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('imagePreviewContainer').classList.add('hidden');
        }

        function enviarMensaje() {
            const input = document.getElementById('userInput');
            const container = document.getElementById('chatContainer');
            let texto = input.value.trim();

            if (!texto && !imagenSeleccionada) return;

            let userHtml = `<div class="flex items-start justify-end space-x-3">
                <div class="bg-vinotinto text-white p-3.5 rounded-2xl shadow-sm max-w-xl md:max-w-2xl text-sm md:text-base">`;
            
            if (imagenSeleccionada) {
                userHtml += `<img src="${document.getElementById('previewImg').src}" class="w-36 h-24 object-cover rounded-lg mb-2 border border-dorado/30">`;
            }
            if (texto) {
                userHtml += `<p>${texto}</p>`;
            }
            userHtml += `</div>
                <div class="w-9 h-9 md:w-10 md:h-10 rounded-xl bg-dorado text-vinotinto-dark font-bold flex items-center justify-center shadow flex-shrink-0 text-xs">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>`;

            container.innerHTML += userHtml;
            
            if (texto && !historialChats.some(c => c.titulo === texto)) {
                historialChats.unshift({ id: Date.now(), titulo: texto.length > 22 ? texto.substring(0, 22) + '...' : texto });
                actualizarHistorialUI();
            }

            input.value = '';
            const imgRef = imagenSeleccionada ? document.getElementById('previewImg').src : null;
            removerImagen();
            container.scrollTop = container.scrollHeight;

            setTimeout(() => {
                let resultado = generarEstrategiaPublicitaria(texto);
                
                let aiHtml = `<div class="flex items-start space-x-3">
                    <div class="w-9 h-9 md:w-10 md:h-10 rounded-xl bg-vinotinto text-dorado flex items-center justify-center font-bold shadow flex-shrink-0">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 3L4 9v12h16V9l-8-6zm6 16H6v-8.5l6-4.5 6 4.5V19z"/>
                            <circle cx="12" cy="14" r="3"/>
                        </svg>
                    </div>
                    <div class="bg-white border border-gray-200 p-4 md:p-5 rounded-2xl shadow-sm max-w-xl md:max-w-2xl text-gray-700 space-y-3 text-sm">
                        <div class="flex items-center justify-between border-b pb-2">
                            <p class="font-bold text-vinotinto flex items-center"><i class="fa-solid fa-bullhorn mr-2 text-dorado"></i> Propuesta Publicitaria Profesional</p>
                            <span class="text-[10px] bg-dorado-light text-vinotinto-dark px-2 py-0.5 rounded font-semibold">SparkyKrea Studio</span>
                        </div>

                        <div class="bg-gray-50 p-3 rounded-xl border border-gray-100 space-y-1">
                            <p class="font-semibold text-vinotinto-dark"><i class="fa-solid fa-chess-knight mr-1 text-dorado"></i> Estrategia de Marketing:</p>
                            <p class="text-gray-600">${resultado.estrategia}</p>
                        </div>

                        <div class="space-y-1">
                            <p class="font-semibold text-gray-800"><i class="fa-solid fa-file-lines mr-1 text-vinotinto"></i> Guión para Anuncio (15-30s):</p>
                            <p class="text-gray-700 italic bg-vinotinto/5 p-3 rounded-xl border-l-4 border-dorado">"${resultado.guion}"</p>
                        </div>

                        <div class="space-y-1 pt-1">
                            <p class="font-semibold text-gray-800"><i class="fa-solid fa-video mr-1 text-dorado"></i> Tips Profesionales de Edición:</p>
                            <ul class="list-disc list-inside text-gray-600 space-y-0.5 text-xs">
                                <li>${resultado.tip1}</li>
                                <li>${resultado.tip2}</li>
                            </ul>
                        </div>

                        <div class="w-full h-32 bg-gradient-to-tr from-vinotinto-dark to-vinotinto rounded-xl flex flex-col items-center justify-center text-white p-3 text-center shadow-inner mt-2">
                            <i class="fa-solid fa-camera-retro text-dorado text-2xl mb-1"></i>
                            <p class="text-xs text-dorado-light font-medium">Concepto Visual: ${resultado.visual}</p>
                            ${imgRef ? '<p class="text-[10px] text-gray-300 mt-0.5">(Adaptado en base a su imagen de referencia)</p>' : ''}
                        </div>
                    </div>
                </div>`;
                container.innerHTML += aiHtml;
                container.scrollTop = container.scrollHeight;
            }, 800);
        }

        function generarEstrategiaPublicitaria(texto) {
            let t = texto.toLowerCase();
            let prod = texto || "su producto o servicio";

            if (t.includes('zapat') || t.includes('ropa') || t.includes('moda')) {
                return {
                    estrategia: "Posicionamiento de marca basado en tendencia visual y comodidad aspiracional para captar atención en los primeros 3 segundos en redes sociales.",
                    guion: "¿Cansado de buscar prendas que combinen estilo y confort? Descubra la nueva colección diseñada para destacar en cualquier ocasión. Eleve su presencia hoy mismo.",
                    tip1: "Utilice cortes de escena rápidos cada 1.5 segundos para mantener alta retención visual.",
                    tip2: "Aplique una transición de luz cálida al revelar el producto principal en pantalla.",
                    visual: "Modelo en entorno urbano elegante con iluminación lateral y tonos dorados sutiles."
                };
            } else if (t.includes('comida') || t.includes('café') || t.includes('restaurant')) {
                return {
                    estrategia: "Marketing sensorial enfocado en generar deseo inmediato mediante primeros planos detallados y ritmo dinámico.",
                    guion: "El sabor auténtico que merece disfrutar está aquí. Deleite sus sentidos con una experiencia culinaria inigualable. Haga su pedido ahora.",
                    tip1: "Aumente ligeramente la saturación de los tonos cálidos en la corrección de color para realzar el apetito.",
                    tip2: "Sincronice el efecto de sonido de preparación con el ritmo de la música de fondo.",
                    visual: "Plano secuencia cercano del plato principal con vapor controlado e iluminación cenital."
                };
            } else {
                return {
                    estrategia: "Resolución directa de necesidades del cliente objetivo mediante propuesta de valor clara y llamada a la acción persuasiva.",
                    guion: `Optimice sus resultados con ${prod}. La solución definitiva que le ahorrará tiempo y potenciará su negocio de forma inmediata. Contáctenos hoy.`,
                    tip1: "Incorpore subtítulos animados grandes y limpios con tipografía sans-serif de alta legibilidad.",
                    tip2: "Mantenga un fondo musical corporativo con beats ascendentes para generar sensación de éxito.",
                    visual: `Presentación corporativa de alta gama para ${prod} bajo la paleta institucional vinotinto y acentos dorados.`
                };
            }
        }

        function actualizarHistorialUI() {
            const list = document.getElementById('historyList');
            let html = '<p class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider px-2 mb-2">Historial de Campañas</p>';
            
            historialChats.forEach(chat => {
                html += `
                    <div class="flex items-center justify-between px-3 py-2 rounded-lg text-sm bg-vinotinto/40 text-dorado-light mb-1 group border-l-2 border-dorado">
                        <span class="truncate pr-2 cursor-pointer" onclick="seleccionarChat('${chat.titulo}')">${chat.titulo}</span>
                        <button onclick="eliminarChat(${chat.id})" class="text-gray-400 hover:text-red-400 text-xs px-1 transition"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        function eliminarChat(id) {
            historialChats = historialChats.filter(c => c.id !== id);
            actualizarHistorialUI();
        }

        function seleccionarChat(titulo) {
            if(window.innerWidth < 768) toggleSidebar();
        }

        function nuevoChat() {
            mostrarSaludoInicial();
        }

        function abrirLogin() {
            document.getElementById('loginModal').classList.remove('hidden');
            document.getElementById('loginModal').classList.add('flex');
        }

        function cerrarLogin() {
            document.getElementById('loginModal').classList.remove('flex');
            document.getElementById('loginModal').classList.add('hidden');
        }

        function ejecutarLogin() {
            const email = document.getElementById('loginEmail').value;
            if(email) {
                document.getElementById('userName').textContent = email.split('@')[0];
                cerrarLogin();
                alert('Sesión iniciada correctamente.');
            } else {
                alert('Por favor, ingrese un correo electrónico válido.');
            }
        }
    </script>
</body>
</html>
