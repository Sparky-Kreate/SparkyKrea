        :root {

            --bg-panel: #13151c;
            --bg-card: #1a1d26;
            --bg-input: #1f2330;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #2d3748;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            background: linear-gradient(135deg, var(--accent), #a855f7);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .logo-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .header-controls {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .lang-select-wrapper {
            position: relative;
        }

        .btn-lang {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .btn-lang:hover {
            border-color: var(--accent);
        }

        .lang-dropdown {
            position: absolute;
            top: 110%;
            right: 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            width: 160px;
            display: none;
            flex-direction: column;
            z-index: 100;
            overflow: hidden;
        }

        .lang-dropdown.show {
            display: flex;
        }

        .lang-option {
            padding: 0.65rem 1rem;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
            background: transparent;
            color: var(--text-main);
            text-align: left;
            width: 100%;
        }

        .lang-option:hover {
            background: var(--accent);
            color: white;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            align-self: flex-start;
        }

        .message.user {
            align-self: flex-end;
        }

        .bubble {
            padding: 1rem 1.25rem;
            border-radius: var(--radius);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .bot .bubble {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-top-left-radius: 4px;
        }

        .user .bubble {
            background-color: var(--accent);
            color: white;
            border-top-right-radius: 4px;
        }

        .project-card {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            margin-top: 0.75rem;
        }

        .project-tag {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .project-name {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .duration-options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .duration-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem 0.85rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .duration-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .script-block {
            background: var(--bg-input);
            border-left: 4px solid var(--accent);
            padding: 0.75rem 1rem;
            margin: 0.5rem 0;
            border-radius: 0 8px 8px 0;
        }

        .script-time {
            font-weight: 700;
            color: var(--accent);
            font-size: 0.85rem;
        }

        .script-action {
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        .tips-box {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 10px;
            padding: 0.85rem;
            margin-top: 0.75rem;
            font-size: 0.85rem;
        }

        .tips-title {
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.25rem;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .btn-action {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-action:hover {
            background: var(--border);
        }

        .input-area {
            padding: 1rem 1.5rem;
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
        }

        .input-wrapper {
            display: flex;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.5rem;
            align-items: center;
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            padding: 0.5rem 0.75rem;
            font-size: 0.95rem;
        }

        .send-btn {
            background: var(--accent);
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: var(--accent-hover);
        }

        @media print {
            header, .input-area, .duration-options, .action-buttons {
                display: none !important;
            }
            body {
                background: white;
                color: black;
            }
            .bubble {
                background: white !important;
                border: 1px solid #ccc !important;
                color: black !important;
            }
        }
    </style>
</head>

                ],

                    { time: "0:10 - 0:20", action: "Demostración en uso del servicio o producto estrella." },
                    { time: "0:20 - 0:30", action: "Oferta por tiempo limitado. ¡Contáctanos ya!" }
                ],
                strategy: "Enfoque en beneficios directos y claridad comercial.",
                music: "Corporate upbeat, pop comercial positivo o instrumental inspirador.",

        };

        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const langBtn = document.getElementById('langBtn');
        const langDropdown = document.getElementById('langDropdown');
        const currentLangLabel = document.getElementById('currentLangLabel');

        langBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            langDropdown.classList.toggle('show');
        });

        window.addEventListener('click', () => {
            langDropdown.classList.remove('show');
        });

        function changeLanguage(langCode, langName) {
            currentLang = langCode;
            currentLangLabel.textContent = langName;
            langDropdown.classList.remove('show');
            userInput.placeholder = translations[currentLang].placeholder;
            addBotMessage(translations[currentLang].welcome);
        }

        function addBotMessage(htmlContent) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message bot';
            msgDiv.innerHTML = `<div class="bubble">${htmlContent}</div>`;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addUserMessage(text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message user';
            msgDiv.innerHTML = `<div class="bubble">${text}</div>`;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function detectNicheKey(text) {
            const t = text.toLowerCase();
            if (vagueTerms.some(v => t === v || t.includes(v))) return 'vague';
            if (t.includes('pan') || t.includes('bakery') || t.includes('panaderia') || t.includes('pastel')) return 'panaderia';
            if (t.includes('restaurante') || t.includes('comida') || t.includes('restaurant') || t.includes('burger')) return 'restaurante';
            if (t.includes('rocket league') || t.includes('rocket') || t.includes('rl')) return 'rocketleague';
            if (t.includes('valorant') || t.includes('val')) return 'valorant';
            if (t.includes('juego') || t.includes('game') || t.includes('clash') || t.includes('lol') || t.includes('fortnite') || t.includes('free fire') || t.includes('genshin')) return 'generalgame';
            return 'generalbusiness';
        }

        function handleUserSubmit() {
            const text = userInput.value.trim();
            if (!text) return;

            addUserMessage(text);
            userInput.value = '';

            const nicheKey = detectNicheKey(text);

            if (nicheKey === 'vague') {
                setTimeout(() => {
                    addBotMessage(translations[currentLang].vaguePrompt);
                }, 500);
                return;
            }

            currentProject = nicheDatabase[nicheKey] || nicheDatabase['generalbusiness'];

            setTimeout(() => {
                let html = `
                    <p><strong>${translations[currentLang].projectDetected}</strong></p>
                    <div class="project-card">
                        <div class="project-tag">📌 ${translations[currentLang].projectLabel}: ${currentProject.name}</div>
                        <div class="project-name">${text}</div>
                        <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.5rem;">${translations[currentLang].selectDurationText}</p>
                        <div class="duration-options">
                            <button class="duration-btn" onclick="selectDuration('15s', '${nicheKey}')">15s</button>
                            <button class="duration-btn" onclick="selectDuration('30s', '${nicheKey}')">30s</button>
                            <button class="duration-btn" onclick="selectDuration('60s', '${nicheKey}')">60s</button>
                        </div>
                    </div>
                `;
                addBotMessage(html);
            }, 600);
        }

        function selectDuration(duration, nicheKey) {
            selectedDuration = duration;
            const proj = nicheDatabase[nicheKey] || currentProject;
            const scriptVariant = Math.random() > 0.5 ? proj.script1 : proj.script2;

            let scriptHtml = `<p><strong>${translations[currentLang].scriptTitle} (${duration}):</strong></p>`;
            scriptVariant.forEach(item => {
                scriptHtml += `
                    <div class="script-block">
                        <div class="script-time">⏱️ ${item.time}</div>
                        <div class="script-action">${item.action}</div>
                    </div>
                `;
            });

            scriptHtml += `
                <div class="tips-box">
                    <div class="tips-title">${translations[currentLang].strategyTitle}</div>
                    <p>${proj.strategy}</p>
                    <div class="tips-title" style="margin-top:0.5rem;">${translations[currentLang].musicTitle}</div>
                    <p>${proj.music}</p>
                    <div class="tips-title" style="margin-top:0.5rem;">${translations[currentLang].tipsTitle}</div>
                    <p>${proj.tips}</p>
                </div>
                <div class="action-buttons">
                    <button class="btn-action" onclick="regenerateScript('${nicheKey}')">${translations[currentLang].changeBtn}</button>
                    <button class="btn-action" onclick="window.print()">${translations[currentLang].printBtn}</button>
                </div>
            `;

            addBotMessage(scriptHtml);
        }

        function regenerateScript(nicheKey) {
            selectDuration(selectedDuration || '30s', nicheKey);
        }

        sendBtn.addEventListener('click', handleUserSubmit);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleUserSubmit();
        });

        // Inicio automático
        window.addEventListener('DOMContentLoaded', () => {
            addBotMessage(translations[currentLang].welcome);
        });
    </script>
</body>
</html>
