<!DOCTYPE html>
<html lang="es" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SparkyKrea Studio's - Asesoría Publicitaria Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brandVinotinto: '#800020',
                        brandVinotintoHover: '#600018',
                        brandVerde: '#10B981',
                        brandVerdeHover: '#059669',
                        darkBg: '#121212',
                        darkSidebar: '#18181b',
                        darkCard: '#242427',
                        darkBorder: '#3f3f46'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            height: 100%;
            height: 100dvh;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
    </style>
</head>
<body class="bg-darkBg text-gray-100 h-full w-full flex flex-col md:flex-row antialiased select-none overflow-hidden">

    <!-- OVERLAY MÓVIL PARA CERRAR MENÚ -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/70 z-30 hidden md:hidden transition-opacity"></div>

    <!-- SIDEBAR / MENÚ LATERAL -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-72 bg-darkSidebar border-r border-darkBorder flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out h-full shrink-0">
        <!-- Header Sidebar -->
        <div class="p-3.5 flex items-center justify-between border-b border-darkBorder shrink-0">
            <div class="flex items-center space-x-2.5">
                <!-- LOGO SVG INTEGRADO (Opción 2 Acordada) -->
                <svg width="180" height="40" viewBox="0 0 240 60" xmlns="http://www.w3.org/2000/svg" class="h-9 w-auto">
                    <defs>
                        <filter id="proGlowSidebar" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="1" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>
                    <g transform="translate(8, 6)" filter="url(#proGlowSidebar)">
                        <circle cx="24" cy="24" r="22" fill="#10B981" />
                        <rect x="13" y="17" width="15" height="14" rx="2.5" fill="#FFFFFF" />
                        <polygon points="28,21 35,16 35,32 28,27" fill="#FFFFFF" />
                        <path d="M 11 18 L 20.5 10 L 30 18" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        <circle cx="20.5" cy="24" r="5" fill="none" stroke="#10B981" stroke-width="0.8" opacity="0.8" />
                        <circle cx="20.5" cy="24" r="3.8" fill="none" stroke="#10B981" stroke-width="0.8" />
                        <path d="M 20.5 21.5 C 20.5 22.88 19.38 24 18 24 C 19.38 24 20.5 25.12 20.5 26.5 C 20.5 25.12 21.62 24 23 24 C 21.62 24 20.5 22.88 20.5 21.5 Z" fill="#10B981" />
                    </g>
                    <g transform="translate(68, 30)">
                        <text font-family="'Inter', sans-serif" font-weight="800" font-size="20" letter-spacing="-0.5">
                            <tspan fill="#800020">Sparky</tspan><tspan fill="#10B981">Krea</tspan>
                        </text>
                        <text x="1" y="14" font-family="'Inter', sans-serif" font-weight="600" font-size="9" fill="#FFFFFF" letter-spacing="2.5">
                            STUDIO'S
                        </text>
                    </g>
                </svg>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white p-1.5">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Botón Nuevo Chat -->
        <div class="p-3 shrink-0">
            <button onclick="startNewChat()" class="w-full py-2 px-3 bg-brandVinotinto hover:bg-brandVinotintoHover text-white rounded-xl font-medium shadow-md transition flex items-center justify-center gap-2 text-xs border border-rose-900/40">
                <i class="fa-solid fa-plus text-[10px]"></i>
                <span>Nuevo proyecto publicitario</span>
            </button>
        </div>

        <!-- Historial de Chats -->
        <div class="flex-1 overflow-y-auto custom-scrollbar px-3 py-1">
            <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider px-2 mb-2 flex items-center justify-between">
                <span>Campañas Recientes</span>
            </div>
            <div id="chat-history" class="space-y-1">
                <!-- Historial dinámico -->
            </div>
        </div>

        <div class="p-2.5 border-t border-darkBorder text-[10px] text-gray-500 text-center shrink-0">
            SparkyKrea Studio's &copy; 2026
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 flex flex-col h-full w-full overflow-hidden bg-darkBg relative">
        
        <!-- Header Superior -->
        <header class="h-12 border-b border-darkBorder flex items-center justify-between px-4 bg-darkBg shrink-0">
            <div class="flex items-center gap-2.5">
                <button onclick="toggleSidebar()" class="p-1.5 text-gray-300 hover:text-white bg-darkCard rounded-lg border border-darkBorder md:hidden">
                    <i class="fa-solid fa-bars-staggered text-xs"></i>
                </button>
                <!-- LOGO SVG INTEGRADO EN HEADER SUPERIOR (Opción 2 Acordada) -->
                <div class="flex items-center cursor-pointer select-none">
                    <svg width="180" height="40" viewBox="0 0 240 60" xmlns="http://www.w3.org/2000/svg" class="h-8 w-auto">
                        <defs>
                            <filter id="proGlowHeader" x="-20%" y="-20%" width="140%" height="140%">
                                <feGaussianBlur stdDeviation="1" result="blur" />
                                <feComposite in="SourceGraphic" in2="blur" operator="over" />
                            </filter>
                        </defs>
                        <g transform="translate(8, 6)" filter="url(#proGlowHeader)">
                            <circle cx="24" cy="24" r="22" fill="#10B981" />
                            <rect x="13" y="17" width="15" height="14" rx="2.5" fill="#FFFFFF" />
                            <polygon points="28,21 35,16 35,32 28,27" fill="#FFFFFF" />
                            <path d="M 11 18 L 20.5 10 L 30 18" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            <circle cx="20.5" cy="24" r="5" fill="none" stroke="#10B981" stroke-width="0.8" opacity="0.8" />
                            <circle cx="20.5" cy="24" r="3.8" fill="none" stroke="#10B981" stroke-width="0.8" />
                            <path d="M 20.5 21.5 C 20.5 22.88 19.38 24 18 24 C 19.38 24 20.5 25.12 20.5 26.5 C 20.5 25.12 21.62 24 23 24 C 21.62 24 20.5 22.88 20.5 21.5 Z" fill="#10B981" />
                        </g>
                        <g transform="translate(68, 30)">
                            <text font-family="'Inter', sans-serif" font-weight="800" font-size="20" letter-spacing="-0.5">
                                <tspan fill="#800020">Sparky</tspan><tspan fill="#10B981">Krea</tspan>
                            </text>
                            <text x="1" y="14" font-family="'Inter', sans-serif" font-weight="600" font-size="9" fill="#FFFFFF" letter-spacing="2.5">
                                STUDIO'S
                            </text>
                        </g>
                    </svg>
                </div>
            </div>

            <button onclick="startNewChat()" class="flex items-center gap-1.5 text-xs bg-darkCard hover:bg-darkBorder text-gray-200 px-2.5 py-1 rounded-lg border border-darkBorder transition">
                <i class="fa-solid fa-rotate-right text-brandVerde text-[11px]"></i>
                <span class="hidden sm:inline">Nueva Asesoría</span>
            </button>
        </header>

        <!-- Contenedor Principal (Optimizado sin Scroll exterior) -->
        <div id="chat-container" class="flex-1 overflow-y-auto custom-scrollbar p-3 md:p-5 max-w-3xl mx-auto w-full flex flex-col">
            
            <!-- Pantalla de Bienvenida -->
            <div id="welcome-screen" class="my-auto text-center py-2 flex flex-col items-center justify-center">
                <div class="w-12 h-12 bg-gradient-to-tr from-brandVinotinto to-brandVerde rounded-xl flex items-center justify-center mx-auto mb-3 shadow-lg text-xl text-white">
                    <i class="fa-solid fa-clapperboard"></i>
                </div>
                
                <h1 id="dynamic-greeting" class="text-xl md:text-2xl font-bold text-white mb-1.5">
                    ¡Hola! ¿En qué publicidad te puedo ayudar hoy?
                </h1>
                
                <p class="text-gray-400 text-xs max-w-sm mx-auto leading-relaxed">
                    Escribe el nombre de tu producto, juego, servicio o marca para comenzar a estructurar tu guion.
                </p>
            </div>

            <!-- Lista de Mensajes -->
            <div id="messages-list" class="space-y-3 hidden w-full pb-2"></div>
        </div>

        <!-- Entrada de Texto Fija Abajo -->
        <div class="p-2.5 md:p-3 border-t border-darkBorder bg-darkBg shrink-0">
            <div class="max-w-3xl mx-auto relative">
                <form onsubmit="handleSend(event)" class="relative flex items-center">
                    <input 
                        type="text"
                        id="user-input" 
                        placeholder="Escribe tu producto, servicio o consulta aquí..." 
                        autocomplete="off"
                        class="w-full pl-3.5 pr-10 py-2.5 bg-darkCard border border-darkBorder focus:border-brandVerde rounded-xl text-white placeholder-gray-500 focus:outline-none text-xs transition"
                    />
                    <button type="submit" class="absolute right-1.5 p-1.5 bg-brandVinotinto hover:bg-brandVinotintoHover text-white rounded-lg transition flex items-center justify-center">
                        <i class="fa-solid fa-paper-plane text-[10px]"></i>
                    </button>
                </form>
                <div class="text-center text-[10px] text-gray-500 mt-1">
                    SparkyKrea Studio's • Asesoría técnica, guiones profesionales y banda sonora.
                </div>
            </div>
        </div>

    </main>

    <script>
        let conversations = JSON.parse(localStorage.getItem('sparkykrea_chats')) || [];
        let currentChatId = null;
        let pendingTopic = null;

        function getTimeGreeting() {
            const hour = new Date().getHours();
            if (hour >= 5 && hour < 12) return '¡Buenos días!';
            if (hour >= 12 && hour < 19) return '¡Buenas tardes!';
            return '¡Buenas noches!';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const greetingText = `¡Hola! ${getTimeGreeting()} ¿En qué publicidad te puedo ayudar hoy?`;
            document.getElementById('dynamic-greeting').textContent = greetingText;
            renderSidebar();
        });

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function startNewChat() {
            currentChatId = Date.now().toString();
            pendingTopic = null;
            document.getElementById('welcome-screen').classList.remove('hidden');
            document.getElementById('messages-list').classList.add('hidden');
            document.getElementById('messages-list').innerHTML = '';
            document.getElementById('user-input').value = '';
            
            const sidebar = document.getElementById('sidebar');
            if (!sidebar.classList.contains('-translate-x-full')) {
                toggleSidebar();
            }
        }

        function deleteChat(id, e) {
            e.stopPropagation();
            conversations = conversations.filter(c => c.id !== id);
            localStorage.setItem('sparkykrea_chats', JSON.stringify(conversations));
            if (currentChatId === id) {
                startNewChat();
            } else {
                renderSidebar();
            }
        }

        function isSimpleGreeting(text) {
            const clean = text.toLowerCase().trim().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
            const greetings = ['hola', 'buenas', 'buenas tardes', 'buenos dias', 'buenas noches', 'que tal', 'saludos', 'xd', 'lol', 'hey', 'ok', 'oigan'];
            return greetings.includes(clean) || clean.length <= 3;
        }

        function handleSend(e) {
            if (e) e.preventDefault();
            const input = document.getElementById('user-input');
            const query = input.value.trim();
            if (!query) return;

            if (!currentChatId) {
                currentChatId = Date.now().toString();
            }

            document.getElementById('welcome-screen').classList.add('hidden');
            const messagesList = document.getElementById('messages-list');
            messagesList.classList.remove('hidden');

            messagesList.innerHTML += `
                <div class="flex gap-2.5 justify-end">
                    <div class="bg-brandVinotinto text-white py-2 px-3 rounded-xl rounded-tr-none max-w-[85%] text-xs shadow-md">
                        ${escapeHtml(query)}
                    </div>
                </div>
            `;

            input.value = '';
            scrollToBottom();

            const loadingId = 'loading-' + Date.now();
            messagesList.innerHTML += `
                <div id="${loadingId}" class="flex gap-2.5 justify-start items-center text-gray-400 text-xs py-1">
                    <div class="w-6 h-6 rounded-lg bg-darkCard border border-darkBorder flex items-center justify-center text-brandVerde">
                        <i class="fa-solid fa-spinner fa-spin text-[10px]"></i>
                    </div>
                    <span class="text-[11px]">Procesando...</span>
                </div>
            `;
            scrollToBottom();

            setTimeout(() => {
                document.getElementById(loadingId)?.remove();
                const botResponse = processPublicityRequest(query);

                messagesList.innerHTML += `
                    <div class="flex gap-2.5 justify-start">
                        <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-brandVinotinto to-brandVerde flex-shrink-0 flex items-center justify-center text-white font-bold text-[10px] shadow-md">
                            SK
                        </div>
                        <div class="bg-darkCard border border-darkBorder text-gray-200 p-3 rounded-xl rounded-tl-none max-w-[90%] text-xs leading-relaxed shadow-md space-y-2">
                            ${botResponse}
                        </div>
                    </div>
                `;
                
                saveMessageToHistory(query, botResponse);
                scrollToBottom();
            }, 400);
        }

        function selectDurationFromDropdown(val) {
            if (!val) return;
            if (val === 'custom') {
                const customVal = prompt("Ingresa la duración exacta (Ejemplo: 45 segundos, 2 minutos):");
                if (customVal) {
                    document.getElementById('user-input').value = customVal;
                    handleSend();
                }
            } else {
                document.getElementById('user-input').value = val;
                handleSend();
            }
        }

        function parseDurationInSeconds(text) {
            const clean = text.toLowerCase();
            let minutes = 0;
            let seconds = 0;

            const minMatch = clean.match(/(\d+)\s*(min|minuto|minutos)/);
            const secMatch = clean.match(/(\d+)\s*(seg|segundo|segundos)/);
            const onlyNumberMatch = clean.match(/(\d+)/);

            if (minMatch) minutes = parseInt(minMatch[1]);
            if (secMatch) seconds = parseInt(secMatch[1]);

            if (!minMatch && !secMatch && onlyNumberMatch) {
                const num = parseInt(onlyNumberMatch[1]);
                if (num <= 10) minutes = num;
                else seconds = num;
            }

            const totalSeconds = (minutes * 60) + seconds;
            return totalSeconds > 0 ? totalSeconds : 30;
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function generateDetailedScript(topic, totalSeconds) {
            let steps = [];
            
            if (totalSeconds <= 15) {
                steps = [
                    { time: "0:00 - 0:03", visual: `Plano detalle de alto impacto (Macro). Aparición visual de ${topic}.`, audio: `Grito de atención / SFX "Swoosh" + Frase gancho.` },
                    { time: "0:03 - 0:10", visual: `Cortes rápidos mostrando las mejores características de ${topic}.`, audio: `Voz dinámica + Beat al ritmo de imágenes.` },
                    { time: "0:10 - 0:15", visual: `Pantalla de cierre con logo y oferta de llamada a la acción.`, audio: `Locución: "¡Pruébalo ahora, enlace aquí abajo!"` }
                ];
            } else if (totalSeconds <= 30) {
                steps = [
                    { time: "0:00 - 0:05", visual: `Plano subjetivo (POV) mostrando un problema común antes de usar ${topic}.`, audio: `Pregunta directa al espectador con fondo musical suspenso.` },
                    { time: "0:05 - 0:15", visual: `Transición rápida hacia la solución: Revelación de ${topic} en acción.`, audio: `Drop musical + Frase con propuesta de valor.` },
                    { time: "0:15 - 0:25", visual: `3 Tomas seguidas: Plano medio, primer plano de calidad y resultado final.`, audio: `Explicación rápida de beneficios clave.` },
                    { time: "0:25 - 0:30", visual: `Banner promocional con flechas apuntando al botón de descarga/compra.`, audio: `Call to Action final: "¡Haz clic para aprovechar la oferta!"` }
                ];
            } else {
                const stepDuration = Math.floor(totalSeconds / 4);
                let currentSec = 0;
                for (let i = 0; i < 4; i++) {
                    let nextSec = (i === 3) ? totalSeconds : currentSec + stepDuration;
                    steps.push({
                        time: `${formatTime(currentSec)} - ${formatTime(nextSec)}`,
                        visual: `Bloque ${i+1}: Tomas de ${topic}. Alterna entre plano general y primeros planos estéticos.`,
                        audio: `Desarrollo de locución fluida con transiciones musicales de fondo.`
                    });
                    currentSec = nextSec;
                }
            }

            return steps.map(s => `
                <div class="border-l-2 border-brandVerde pl-2.5 my-1.5 space-y-0.5">
                    <p class="font-bold text-white text-[11px]">⏱️ <span>${s.time}</span></p>
                    <p class="text-gray-300">📹 <strong>Visual:</strong> ${s.visual}</p>
                    <p class="text-gray-400">🎙️ <strong>Audio:</strong> ${s.audio}</p>
                </div>
            `).join("");
        }

        function processPublicityRequest(input) {
            const clean = input.toLowerCase().trim();
            const greeting = getTimeGreeting();

            // CASO 1: El usuario solo dijo "Hola", "Buenas", "Xd", etc.
            if (isSimpleGreeting(clean) && !pendingTopic) {
                return `
                    <p>${greeting} ¿En qué producto, marca o servicio te puedo ayudar a promocionar hoy?</p>
                `;
            }

            const hasTimeKeywords = /(\d+|segundo|segundos|minuto|minutos|min|seg)/i.test(clean);
            
            // CASO 2: Ya tenemos un tema pendiente y nos acaban de dar el tiempo
            if (pendingTopic && hasTimeKeywords) {
                const totalSec = parseDurationInSeconds(clean);
                const scriptHTML = generateDetailedScript(pendingTopic, totalSec);
                const currentTopic = pendingTopic;
                pendingTopic = null;

                return `
                    <div class="space-y-3">
                        <div class="border-b border-darkBorder pb-1.5">
                            <h2 class="text-xs font-bold text-brandVerde">🎬 Estrategia & Guion Publicitario</h2>
                            <p class="text-[11px] text-gray-400">Proyecto: <strong class="text-white">${escapeHtml(currentTopic)}</strong> | Tiempo: <strong class="text-white">${formatTime(totalSec)}</strong></p>
                        </div>

                        <!-- GUION PASO A PASO -->
                        <div class="bg-darkSidebar p-2.5 rounded-xl border border-darkBorder text-[11px]">
                            <p class="text-brandVerde font-bold uppercase tracking-wider mb-1">📜 GUION PASO A PASO:</p>
                            ${scriptHTML}
                        </div>

                        <!-- ESTRATEGIA DE GRABACIÓN -->
                        <div class="bg-darkSidebar p-2.5 rounded-xl border border-darkBorder text-[11px] space-y-1">
                            <p class="text-brandVerde font-bold uppercase tracking-wider">🎥 ESTRATEGIA DE GRABACIÓN:</p>
                            <p>• <strong>Iluminación & Planos:</strong> Usa luz frontal suave con fondo iluminado en contraste. Varía entre planos medios y cerrados cada 3 segundos.</p>
                            <p>• <strong>Edición:</strong> Utiliza cortes de velocidad y subtítulos animados en el centro de la pantalla.</p>
                        </div>

                        <!-- CANCIONES -->
                        <div class="bg-darkSidebar p-2.5 rounded-xl border border-darkBorder text-[11px] space-y-1">
                            <p class="text-brandVerde font-bold uppercase tracking-wider">🎵 BANDA SONORA RECOMENDADA:</p>
                            <p class="text-gray-300">Sugerencias para la música (puedes elegir cualquiera de estas o una a tu gusto):</p>
                            <ul class="list-disc list-inside text-gray-400 space-y-0.5 pl-1">
                                <li><strong>Estilo Enérgico / Trap / Phonk:</strong> Para alto impacto y ritmo rápido.</li>
                                <li><strong>Estilo Pop / House Moderno:</strong> Excelente para productos comerciales.</li>
                                <li><strong>Estilo Lofi / Relaxed:</strong> Perfecto para servicios o tutoriales tranquilos.</li>
                            </ul>
                        </div>
                    </div>
                `;
            }

            // CASO 3: Es la solicitud inicial de un tema
            pendingTopic = input;

            return `
                <div class="space-y-2">
                    <p>${greeting} ¡Claro que sí! Con gusto te ayudo con la publicidad para <strong class="text-brandVerde">"${escapeHtml(input)}"</strong>.</p>
                    <p class="text-gray-300">¿Cuánto tiempo quieres que dure el video para poder sacarte el guion exacto?</p>
                    
                    <!-- SELECTOR COMPACTO Y ESTILIZADO DE TIEMPO -->
                    <div class="pt-1">
                        <select onchange="selectDurationFromDropdown(this.value)" class="w-full bg-darkSidebar border border-darkBorder hover:border-brandVerde text-gray-200 text-xs rounded-xl p-2 focus:outline-none cursor-pointer transition">
                            <option value="">⏱️ Selecciona el tiempo aquí...</option>
                            <option value="10 segundos">10 Segundos</option>
                            <option value="20 segundos">20 Segundos</option>
                            <option value="30 segundos">30 Segundos</option>
                            <option value="60 segundos">60 Segundos (1 Minuto)</option>
                            <option value="3 minutos">3 Minutos</option>
                            <option value="5 minutos">5 Minutos</option>
                            <option value="10 minutos">10 Minutos</option>
                            <option value="custom">✍️ Escribir tiempo personalizado...</option>
                        </select>
                    </div>
                </div>
            `;
        }

        function scrollToBottom() {
            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;
        }

        function saveMessageToHistory(userText, botText) {
            let chat = conversations.find(c => c.id === currentChatId);
            if (!chat) {
                chat = { 
                    id: currentChatId, 
                    title: userText.substring(0, 20) + (userText.length > 20 ? '...' : ''),
                    messages: [] 
                };
                conversations.unshift(chat);
            }
            
            chat.messages.push({ sender: 'user', text: userText });
            chat.messages.push({ sender: 'bot', text: botText });

            localStorage.setItem('sparkykrea_chats', JSON.stringify(conversations));
            renderSidebar();
        }

        function renderSidebar() {
            const historyContainer = document.getElementById('chat-history');
            if (conversations.length === 0) {
                historyContainer.innerHTML = `<div class="text-[11px] text-gray-500 italic px-2 py-1">Sin campañas guardadas</div>`;
                return;
            }
            historyContainer.innerHTML = '';
            conversations.forEach(c => {
                const active = c.id === currentChatId;
                historyContainer.innerHTML += `
                    <div onclick="selectChat('${c.id}')" class="group flex items-center justify-between px-2.5 py-1.5 rounded-lg cursor-pointer text-xs transition ${active ? 'bg-brandVinotinto/30 border border-brandVinotinto/50 text-white font-medium' : 'text-gray-400 hover:bg-darkCard hover:text-gray-200'}">
                        <div class="flex items-center gap-2 truncate">
                            <i class="fa-solid fa-film text-brandVerde text-[10px]"></i>
                            <span class="truncate text-[11px]">${escapeHtml(c.title)}</span>
                        </div>
                        <button onclick="deleteChat('${c.id}', event)" class="opacity-0 group-hover:opacity-100 p-1 text-gray-500 hover:text-rose-400 transition" title="Eliminar chat">
                            <i class="fa-solid fa-trash-can text-[10px]"></i>
                        </button>
                    </div>
                `;
            });
        }

        function selectChat(id) {
            currentChatId = id;
            const chat = conversations.find(c => c.id === id);
            if (!chat) return;

            document.getElementById('welcome-screen').classList.add('hidden');
            const messagesList = document.getElementById('messages-list');
            messagesList.classList.remove('hidden');
            messagesList.innerHTML = '';

            chat.messages.forEach(m => {
                if (m.sender === 'user') {
                    messagesList.innerHTML += `
                        <div class="flex gap-2.5 justify-end">
                            <div class="bg-brandVinotinto text-white py-2 px-3 rounded-xl rounded-tr-none max-w-[85%] text-xs shadow-md">
                                ${escapeHtml(m.text)}
                            </div>
                        </div>
                    `;
                } else {
                    messagesList.innerHTML += `
                        <div class="flex gap-2.5 justify-start">
                            <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-brandVinotinto to-brandVerde flex-shrink-0 flex items-center justify-center text-white font-bold text-[10px] shadow-md">
                                SK
                            </div>
                            <div class="bg-darkCard border border-darkBorder text-gray-200 p-3 rounded-xl rounded-tl-none max-w-[90%] text-xs leading-relaxed shadow-md space-y-2">
                                ${m.text}
                            </div>
                        </div>
                    `;
                }
            });

            renderSidebar();
            scrollToBottom();

            const sidebar = document.getElementById('sidebar');
            if (!sidebar.classList.contains('-translate-x-full')) {
                toggleSidebar();
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
