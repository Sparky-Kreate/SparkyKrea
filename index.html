    </main>

    <script>
        let conversations = JSON.parse(localStorage.getItem('sparkykrea_chats')) || [];
        let currentChatId = null;
        let pendingTopic = null;
        let pendingDetail = null;
        let awaitingSpecificQuestion = false;

        function getTimeGreeting() {
            const hour = new Date().getHours();
            if (hour >= 5 && hour < 12) return 'Estimado usuario, tenga muy buenos días.';
            if (hour >= 12 && hour < 19) return 'Es un placer saludarle, tenga muy buenas tardes.';
            return 'Le damos la más cordial bienvenida, tenga excelentes noches.';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const greetingText = `¡Hola! ${getTimeGreeting()} ¿En qué proyecto publicitario le gustaría que colaboremos el día de hoy?`;
            document.getElementById('dynamic-greeting').textContent = greetingText;
            renderSidebar();
        });

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function startNewChat() {
            currentChatId = Date.now().toString();
            pendingTopic = null;
            pendingDetail = null;
            awaitingSpecificQuestion = false;
            document.getElementById('welcome-screen').classList.remove('hidden');
            document.getElementById('messages-list').classList.add('hidden');
            document.getElementById('messages-list').innerHTML = '';
            document.getElementById('user-input').value = '';
            
            const sidebar = document.getElementById('sidebar');
            if (!sidebar.classList.contains('-translate-x-full')) {
                toggleSidebar();
            }
        }

        function deleteChat(id, e) {
            e.stopPropagation();
            conversations = conversations.filter(c => c.id !== id);
            localStorage.setItem('sparkykrea_chats', JSON.stringify(conversations));
            if (currentChatId === id) {
                startNewChat();
            } else {
                renderSidebar();
            }
        }

        function isSimpleGreeting(text) {
            const clean = text.toLowerCase().trim().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
            const greetings = ['hola', 'buenas', 'buenas tardes', 'buenos dias', 'buenas noches', 'que tal', 'saludos', 'xd', 'lol', 'hey', 'ok', 'oigan'];
            return greetings.includes(clean) || clean.length <= 3;
        }

        function handleSend(e) {
            if (e) e.preventDefault();
            const input = document.getElementById('user-input');
            const query = input.value.trim();
            if (!query) return;

            if (!currentChatId) {
                currentChatId = Date.now().toString();
            }

            document.getElementById('welcome-screen').classList.add('hidden');
            const messagesList = document.getElementById('messages-list');
            messagesList.classList.remove('hidden');

            messagesList.innerHTML += `
                <div class="flex gap-2.5 justify-end">
                    <div class="bg-brandVinotinto text-white py-2 px-3 rounded-xl rounded-tr-none max-w-[85%] text-xs shadow-md">
                        ${escapeHtml(query)}
                    </div>
                </div>
            `;

            input.value = '';
            scrollToBottom();

            const loadingId = 'loading-' + Date.now();
            messagesList.innerHTML += `
                <div id="${loadingId}" class="flex gap-2.5 justify-start items-center text-gray-400 text-xs py-1">
                    <div class="w-6 h-6 rounded-lg bg-darkCard border border-darkBorder flex items-center justify-center text-brandVerde">
                        <i class="fa-solid fa-spinner fa-spin text-[10px]"></i>
                    </div>
                    <span class="text-[11px]">Diseñando estrategia publicitaria con elegancia...</span>
                </div>
            `;
            scrollToBottom();

            setTimeout(() => {
                document.getElementById(loadingId)?.remove();
                const botResponse = processPublicityRequest(query);

                messagesList.innerHTML += `
                    <div class="flex gap-2.5 justify-start">
                        <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-brandVinotinto to-brandVerde flex-shrink-0 flex items-center justify-center text-white font-bold text-[10px] shadow-md">
                            SK
                        </div>
                        <div class="bg-darkCard border border-darkBorder text-gray-200 p-3 rounded-xl rounded-tl-none max-w-[90%] text-xs leading-relaxed shadow-md space-y-2">
                            ${botResponse}
                        </div>
                    </div>
                `;
                
                saveMessageToHistory(query, botResponse);
                scrollToBottom();
            }, 400);
        }

        function selectDurationFromDropdown(val) {
            if (!val) return;
            if (val === 'custom') {
                const customVal = prompt("Por favor, indique la duración deseada de forma exacta (Ejemplo: 45 segundos, 2 minutos):");
                if (customVal) {
                    document.getElementById('user-input').value = customVal;
                    handleSend();
                }
            } else {
                document.getElementById('user-input').value = val;
                handleSend();
            }
        }

        function parseDurationInSeconds(text) {
            const clean = text.toLowerCase();
            let minutes = 0;
            let seconds = 0;

            const minMatch = clean.match(/(\d+)\s*(min|minuto|minutos)/);
            const secMatch = clean.match(/(\d+)\s*(seg|segundo|segundos)/);
            const onlyNumberMatch = clean.match(/(\d+)/);

            if (minMatch) minutes = parseInt(minMatch[1]);
            if (secMatch) seconds = parseInt(secMatch[1]);

            if (!minMatch && !secMatch && onlyNumberMatch) {
                const num = parseInt(onlyNumberMatch[1]);
                if (num <= 10) minutes = num;
                else seconds = num;
            }

            const totalSeconds = (minutes * 60) + seconds;
            return totalSeconds > 0 ? totalSeconds : 30;
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // GENERADOR DE GUIONES RECARGADO CON MÚLTIPLES IDEAS Y TÉCNICAS
        function generateSpecificScript(topic, detail, totalSeconds) {
            const topicClean = (topic + " " + (detail || "")).toLowerCase();
            let steps = [];
            let creativeHooks = [];
            let visualEffectsIdeas = [];

            // PIZZERÍA / RESTAURANT / COMIDA
            if (topicClean.includes("piz") || topicClean.includes("restauran") || topicClean.includes("comida") || topicClean.includes("burger") || topicClean.includes("cafe")) {
                creativeHooks = [
                    "🔥 <strong>Enfoque Sensorial Exquisito:</strong> 'El arte culinario se define en el primer aroma que despierta tus sentidos.'",
                    "🔥 <strong>Enfoque Dinámico POV:</strong> 'Permítame mostrarle el detrás de escena del platillo más codiciado de la ciudad.'",
                    "🔥 <strong>Enfoque Urgencia Elegante:</strong> 'Una receta tradicional perfeccionada para transformar su noche ordinaria en una experiencia memorable.'"
                ];
                visualEffectsIdeas = [
                    "✨ <strong>Macro Shot de Texturas:</strong> Tomas extremadamente cercanas al queso fundiéndose y el dorado perfecto de la masa.",
                    "✨ <strong>Transición Lumínica:</strong> Destello de luz cálida simulando la salida directa del horno de piedra."
                ];

                if (totalSeconds <= 20) {
                    steps = [
                        { time: "0:00 - 0:04", visual: "Plano cenital elegante abriendo un empaque artesanal con salida de vapor sutil.", audio: "Música instrumental refinada + 'La excelencia gastronómica ahora a su alcance.'" },
                        { time: "0:04 - 0:14", visual: "Secuencia rítmica de ingredientes frescos, aceites de oliva y emplatado impecable.", audio: "Ritmo comercial sofisticado + 'Ingredientes seleccionados con riguroso estándar de calidad.'" },
                        { time: "0:14 - 0:20", visual: "Plano final con datos de contacto, ubicación y distintivo de la marca.", audio: "Locución pausada: 'Permítanos consentir su paladar hoy mismo.'" }
                    ];
                } else {
                    const t1 = formatTime(Math.floor(totalSeconds * 0.25));
                    const t2 = formatTime(Math.floor(totalSeconds * 0.65));
                    const tFinal = formatTime(totalSeconds);
                    steps = [
                        { time: `0:00 - ${t1}`, visual: "Presentación institucional en primera persona dando la bienvenida al establecimiento con total hospitalidad.", audio: "Banda sonora cálida y acogedora + 'Sean bienvenidos a un espacio donde la tradición se fusiona con el buen gusto.'" },
                        { time: `${t1} - ${t2}`, visual: "Elaboración artesanal detallada: amasado profesional, selección de especias y horneado controlado.", audio: "Efectos sonoros limpios y voz guía describiendo cada paso con elegancia." },
                        { time: `${t2} - ${tFinal}`, visual: "Cierre corporativo mostrando el producto final servido en mesa con vajilla distinguida.", audio: "Locución final: 'Visítenos o realice su pedido preferencial a través de nuestros canales oficiales.'" }
                    ];
                }
            } 
            // GAMING / VALORANT / LOL / TFT / STREAMERS
            else if (topicClean.includes("valorant") || topicClean.includes("lol") || topicClean.includes("league") || topicClean.includes("tft") || topicClean.includes("game") || topicClean.includes("juego")) {
                const char = detail ? detail : "el personaje seleccionado";
                creativeHooks = [
                    "🔥 <strong>Enfoque Táctico Magistral:</strong> 'La maestría en el competitivo no depende del azar, sino de la precisión absoluta con " + char + ".'",
                    "🔥 <strong>Enfoque Analítico:</strong> 'Desglosamos la estrategia definitiva que transformará su rendimiento en cada partida clasificatoria.'"
                ];
                visualEffectsIdeas = [
                    "✨ <strong>Superposición HUD Avanzada:</strong> Gráficos esquemáticos flotantes con análisis de mapa y timing de habilidades.",
                    "✨ <strong>Cámara Lenta Dinámica:</strong> Efecto cinematográfico en el instante preciso de la jugada clave (Clutch)."
                ];

                steps = [
                    { time: "0:00 - 0:05", visual: `Secuencia cinemática de alta definición mostrando la habilidad definitiva de ${char}.`, audio: "Música electrónica envolvente + 'Eleve su nivel de juego al siguiente peldaño estratégico.'" },
                    { time: "0:05 - " + formatTime(Math.floor(totalSeconds * 0.8)), visual: "Demostración de jugabilidad en tiempo real con marcas tácticas y explicación paso a paso de posicionamiento.", audio: "Locución técnica, clara y pulida orientada al rendimiento del espectador." },
                    { time: formatTime(Math.floor(totalSeconds * 0.8)) + " - " + formatTime(totalSeconds), visual: "Pantalla de cierre corporativa invitando a formar parte de la comunidad exclusiva.", audio: "CTA: 'Suscríbase y perfeccione su estilo de juego con nosotros.'" }
                ];
            }
            // FUTBOL / DEPORTES / ATLETAS
            else if (topicClean.includes("fut") || topicClean.includes("deporte") || topicClean.includes("equip") || topicClean.includes("entrena")) {
                const target = detail ? detail : "el atleta profesional";
                creativeHooks = [
                    "🔥 <strong>Enfoque de Élite:</strong> 'La verdadera grandeza deportiva se construye en la constancia silenciosa de cada entrenamiento.'",
                    "🔥 <strong>Enfoque Motivacional Sofisticado:</strong> 'Superar los límites establecidos requiere disciplina, visión y el equipamiento adecuado.'"
                ];
                visualEffectsIdeas = [
                    "✨ <strong>Cámara Lenta Dramática (240fps):</strong> Detalle del impacto sobre el césped o la tensión muscular en máxima competencia.",
                    "✨ <strong>Corrección de Color Cinemática:</strong> Tonos contrastados y elegantes que realzan la épica del momento."
                ];

                steps = [

                    { time: "0:06 - " + formatTime(Math.floor(totalSeconds * 0.75)), visual: "Montaje dinámico de jugadas técnicas, velocidad de ejecución y dominio absoluto del balón.", audio: "Efectos ambientales de estadio y voz institucional." },
                    { time: formatTime(Math.floor(totalSeconds * 0.75)) + " - " + formatTime(totalSeconds), visual: "Exhibición de indumentaria de alto rendimiento con logotipo corporativo central.", audio: "CTA: 'Equípate con la distinción de los profesionales.'" }
                ];
            }
            // GENERAL / PRODUCTOS / SERVICIOS
            else {
                creativeHooks = [
                    "🔥 <strong>Enfoque de Solución Ejecutiva:</strong> 'Descubra cómo optimizar su tiempo y recursos mediante una solución diseñada para exigentes.'",
                    "🔥 <strong>Enfoque de Innovación:</strong> 'Una propuesta vanguardista creada para redefinir los estándares de su sector.'"

function parseDurationInSeconds(text) {

    const clean = text.toLowerCase();

    let minutes = 0;
    let seconds = 0;

    const minMatch = clean.match(
        /(\d+)\s*(min|minuto|minutos)/
    );

    const secMatch = clean.match(
        /(\d+)\s*(seg|segundo|segundos)/
    );

    const onlyNumberMatch = clean.match(/(\d+)/);

    if (minMatch) {
        minutes = parseInt(minMatch[1]);
    }

    if (secMatch) {
        seconds = parseInt(secMatch[1]);
    }

    if (!minMatch && !secMatch && onlyNumberMatch) {

        const num = parseInt(
            onlyNumberMatch[1]
        );

        if (num <= 10) {
            minutes = num;
        } else {
            seconds = num;
        }
    }

    const totalSeconds =
        (minutes * 60) + seconds;

    return totalSeconds > 0
        ? totalSeconds
        : 30;
}

function formatTime(sec) {

    const m = Math.floor(sec / 60);

    const s = sec % 60;

    return `${m}:${s < 10 ? '0' : ''}${s}`;
}

        clean.includes('negocio')

        return 'service';

    return 'general';
}

function generateSpecificScript(topic, detail, totalSeconds, category) {

    const cleanTopic = topic.toLowerCase();

    const selectedCategory =
        category || detectCategory(topic);

    let hookList =
        hooks[selectedCategory] || hooks.general;

    let chosenHooks = [];

    /* Elegimos 3 ganchos diferentes */
    while (chosenHooks.length < 3) {

        const h = randomItem(hookList);

        if (!chosenHooks.includes(h)) {
            chosenHooks.push(h);
        }
    }

    let steps = [];

    /* =====================================================

    if (selectedCategory === 'food') {

            detail && detail.toLowerCase() !== 'ninguno'
                ? detail

            Math.max(3, Math.floor(totalSeconds * 0.20));

            Math.max(t1 + 4, Math.floor(totalSeconds * 0.55));

            Math.max(t2 + 4, Math.floor(totalSeconds * 0.80));

        steps = [

            {

   ========================================================= */

function processPublicityRequest(input) {

    const clean = input
        .toLowerCase()
        .trim();

    /* -----------------------------------------
       SALUDO
       ----------------------------------------- */

    if (
        isSimpleGreeting(clean) &&
        !pendingTopic &&
        !awaitingSpecificQuestion
    ) {

        return `
            <p>
                ${getTimeGreeting()}
            </p>

            <p class="text-gray-300">
                Dime qué quieres crear: una publicidad,
                un Reel, un anuncio para un juego, una campaña
                para un restaurante o lo que tengas en mente.
            </p>
        `;
    }


    /* -----------------------------------------
       RESPUESTA A PERSONAJE / PROTAGONISTA
       ----------------------------------------- */

    if (awaitingSpecificQuestion) {

        pendingDetail = input;

        awaitingSpecificQuestion = false;

        if (
            pendingDetail.toLowerCase().includes('ninguno') ||
            pendingDetail.toLowerCase().includes('no') ||
            pendingDetail.toLowerCase().includes('cualquiera')
        ) {

            pendingDetail = 'ninguno';
        }

        return `

            <div class="space-y-2">

                <p>
                    🎯 Perfecto. Entonces trabajaremos
                    <strong class="text-brandVerde">
                        ${escapeHtml(
                            pendingDetail
                        )}
                    </strong>
                    como referencia principal.
                </p>

                <p class="text-gray-300">
                    Ahora solo necesito saber cuánto debe durar
                    el video para ajustar el ritmo, cantidad de
                    tomas y cantidad de información.
                </p>

                ${durationSelector()}

            </div>

        `;
    }


    /* -----------------------------------------
       DETECTAR DURACIÓN
       ----------------------------------------- */

    const hasTimeKeywords =
        /(\d+\s*(seg|segundo|segundos|min|minuto|minutos))/i.test(clean);


    /* -----------------------------------------
       GENERAR GUION
       ----------------------------------------- */

    if (pendingTopic && hasTimeKeywords) {

        const totalSec =
            parseDurationInSeconds(clean);

        const generated =
            generateSpecificScript(
                pendingTopic,
                pendingDetail,
                totalSec,
                pendingCategory
            );

        const mainTopic =
            pendingTopic;

        const detailTopic =
            pendingDetail;

        const finalCategory =
            pendingCategory;

        pendingTopic = null;
        pendingDetail = null;
        pendingCategory = null;

        return `

            <div class="space-y-3">

                <div class="border-b border-darkBorder pb-2">

                    <h2 class="text-xs font-bold text-brandVerde">
                        🎬 GUION PUBLICITARIO PERSONALIZADO
                    </h2>

                    <p class="text-[11px] text-gray-400">

                        Campaña:
                        <strong class="text-white">
                            ${escapeHtml(mainTopic)}
                        </strong>

                        ${
                            detailTopic
                            ? `
                                · Protagonista:
                                <strong class="text-white">
                                    ${escapeHtml(detailTopic)}
                                </strong>
                            `
                            : ''
                        }

                        · Duración:
                        <strong class="text-white">
                            ${formatTime(totalSec)}
                        </strong>

                    </p>

                </div>


                <!-- GANCHOS -->

                <div class="bg-darkSidebar p-2.5 rounded-xl border border-darkBorder text-[11px] space-y-2">

                    <p class="text-brandVerde font-bold uppercase tracking-wider">
                        💡 GANCHOS PARA LOS PRIMEROS SEGUNDOS
                    </p>

                    ${generated.hooks.join('<br>')}

                </div>


                <!-- GUION -->

                <div class="bg-darkSidebar p-2.5 rounded-xl border border-darkBorder text-[11px]">

                    <p class="text-brandVerde font-bold uppercase tracking-wider mb-2">
                        📜 GUION TÉCNICO
                    </p>

                    ${generated.scriptSteps}

                </div>


                <!-- EDICIÓN -->

                <div class="bg-darkSidebar p-2.5 rounded-xl border border-darkBorder text-[11px] space-y-1.5">

                    <p class="text-brandVerde font-bold uppercase tracking-wider">
                        ⚡ EDICIÓN Y EFECTOS
                    </p>

                    <p>
                        ✨ Usa cortes al ritmo de la música,
                        evitando mantener el mismo plano demasiado tiempo.
                    </p>

                    <p>
                        🎯 Reserva los zooms, cámara lenta y efectos
                        fuertes para los momentos realmente importantes.
                    </p>

                    <p>
                        👀 Añade texto en pantalla únicamente cuando
                        ayude a entender o reforzar la idea.
                    </p>

                    <p>
                        🔊 Sincroniza los efectos de sonido con
                        cambios de plano, golpes, acciones o transiciones.
                    </p>

                </div>


                <!-- MÚSICA -->

                <div class="bg-darkSidebar p-2.5 rounded-xl border border-darkBorder text-[11px]">

                    <p class="text-brandVerde font-bold uppercase tracking-wider mb-1">
                        🎵 AMBIENTE MUSICAL
                    </p>

                    <p class="text-gray-300">
                        ${generated.music}
                    </p>

                    <p class="text-gray-500 mt-1">
                        Busca una pista con licencia adecuada para uso
                        comercial si el contenido se va a publicar como anuncio.
                    </p>

                </div>


                <!-- CONSEJO FINAL -->

                <div class="bg-darkSidebar p-2.5 rounded-xl border border-darkBorder text-[11px]">

                    ${generated.motivation}

                </div>

            </div>

        `;
    }


    /* -----------------------------------------
       NUEVA SOLICITUD
       ----------------------------------------- */

    pendingTopic = input;

    pendingCategory =
        detectCategory(input);


    /* -----------------------------------------
       GAMING
       ----------------------------------------- */

    if (pendingCategory === 'gaming') {

        awaitingSpecificQuestion = true;

        return getGamingQuestion(input);
    }


    /* -----------------------------------------
       DEPORTES
       ----------------------------------------- */

    if (pendingCategory === 'sports') {

        awaitingSpecificQuestion = true;

        return getSportsQuestion(input);
    }


    /* -----------------------------------------
       COMIDA
       ----------------------------------------- */

    if (pendingCategory === 'food') {

        return `

            <div class="space-y-2">

                <p>
                    🍕 ¡Perfecto! Ya entendí que trabajaremos
                    con <strong class="text-brandVerde">
                    ${escapeHtml(input)}
                    </strong>.
                </p>

                <p class="text-gray-300">
                    Voy a enfocar el guion específicamente en
                    el producto, preparación, presentación,
                    ambiente y razones para querer probarlo.
                </p>

                <p class="text-white">
                    🍽️ Si tienes un plato estrella, promoción
                    o producto específico que quieras destacar,
                    puedes decírmelo ahora.
                </p>

                <p class="text-gray-400">
                    Si no, podemos trabajar con el producto
                    principal del negocio.
                </p>

                ${durationSelector()}

            </div>

        `;
    }


    /* -----------------------------------------
       PRODUCTOS / SERVICIOS / GENERAL
       ----------------------------------------- */

    return `

        <div class="space-y-2">

            <p>
                💡 Perfecto. Vamos a trabajar
                <strong class="text-brandVerde">
                    ${escapeHtml(input)}
                </strong>.
            </p>

            <p class="text-gray-300">
                Primero definiré el enfoque, el gancho,
                las tomas y el cierre para que el anuncio
                tenga una idea clara y no sea simplemente
                una lista de características.
            </p>

            ${durationSelector()}

        </div>

    `;
}


/* =========================================================
   SCROLL
   ========================================================= */

function scrollToBottom() {

    const container =
        document.getElementById('chat-container');

    container.scrollTop =
        container.scrollHeight;
}


/* =========================================================
   HISTORIAL
   ========================================================= */

function saveMessageToHistory(
    userText,
    botText
) {

    let chat =
        conversations.find(
            c => c.id === currentChatId
        );

    if (!chat) {

        chat = {

            id: currentChatId,

            title:
                userText.substring(0, 20) +
                (
                    userText.length > 20
                    ? '...'
                    : ''
                ),

            messages: []
        };

        conversations.unshift(chat);
    }


    chat.messages.push({

        sender: 'user',

        text: userText
    });


    chat.messages.push({

        sender: 'bot',

        text: botText
    });


    localStorage.setItem(
        'sparkykrea_chats',
        JSON.stringify(conversations)
    );

    renderSidebar();
}


/* =========================================================
   RENDER SIDEBAR
   ========================================================= */

function renderSidebar() {

    const historyContainer =
        document.getElementById('chat-history');

    if (conversations.length === 0) {

        historyContainer.innerHTML = `

            <div class="text-[11px] text-gray-500 italic px-2 py-1">
                Sin campañas guardadas
            </div>

        `;

        return;
    }


    historyContainer.innerHTML = '';


    conversations.forEach(c => {

        const active =
            c.id === currentChatId;


        historyContainer.innerHTML += `

            <div
                onclick="selectChat('${c.id}')"
                class="group flex items-center justify-between px-2.5 py-1.5 rounded-lg cursor-pointer text-xs transition
                ${
                    active
                    ? 'bg-brandVinotinto/30 border border-brandVinotinto/50 text-white font-medium'
                    : 'text-gray-400 hover:bg-darkCard hover:text-gray-200'
                }"
            >

                <div class="flex items-center gap-2 truncate">

                    <i class="fa-solid fa-film text-brandVerde text-[10px]"></i>

                    <span class="truncate text-[11px]">
                        ${escapeHtml(c.title)}
                    </span>

                </div>


                <button
                    onclick="deleteChat('${c.id}', event)"
                    class="opacity-0 group-hover:opacity-100 p-1 text-gray-500 hover:text-rose-400 transition"
                    title="Eliminar chat"
                >

                    <i class="fa-solid fa-trash-can text-[10px]"></i>

                </button>

            </div>

        `;
    });
}


/* =========================================================
   SELECCIONAR CHAT
   ========================================================= */

function selectChat(id) {

    currentChatId = id;

    const chat =
        conversations.find(
            c => c.id === id
        );

    if (!chat) return;


    document
        .getElementById('welcome-screen')
        .classList.add('hidden');


    const messagesList =
        document.getElementById('messages-list');

    messagesList.classList.remove('hidden');

    messagesList.innerHTML = '';


    chat.messages.forEach(m => {

        if (m.sender === 'user') {

            messagesList.innerHTML += `

                <div class="flex gap-2.5 justify-end">

                    <div class="bg-brandVinotinto text-white py-2 px-3 rounded-xl rounded-tr-none max-w-[85%] text-xs shadow-md">

                        ${escapeHtml(m.text)}

                    </div>

                </div>

            `;

        } else {

            messagesList.innerHTML += `

                <div class="flex gap-2.5 justify-start">

                    <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-brandVinotinto to-brandVerde flex-shrink-0 flex items-center justify-center text-white font-bold text-[10px] shadow-md">

                        SK

                    </div>


                    <div class="bg-darkCard border border-darkBorder text-gray-200 p-3 rounded-xl rounded-tl-none max-w-[90%] text-xs leading-relaxed shadow-md space-y-2">

                        ${m.text}

                    </div>

                </div>

            `;
        }

    });


    renderSidebar();

    scrollToBottom();


    const sidebar =
        document.getElementById('sidebar');

    if (!sidebar.classList.contains('-translate-x-full')) {

        toggleSidebar();
    }
}


/* =========================================================
   SEGURIDAD HTML
   ========================================================= */

function escapeHtml(str) {

    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
