<script>

/* =========================================================
   SPARKYKREA STUDIO'S
   MOTOR PUBLICITARIO PRO
   ========================================================= */


/* -------------------------
   MEMORIA DE CAMPAÑAS
------------------------- */

let conversations = JSON.parse(localStorage.getItem('sparkykrea_chats')) || [];
let currentChatId = null;


/* -------------------------
   ESTADOS DEL ASISTENTE
------------------------- */

let pendingTopic = null;
let pendingDetail = null;
let pendingCategory = null;

let awaitingCharacterChoice = false;
let awaitingCharacterName = false;
let awaitingDuration = false;


/* -------------------------
   RESPUESTAS VARIADAS
------------------------- */

function randomItem(array) {
    return array[Math.floor(Math.random() * array.length)];
}


/* -------------------------
   SALUDO SEGÚN LA HORA
------------------------- */

function getTimeGreeting() {

    const hour = new Date().getHours();

    if (hour >= 5 && hour < 12) {

        return randomItem([
            '¡Buenos días! 👋 ¿En qué puedo ayudarte hoy?',
            '¡Buenos días! ☀️ ¿Qué vamos a crear hoy?',
            '¡Buenos días! 👋 Cuéntame tu idea y empezamos.'
        ]);

    }

    if (hour >= 12 && hour < 19) {

        return randomItem([
            '¡Buenas tardes! 👋 ¿En qué puedo ayudarte hoy?',
            '¡Buenas tardes! 🌤️ ¿Qué vamos a crear hoy?',
            '¡Buenas tardes! 👋 Cuéntame qué tienes en mente.'
        ]);

    }

    return randomItem([
        '¡Buenas noches! 🌙 ¿En qué puedo ayudarte hoy?',
        '¡Buenas noches! 👋 ¿Listo para crear algo increíble?',
        '¡Buenas noches! ✨ Cuéntame tu idea y empezamos.'
    ]);
}


/* -------------------------
   INICIO
------------------------- */

document.addEventListener('DOMContentLoaded', () => {

    document.getElementById('dynamic-greeting').textContent =
        getTimeGreeting();

    renderSidebar();
});


/* -------------------------
   MENÚ
------------------------- */

function toggleSidebar() {

    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');

    sidebar.classList.toggle('-translate-x-full');
    overlay.classList.toggle('hidden');
}


/* -------------------------
   NUEVO CHAT
------------------------- */

function startNewChat() {

    currentChatId = Date.now().toString();

    pendingTopic = null;
    pendingDetail = null;
    pendingCategory = null;

    awaitingCharacterChoice = false;
    awaitingCharacterName = false;
    awaitingDuration = false;

    document.getElementById('welcome-screen').classList.remove('hidden');

    document.getElementById('messages-list').classList.add('hidden');

    document.getElementById('messages-list').innerHTML = '';

    document.getElementById('user-input').value = '';

    const sidebar = document.getElementById('sidebar');

    if (!sidebar.classList.contains('-translate-x-full')) {
        toggleSidebar();
    }
}


/* -------------------------
   ELIMINAR CHAT
------------------------- */

function deleteChat(id, e) {

    e.stopPropagation();

    conversations = conversations.filter(c => c.id !== id);

    localStorage.setItem(
        'sparkykrea_chats',
        JSON.stringify(conversations)
    );

    if (currentChatId === id) {
        startNewChat();
    } else {
        renderSidebar();
    }
}


/* -------------------------
   SALUDOS SIMPLES
------------------------- */

function isSimpleGreeting(text) {

    const clean = text
        .toLowerCase()
        .trim()
        .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");

    const greetings = [
        'hola',
        'buenas',
        'buenos dias',
        'buenas tardes',
        'buenas noches',
        'que tal',
        'saludos',
        'hey',
        'holaa',
        'holaaa'
    ];

    return greetings.includes(clean);
}


/* -------------------------
   DETECTAR CATEGORÍA
------------------------- */

function detectCategory(text) {

    const clean = text.toLowerCase();

    if (
        /\b(valorant|league of legends|league|lol|tft|overwatch|free fire|fortnite|minecraft|roblox|call of duty|cod|juego|gaming|videojuego)\b/i.test(clean)
    ) {
        return 'gaming';
    }

    if (
        /\b(futbol|fútbol|futbolista|deporte|deportes|equipo|atleta|basket|baloncesto|tenis|boxeo)\b/i.test(clean)
    ) {
        return 'sports';
    }

    if (
        /\b(pizza|pizzería|pizzeria|restaurante|comida|hamburguesa|burger|café|cafe|cafetería|cafeteria|comida rápida|comida rapida|postre|helado)\b/i.test(clean)
    ) {
        return 'food';
    }

    if (
        /\b(producto|tienda|marca|servicio|app|aplicación|aplicacion|curso|negocio|empresa|emprendimiento)\b/i.test(clean)
    ) {
        return 'business';
    }

    return 'general';
}


/* -------------------------
   IDENTIFICAR JUEGO
------------------------- */

function detectGame(topic) {

    const clean = topic.toLowerCase();

    if (clean.includes('valorant')) return 'Valorant';
    if (clean.includes('league of legends') || /\blol\b/.test(clean)) return 'League of Legends';
    if (clean.includes('tft')) return 'Teamfight Tactics';
    if (clean.includes('overwatch')) return 'Overwatch';
    if (clean.includes('free fire')) return 'Free Fire';
    if (clean.includes('fortnite')) return 'Fortnite';
    if (clean.includes('minecraft')) return 'Minecraft';
    if (clean.includes('roblox')) return 'Roblox';
    if (clean.includes('call of duty') || /\bcod\b/.test(clean)) return 'Call of Duty';

    return 'videojuego';
}


/* -------------------------
   DETECTAR TIPO DE COMIDA
------------------------- */

function detectFoodType(topic) {

    const clean = topic.toLowerCase();

    if (clean.includes('pizza') || clean.includes('pizzer')) {
        return 'pizza';
    }

    if (
        clean.includes('burger') ||
        clean.includes('hamburgues')
    ) {
        return 'burger';
    }

    if (
        clean.includes('cafe') ||
        clean.includes('café') ||
        clean.includes('cafeter')
    ) {
        return 'cafe';
    }

    if (
        clean.includes('restaurante') ||
        clean.includes('comida')
    ) {
        return 'restaurant';
    }

    return 'food';
}


/* -------------------------
   DURACIÓN
------------------------- */

function parseDurationInSeconds(text) {

    const clean = text.toLowerCase();

    let minutes = 0;
    let seconds = 0;

    const minMatch = clean.match(
        /(\d+)\s*(min|minuto|minutos)\b/
    );

    const secMatch = clean.match(
        /(\d+)\s*(seg|segundo|segundos)\b/
    );

    const onlyNumberMatch = clean.match(/\b(\d+)\b/);

    if (minMatch) {
        minutes = parseInt(minMatch[1]);
    }

    if (secMatch) {
        seconds = parseInt(secMatch[1]);
    }

    if (!minMatch && !secMatch && onlyNumberMatch) {

        const num = parseInt(onlyNumberMatch[1]);

        if (num <= 5) {
            minutes = num;
        } else {
            seconds = num;
        }
    }

    const total = (minutes * 60) + seconds;

    return total > 0 ? total : 30;
}


function formatTime(sec) {

    const m = Math.floor(sec / 60);
    const s = sec % 60;

    return `${m}:${s < 10 ? '0' : ''}${s}`;
}


/* -------------------------
   SELECTOR DE DURACIÓN
------------------------- */

function durationSelector() {

    return `
        <div class="pt-1">
            <select
                onchange="selectDurationFromDropdown(this.value)"
                class="w-full bg-darkSidebar border border-darkBorder hover:border-brandVerde text-gray-200 text-xs rounded-xl p-2 focus:outline-none cursor-pointer transition">

                <option value="">
                    ⏱️ Seleccione la duración estimada...
                </option>

                <option value="15 segundos">
                    15 Segundos (Formato breve)
                </option>

                <option value="30 segundos">
                    30 Segundos (Spot estándar)
                </option>

                <option value="60 segundos">
                    1 Minuto (Presentación)
                </option>

                <option value="3 minutos">
                    3 Minutos (Formato detallado)
                </option>

                <option value="custom">
                    ✍️ Especificar duración...
                </option>

            </select>
        </div>
    `;
}


function selectDurationFromDropdown(val) {

    if (!val) return;

    if (val === 'custom') {

        const customVal = prompt(
            'Indica la duración. Ejemplo: 45 segundos o 2 minutos'
        );

        if (customVal) {

            document.getElementById('user-input').value = customVal;

            handleSend();
        }

    } else {

        document.getElementById('user-input').value = val;

        handleSend();
    }
}

function createFoodSteps(total, topic, type, product) {

    const a = Math.max(2, Math.floor(total * 0.25));
    const b = Math.max(a + 1, Math.floor(total * 0.65));

    return [
        {
            time: `0:00 - ${formatTime(a)}`,
            visual: `Plano atractivo de ${product} relacionado directamente con ${topic}. El producto aparece inmediatamente para despertar el apetito.`,
            audio: `Sonido ambiente suave + locución: "Si buscas ${product}, este lugar tiene algo que mostrarte."`
        },
        {
            time: `${formatTime(a)} - ${formatTime(b)}`,
            visual: `Mostrar preparación, ingredientes, textura, presentación y detalles propios de ${topic}. Utilizar planos cercanos y cortes dinámicos.`,

/* =========================================================
   GUIONES GAMING
========================================================= */

function createGamingSteps(total, topic, character, game, focus) {

    let first = Math.max(2, Math.floor(total * 0.20));
    let second = Math.max(first + 1, Math.floor(total * 0.70));

    if (total <= 12) {
        first = Math.max(2, Math.floor(total * 0.30));
        second = Math.max(first + 1, Math.floor(total * 0.75));
    }

    return [
        {
            time: `0:00 - ${formatTime(first)}`,
            visual: `Comenzar con ${character} en ${game}. Mostrar inmediatamente una jugada, habilidad o momento visualmente fuerte relacionado con ${topic}.`,
            audio: `Música electrónica energética + efecto de impacto. Locución: "Esto es ${game}, y aquí cada decisión cuenta."`
        },
        {
            time: `${formatTime(first)} - ${formatTime(second)}`,
            visual: `Mostrar gameplay centrado en ${character}. Explicar mediante texto o voz aspectos de ${focus}, evitando escenas que no tengan relación con el tema.`,
            audio: `Ritmo electrónico sincronizado con los cortes + sonidos originales del juego cuando aporten impacto.`
        },
        {
            time: `${formatTime(second)} - ${formatTime(total)}`,
            visual: `Cerrar con la mejor jugada o resultado. Añadir nombre del creador, canal, comunidad o llamada a la acción.`,
            audio: `La música sube ligeramente y termina con una pausa limpia + CTA: "¿Te atreves a llevarlo al siguiente nivel?"`
        }
    ];
}

========================================================= */

function processPublicityRequest(input) {

    const clean = input.toLowerCase().trim();

    /* -------------------------
       SALUDO
    ------------------------- */

    if (
        isSimpleGreeting(clean) &&
        !pendingTopic &&
        !awaitingCharacterChoice &&
        !awaitingCharacterName &&
        !awaitingDuration
    ) {

        return `
            <p>
                ${getTimeGreeting()}
            </p>

            <p class="text-gray-300">
                Cuéntame qué quieres promocionar y vamos dándole forma.
                Puede ser un juego, restaurante, producto, servicio o cualquier idea que tengas. 🚀
            </p>
        `;
    }


    /* -------------------------
       PREGUNTA: ¿PERSONAJE?
    ------------------------- */

    if (awaitingCharacterChoice) {

        const answer = clean;

        const yes =
            /^(si|sí|s|yes|claro|obvio|quiero|exacto|correcto)/i.test(answer);

        const no =
            /^(no|n|nop|ninguno|general|todos|no importa)/i.test(answer);

        if (yes) {

            awaitingCharacterChoice = false;
            awaitingCharacterName = true;

            return `
                <div class="space-y-2">

                    <p>
                        Perfecto 🎮. Entonces vamos a hacerlo más preciso.
                    </p>

                    <p class="text-gray-300">
                        <strong class="text-brandVerde">
                            ¿Qué personaje, agente, campeón, héroe o protagonista quieres utilizar?
                        </strong>
                    </p>

                    <p class="text-gray-400">
                        Por ejemplo: un agente de Valorant, un campeón de LoL, un héroe de Overwatch, etc.
                    </p>

                </div>
            `;
        }

        if (no) {

            awaitingCharacterChoice = false;
            awaitingDuration = true;

            return `
                <div class="space-y-2">

                    <p>
                        Perfecto 👍. Entonces haremos el anuncio centrado en
                        <strong class="text-brandVerde">
                            ${escapeHtml(pendingTopic)}
                        </strong>
                        como experiencia general.
                    </p>

                    <p class="text-gray-300">
                        Ahora solo necesito saber cuánto debería durar el video.
                    </p>

                    ${durationSelector()}

                </div>
            `;
        }

        return `
            <div class="space-y-2">

                <p>
                    🎮 Solo necesito una respuesta rápida:
                </p>

                <p class="text-gray-300">
                    ¿Quieres que el anuncio sea sobre un
                    <strong class="text-brandVerde">personaje específico</strong>?
                </p>

                <p class="text-gray-400">
                    Puedes responder simplemente <strong>sí</strong> o <strong>no</strong>.
                </p>

            </div>
        `;
    }


    /* -------------------------
       NOMBRE DEL PERSONAJE
    ------------------------- */

    if (awaitingCharacterName) {

        pendingDetail = input;
        awaitingCharacterName = false;
        awaitingDuration = true;

        return `
            <div class="space-y-2">

                <p>
                    🔥 Perfecto. El foco será:
                    <strong class="text-brandVerde">
                        "${escapeHtml(input)}"
                    </strong>
                </p>

                <p class="text-gray-300">
                    Ahora dime cuánto quieres que dure el anuncio.
                </p>

                ${durationSelector()}

            </div>
        `;
    }


    /* -------------------------
       DURACIÓN
    ------------------------- */

    const hasTimeKeywords =
        /(\d+|segundo|segundos|minuto|minutos|min|seg)\b/i.test(clean);


    if (awaitingDuration) {

        if (!hasTimeKeywords) {

            return `
                <div class="space-y-2">

                    <p>
                        ⏱️ Ya casi estamos.
                    </p>

                    <p class="text-gray-300">
                        Necesito la duración del video.
                        Puedes escribir, por ejemplo:
                        <strong class="text-brandVerde">
                            15 segundos
                        </strong>,
                        <strong class="text-brandVerde">
                            30 segundos
                        </strong>
                        o
                        <strong class="text-brandVerde">
                            1 minuto
                        </strong>.
                    </p>

                    ${durationSelector()}

                </div>
            `;
        }

        const totalSec = parseDurationInSeconds(clean);

        return generateFinalResponse(totalSec);
    }


    /* -------------------------
       TEMA + DURACIÓN DIRECTA
    ------------------------- */

    if (pendingTopic && hasTimeKeywords) {

        const totalSec = parseDurationInSeconds(clean);

        return generateFinalResponse(totalSec);
    }


    /* -------------------------
       NUEVA SOLICITUD
    ------------------------- */

    pendingTopic = input;
    pendingDetail = null;
    pendingCategory = detectCategory(input);

    /* -------------------------
       GAMING
    ------------------------- */

    if (pendingCategory === 'gaming') {

        awaitingCharacterChoice = true;

        return `
            <div class="space-y-2">

                <p>
                    🎮 ¡Perfecto! Vamos a trabajar con
                    <strong class="text-brandVerde">
                        "${escapeHtml(input)}"
                    </strong>.
                </p>

                <p class="text-gray-300">
                    Antes de crear el guion quiero hacerlo realmente específico:
                </p>

                <p class="text-white font-semibold">
                    ¿Quieres que el anuncio sea sobre un personaje específico?
                </p>

                <p class="text-gray-400">
                    Responde <strong>sí</strong> si quieres centrarlo en un personaje,
                    o <strong>no</strong> si prefieres que sea sobre el juego en general.
                </p>

            </div>
        `;
    }


    /* -------------------------
       DEPORTES
    ------------------------- */

    if (pendingCategory === 'sports') {

        awaitingCharacterName = true;

        return `
            <div class="space-y-2">

                <p>
                    ⚽ Perfecto. Vamos a convertir
                    <strong class="text-brandVerde">
                        "${escapeHtml(input)}"
                    </strong>
                    en una pieza deportiva.
                </p>

                <p class="text-gray-300">
                    ¿Quién será el protagonista?
                    Puede ser un futbolista, atleta, equipo o incluso puedes decir
                    <strong>"general"</strong>.
                </p>

            </div>
        `;
    }


    /* -------------------------
       COMIDA
    ------------------------- */

    if (pendingCategory === 'food') {

        awaitingDuration = true;

        return `
            <div class="space-y-2">

                <p>
                    🍽️ ¡Buen tema!
                </p>

                <p class="text-gray-300">
                    Voy a hacer que el guion esté centrado específicamente en
                    <strong class="text-brandVerde">
                        "${escapeHtml(input)}"
                    </strong>:
                    producto, preparación, ambiente y cierre.
                </p>

                <p class="text-gray-400">
                    Ahora dime cuánto debe durar el video.
                </p>

                ${durationSelector()}

            </div>
        `;
    }


    /* -------------------------
       NEGOCIOS / GENERAL
    ------------------------- */

    awaitingDuration = true;

    return `
        <div class="space-y-2">

            <p>
                💡 Me gusta el punto de partida:
                <strong class="text-brandVerde">
                    "${escapeHtml(input)}"
                </strong>.
            </p>

            <p class="text-gray-300">
                Voy a estructurar el anuncio alrededor de lo que realmente
                ofrece este producto, servicio o idea.
            </p>

            <p class="text-gray-400">
                Solo falta la duración del video.
            </p>

            ${durationSelector()}

        </div>
    `;
}

   GENERAR RESPUESTA FINAL
========================================================= */

function generateFinalResponse(totalSec) {

    const generated = generateSpecificScript(
        pendingTopic,
        pendingDetail,
        totalSec
    );

    const mainTopic = pendingTopic;
    const detailTopic = pendingDetail;

    const category = pendingCategory || detectCategory(mainTopic);

    pendingTopic = null;

/* =========================================================
   ENVIAR MENSAJE
========================================================= */

function handleSend(e) {

    if (e) e.preventDefault();

    const input = document.getElementById('user-input');

    const query = input.value.trim();

    if (!query) return;


    if (!currentChatId) {
        currentChatId = Date.now().toString();
    }


    document.getElementById('welcome-screen').classList.add('hidden');

    const messagesList =
        document.getElementById('messages-list');

    messagesList.classList.remove('hidden');


    /* MENSAJE DEL USUARIO */

    messagesList.innerHTML += `
        <div class="flex gap-2.5 justify-end">

            <div class="bg-brandVinotinto text-white py-2 px-3 rounded-xl rounded-tr-none max-w-[85%] text-xs shadow-md">

                ${escapeHtml(query)}

            </div>

        </div>
    `;


    input.value = '';

    scrollToBottom();


    /* LOADING */

    const loadingId = 'loading-' + Date.now();

    messagesList.innerHTML += `
        <div id="${loadingId}"
             class="flex gap-2.5 justify-start items-center text-gray-400 text-xs py-1">

            <div class="w-6 h-6 rounded-lg bg-darkCard border border-darkBorder flex items-center justify-center text-brandVerde">

                <i class="fa-solid fa-spinner fa-spin text-[10px]"></i>

            </div>

            <span class="text-[11px]">
                Pensando una idea diferente...
            </span>

        </div>
    `;


    scrollToBottom();


    setTimeout(() => {

        document.getElementById(loadingId)?.remove();

        const botResponse =
            processPublicityRequest(query);


        messagesList.innerHTML += `
            <div class="flex gap-2.5 justify-start">

                <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-brandVinotinto to-brandVerde flex-shrink-0 flex items-center justify-center text-white font-bold text-[10px] shadow-md">
                    SK
                </div>

                <div class="bg-darkCard border border-darkBorder text-gray-200 p-3 rounded-xl rounded-tl-none max-w-[90%] text-xs leading-relaxed shadow-md space-y-2">

                    ${botResponse}

                </div>

            </div>
        `;


        saveMessageToHistory(
            query,
            botResponse
        );


        scrollToBottom();

    }, 450);
}


/* =========================================================
   SCROLL
========================================================= */

function scrollToBottom() {

    const container =
        document.getElementById('chat-container');

    container.scrollTop =
        container.scrollHeight;
}


/* =========================================================
   GUARDAR HISTORIAL
========================================================= */

function saveMessageToHistory(userText, botText) {

    let chat =
        conversations.find(c => c.id === currentChatId);


    if (!chat) {

        chat = {

            id: currentChatId,

            title:
                userText.substring(0, 20) +
                (userText.length > 20 ? '...' : ''),

            messages: []

        };

        conversations.unshift(chat);
    }


    chat.messages.push({
        sender: 'user',
        text: userText
    });


    chat.messages.push({
        sender: 'bot',
        text: botText
    });


    localStorage.setItem(
        'sparkykrea_chats',
        JSON.stringify(conversations)
    );


    renderSidebar();
}


/* =========================================================
   SIDEBAR / HISTORIAL
========================================================= */

function renderSidebar() {

    const historyContainer =
        document.getElementById('chat-history');


    if (conversations.length === 0) {

        historyContainer.innerHTML = `
            <div class="text-[11px] text-gray-500 italic px-2 py-1">
                Sin campañas guardadas
            </div>
        `;

        return;
    }


    historyContainer.innerHTML = '';


    conversations.forEach(c => {

        const active =
            c.id === currentChatId;


        historyContainer.innerHTML += `
            <div onclick="selectChat('${c.id}')"
                 class="group flex items-center justify-between px-2.5 py-1.5 rounded-lg cursor-pointer text-xs transition
                 ${active
                    ? 'bg-brandVinotinto/30 border border-brandVinotinto/50 text-white font-medium'
                    : 'text-gray-400 hover:bg-darkCard hover:text-gray-200'}">

                <div class="flex items-center gap-2 truncate">

                    <i class="fa-solid fa-film text-brandVerde text-[10px]"></i>

                    <span class="truncate text-[11px]">
                        ${escapeHtml(c.title)}
                    </span>

                </div>


                <button
                    onclick="deleteChat('${c.id}', event)"
                    class="opacity-0 group-hover:opacity-100 p-1 text-gray-500 hover:text-rose-400 transition"
                    title="Eliminar chat">

                    <i class="fa-solid fa-trash-can text-[10px]"></i>

                </button>

            </div>
        `;
    });
}


/* =========================================================
   ABRIR CHAT
========================================================= */

function selectChat(id) {

    currentChatId = id;

    const chat =
        conversations.find(c => c.id === id);


    if (!chat) return;


    document.getElementById('welcome-screen')
        .classList.add('hidden');


    const messagesList =
        document.getElementById('messages-list');


    messagesList.classList.remove('hidden');

    messagesList.innerHTML = '';


    chat.messages.forEach(m => {

        if (m.sender === 'user') {

            messagesList.innerHTML += `
                <div class="flex gap-2.5 justify-end">

                    <div class="bg-brandVinotinto text-white py-2 px-3 rounded-xl rounded-tr-none max-w-[85%] text-xs shadow-md">

                        ${escapeHtml(m.text)}

                    </div>

                </div>
            `;

        } else {

            messagesList.innerHTML += `
                <div class="flex gap-2.5 justify-start">

                    <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-brandVinotinto to-brandVerde flex-shrink-0 flex items-center justify-center text-white font-bold text-[10px] shadow-md">
                        SK
                    </div>

                    <div class="bg-darkCard border border-darkBorder text-gray-200 p-3 rounded-xl rounded-tl-none max-w-[90%] text-xs leading-relaxed shadow-md space-y-2">

                        ${m.text}

                    </div>

                </div>
            `;
        }
    });


    renderSidebar();

    scrollToBottom();


    const sidebar =
        document.getElementById('sidebar');


    if (!sidebar.classList.contains('-translate-x-full')) {
        toggleSidebar();
    }
}


/* =========================================================
   SEGURIDAD HTML
========================================================= */

function escapeHtml(str) {

    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
