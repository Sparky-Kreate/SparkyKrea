
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SparkyKrea ⚡</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #090b10;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      border-bottom: 1px solid #1a1f2c;
      background: rgba(9, 11, 16, 0.9);
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #ffffff;
    }

    .logo span {
      color: #00b5ff;
    }

    main {
      flex: 1;
      max-width: 900px;
      width: 90%;
      margin: 40px auto;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .hero {
      text-align: center;
    }

    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #8ab5ff, #00c7ff, #df7dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: #a0aec0;
      font-size: 1.1rem;
    }

    .input-box {
      background: #121620;
      border: 1px solid #232a3b;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    textarea {
      width: 100%;
      height: 100px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1rem;
      resize: none;
      outline: none;
    }

    .btn-sparky {
      background: linear-gradient(90deg, #7928ca, #0070f3);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .btn-sparky:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .output-area {
      display: none;
      background: #121620;
      border: 1px solid #232a3b;
      border-radius: 16px;
      padding: 25px;
      flex-direction: column;
      gap: 20px;
    }

    .part-card {
      background: #1a202c;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #00c7ff;
    }

    .part-title {
      font-weight: bold;
      font-size: 1.1rem;
      color: #00c7ff;
      margin-bottom: 8px;
    }

    .motivation-card {
      background: rgba(121, 40, 202, 0.15);
      border: 1px solid #7928ca;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      font-style: italic;
      color: #d8b4fe;
    }

    .history-section {
      margin-top: 20px;
      border-top: 1px solid #1a1f2c;
      padding-top: 20px;
    }

    .history-title {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: #e2e8f0;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-item {
      background: #161b26;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid #232a3b;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">⚡ Sparky<span>Krea</span></div>
  </header>

  <main>
    <div class="hero">
      <h1>Convierte una idea en algo increíble</h1>
      <p>Escribe lo que tienes en mente y Sparky armará la estructura perfecta.</p>
    </div>

    <div class="input-box">
      <textarea id="userInput" placeholder="¿Qué quieres crear hoy? (Ej: Un video corto sobre curiosidades del espacio)..."></textarea>
      <button class="btn-sparky" onclick="generarIdea()">⚡ Generar con Sparky</button>
    </div>

    <div class="output-area" id="outputArea">
      <div class="part-card">
        <div class="part-title">1. Guión Sugerido</div>
        <div id="resGuion"></div>
      </div>
      <div class="part-card">
        <div class="part-title">2. Música y Sonido</div>
        <div id="resMusica"></div>
      </div>
      <div class="part-card">
        <div class="part-title">3. Estilo de Edición</div>
        <div id="resEdicion"></div>
      </div>
      <div class="motivation-card" id="resMotivacion"></div>
    </div>

    <div class="history-section">
      <div class="history-title">📂 Conversaciones Guardadas</div>
      <div class="history-list" id="historyList">
        <p style="color: #718096;">Aún no has guardado ninguna idea.</p>
      </div>
    </div>
  </main>

  <script>
    const guiones = [
      "¡Atención creador! Comienza con un gancho visual potente: muestra una duda que llame la atención de inmediato. Luego explica el concepto principal en 3 puntos breves y cierra invitando al espectador a dar su opinión.",
      "Inicia el video con una pregunta directa: '¿Sabías que esto cambia todo?'. Muestra un desarrollo dinámico de 15 segundos sin pausas y termina con un llamado a la acción entusiasta.",
      "Empieza mostrando directamente el resultado final para crear curiosidad. Luego retrocede paso a paso explicando la idea rápidamente y cierra con una sorpresa visual."
    ];

    const musicas = [
      "Fondo de Lo-Fi o Synthwave suave para mantener la concentración sin opacar tu voz.",
      "Música de ritmo rápido (Phonk o Trap instrumental) con cortes sincronizados para dar energía.",
      "Melodía misteriosa e intrigante al inicio, bajando de volumen en las explicaciones."
    ];

    const ediciones = [
      "Cortes dinámicos cada 2 o 3 segundos, subtítulos grandes y coloridos en el centro, y efectos de sonido (whoosh) en las transiciones.",
      "Estilo minimalista, texto elegante en la esquina inferior y acercamientos suaves a la imagen principal.",
      "Ritmo acelerado, stickers animados marcando los puntos importantes y destellos de luz en el cambio de tema."
    ];

    const motivaciones = [
      "«La creatividad no se agota; cuanto más la usas, más tienes. ¡Haz que suceda hoy!»",
      "«Cada gran creador empezó con una sola idea. Da el primer paso sin miedo a la perfección.»",
      "«Tu estilo es tu superpoder. Dale tu toque único a este proyecto y sorprende a todos.»",
      "«El mejor momento para crear es ahora mismo. ¡Manos a la obra!»"
    ];

    let historial = JSON.parse(localStorage.getItem('sparky_history')) || [];

    function actualizarHistorialUI() {
      const historyList = document.getElementById('historyList');
      if (historial.length === 0) {
        historyList.innerHTML = '<p style="color: #718096;">Aún no has guardado ninguna idea.</p>';
        return;
      }
      historyList.innerHTML = historial.map((item, index) => `
        <div class="history-item" onclick="cargarIdea(${index})">
          <span>💡 ${item.prompt.substring(0, 35)}...</span>
          <small style="color: #00c7ff;">Ver de nuevo</small>
        </div>
      `).join('');
    }

    function generarIdea() {
      const input = document.getElementById('userInput').value.trim();
      if (!input) return alert('Por favor escribe una idea primero.');

      const g = guiones[Math.floor(Math.random() * guiones.length)];
      const m = musicas[Math.floor(Math.random() * musicas.length)];
      const e = ediciones[Math.floor(Math.random() * ediciones.length)];
      const mot = motivaciones[Math.floor(Math.random() * motivaciones.length)];

      document.getElementById('resGuion').innerText = g;
      document.getElementById('resMusica').innerText = m;
      document.getElementById('resEdicion').innerText = e;
      document.getElementById('resMotivacion').innerText = mot;

      document.getElementById('outputArea').style.display = 'flex';

      historial.unshift({ prompt: input, guion: g, musica: m, edicion: e, motivacion: mot });
      if (historial.length > 5) historial.pop();
      localStorage.setItem('sparky_history', JSON.stringify(historial));
      actualizarHistorialUI();
    }

    function cargarIdea(index) {
      const item = historial[index];
      document.getElementById('resGuion').innerText = item.guion;
      document.getElementById('resMusica').innerText = item.musica;
      document.getElementById('resEdicion').innerText = item.edicion;
      document.getElementById('resMotivacion').innerText = item.motivacion;
      document.getElementById('outputArea').style.display = 'flex';
    }

    actualizarHistorialUI();
  </script>
</body>
</html>
