<style>

/* =========================================================
   SPARKYKREA
   Diseño general
========================================================= */

:root{
    --vino:#800020;
    --vino-light:#a20a35;
    --green:#10B981;

    --bg:#08090b;
    --bg2:#0c0e11;
    --panel:#0f1115;
    --panel2:#121419;
    --border:rgba(255,255,255,.07);

    --text:#ffffff;
    --muted:#8d929b;

    --sidebar:270px;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:"Inter",Arial,sans-serif;
}

body{
    min-height:100dvh;
    overflow:hidden;
}

/* =========================================================
   SPLASH
========================================================= */

#splash{
    position:fixed;
    inset:0;
    z-index:99999;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#070809;

    animation:splashAuto 1.35s ease forwards;
    pointer-events:none;
}

@keyframes splashAuto{
    0%,72%{
        opacity:1;
        visibility:visible;
    }

    100%{
        opacity:0;
        visibility:hidden;
    }
}

.splash-content{
    text-align:center;
    transform:translateY(-4px);
    animation:splashLogo .9s ease;
}

@keyframes splashLogo{
    from{
        opacity:0;
        transform:translateY(8px) scale(.97);
    }

    to{
        opacity:1;
        transform:translateY(-4px) scale(1);
    }
}

.splash-logo{
    width:min(330px,75vw);
    height:auto;
}

.splash-subtitle{
    margin-top:12px;
    font-size:10px;
    letter-spacing:4px;
    color:#777c84;
    text-transform:uppercase;
}

/* =========================================================
   LOGO
========================================================= */

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    user-select:none;
}

.brand-icon{
    width:43px;
    height:43px;
    flex:none;
}

.brand-name{
    display:flex;
    flex-direction:column;
    line-height:1;
}

.brand-main{
    font-size:19px;
    font-weight:800;
    letter-spacing:-.8px;
}

.brand-main .sparky{
    color:#8c1735;
}

.brand-main .krea{
    color:#1bc48d;
}

.brand-studios{
    margin-top:5px;
    font-size:7px;
    letter-spacing:3px;
    color:#e6e6e6;
    font-weight:600;
}

/* =========================================================
   APP
========================================================= */

#app{
    width:100%;
    height:100dvh;
    display:flex;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
    width:var(--sidebar);
    height:100dvh;

    flex:none;

    background:#0a0b0e;
    border-right:1px solid var(--border);

    display:flex;
    flex-direction:column;

    transition:.25s ease;
}

.sidebar-top{
    padding:22px 18px 18px;
}

.sidebar-logo{
    padding:3px 5px 22px;
}

.new-project{
    width:100%;
    border:1px solid rgba(128,0,32,.35);
    background:rgba(128,0,32,.10);
    color:#fff;

    padding:11px 13px;
    border-radius:10px;

    display:flex;
    align-items:center;
    gap:10px;

    font-size:13px;
    font-weight:600;

    cursor:pointer;
    transition:.2s;
}

.new-project:hover{
    background:rgba(128,0,32,.18);
    border-color:rgba(128,0,32,.55);
}

.new-project i{
    color:#a92a4c;
}

.history-title{
    padding:20px 7px 10px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    font-size:11px;
    color:#777c84;
    text-transform:uppercase;
    letter-spacing:1.5px;
    font-weight:700;
}

.history-list{
    flex:1;
    overflow-y:auto;
    padding:0 5px 15px;
}

.history-item{
    width:100%;
    padding:10px 9px;
    margin-bottom:4px;

    border:0;
    border-radius:8px;

    background:transparent;
    color:#a8adb5;

    text-align:left;
    cursor:pointer;

    font-size:12px;

    display:flex;
    align-items:center;
    gap:9px;

    transition:.15s;
}

.history-item:hover{
    background:rgba(255,255,255,.035);
    color:#fff;
}

.history-item i{
    font-size:11px;
    color:#5e636b;
}

.history-empty{
    padding:20px 10px;
    color:#555a62;
    font-size:12px;
    line-height:1.5;
}

/* =========================================================
   MAIN
========================================================= */

.main{
    flex:1;
    min-width:0;
    height:100dvh;

    display:flex;
    flex-direction:column;

    background:
        radial-gradient(
            circle at 50% -20%,
            rgba(128,0,32,.07),
            transparent 35%
        ),
        var(--bg);
}

/* =========================================================
   HEADER
========================================================= */

.header{
    height:70px;
    flex:none;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 24px;

    border-bottom:1px solid rgba(255,255,255,.045);
}

.header-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.mobile-menu{
    display:none;

    width:37px;
    height:37px;

    border:1px solid var(--border);
    border-radius:9px;

    background:#101216;
    color:#aaa;

    cursor:pointer;
}

.header-title{
    font-size:13px;
    font-weight:600;
    color:#d7d9dc;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.header-logo{
    display:flex;
    align-items:center;
    gap:8px;

    margin-right:5px;
}

.header-logo .brand-icon{
    width:32px;
    height:32px;
}

.header-logo .brand-main{
    font-size:14px;
}

.header-logo .brand-studios{
    font-size:5px;
    letter-spacing:2px;
    margin-top:3px;
}

.header-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#444950;
}

/* =========================================================
   WORKSPACE
========================================================= */

.workspace{
    flex:1;
    min-height:0;

    display:flex;
    flex-direction:column;
}

/* =========================================================
   WELCOME
========================================================= */

.welcome{
    width:min(900px,calc(100% - 40px));
    margin:0 auto;

    padding:65px 0 20px;

    text-align:center;

    transition:.3s;
}

.welcome.hidden{
    display:none;
}

.welcome-logo{
    display:flex;
    justify-content:center;
    margin-bottom:20px;
}

.welcome-logo .brand-icon{
    width:67px;
    height:67px;
}

.welcome h1{
    margin:0;

    font-size:clamp(27px,4vw,39px);
    letter-spacing:-1.8px;

    font-weight:800;
}

.welcome h1 span{
    color:#a8abb0;
}

.welcome p{
    margin:13px auto 0;

    max-width:550px;

    color:#727780;

    font-size:13px;
    line-height:1.7;
}

/* =========================================================
   MESSAGES
========================================================= */

.messages{
    flex:1;
    min-height:0;

    overflow-y:auto;
    scroll-behavior:smooth;

    padding:25px 20px 15px;
}

.messages-inner{
    width:min(900px,100%);
    margin:0 auto;
}

.message{
    display:flex;
    margin-bottom:22px;
}

.message.bot{
    justify-content:flex-start;
}

.message.user{
    justify-content:flex-end;
}

.message-bubble{
    max-width:820px;

    border-radius:13px;

    padding:14px 16px;

    font-size:13px;
    line-height:1.7;
}

/* BOT: MUCHO MÁS DISCRETO */

.bot .message-bubble{
    width:100%;

    background:#101216;

    border:1px solid rgba(255,255,255,.045);

    color:#fff;

    box-shadow:none;
}

/* USER */

.user .message-bubble{
    max-width:650px;

    background:#15171c;

    border:1px solid rgba(255,255,255,.055);

    color:#f4f4f4;
}

.message-label{
    display:flex;
    align-items:center;
    gap:8px;

    margin-bottom:9px;

    font-size:10px;
    font-weight:700;
    letter-spacing:1px;

    color:#747982;
    text-transform:uppercase;
}

.message-label .bot-mini{
    width:20px;
    height:20px;
}

.bot-content{
    color:#fff;
}

.bot-content p{
    margin:0 0 12px;
}

.bot-content p:last-child{
    margin-bottom:0;
}

.section{
    margin:13px 0;
    padding-left:12px;

    border-left:2px solid rgba(255,255,255,.08);
}

.section-title{
    margin-bottom:4px;

    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;

    color:#8e939b;
    font-weight:700;
}

.section-text{
    color:#fff;
}

.idea-card{
    margin:11px 0;
    padding:12px 13px;

    background:rgba(255,255,255,.018);

    border:1px solid rgba(255,255,255,.045);

    border-radius:9px;
}

.idea-number{
    color:#858a92;
    font-size:10px;
    font-weight:700;
    margin-bottom:4px;
}

.idea-title{
    color:#fff;
    font-size:13px;
    font-weight:700;
    margin-bottom:4px;
}

.idea-description{
    color:#b5b8bd;
    font-size:12px;
    line-height:1.6;
}

.motivation{
    margin-top:17px;
    padding-top:12px;

    border-top:1px solid rgba(255,255,255,.045);

    color:#aeb2b7;

    font-size:11px;
    font-style:italic;
}

/* =========================================================
   TYPING
========================================================= */

.typing{
    display:flex;
    gap:5px;
    padding:7px 3px;
}

.typing span{
    width:5px;
    height:5px;
    border-radius:50%;
    background:#666b73;

    animation:typing 1s infinite ease-in-out;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{
    0%,60%,100%{
        transform:translateY(0);
        opacity:.35;
    }

    30%{
        transform:translateY(-3px);
        opacity:1;
    }
}

/* =========================================================
   COMPOSER
========================================================= */

.composer-area{
    flex:none;

    padding:10px 20px 0;

    background:linear-gradient(
        to bottom,
        rgba(8,9,11,0),
        rgba(8,9,11,.94) 22%
    );
}

.composer{
    width:min(900px,100%);
    margin:0 auto;

    display:flex;
    align-items:flex-end;
    gap:9px;

    padding:9px;

    background:#111318;

    border:1px solid rgba(255,255,255,.07);

    border-radius:14px;

    box-shadow:0 10px 35px rgba(0,0,0,.25);
}

.composer textarea{
    flex:1;

    min-height:40px;
    max-height:140px;

    resize:none;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-family:inherit;
    font-size:13px;
    line-height:1.5;

    padding:10px 8px;
}

.composer textarea::placeholder{
    color:#5f646c;
}

.send{
    width:40px;
    height:40px;

    flex:none;

    border:0;
    border-radius:10px;

    background:#e9e9e9;
    color:#090a0c;

    cursor:pointer;

    transition:.2s;
}

.send:hover{
    background:#fff;
    transform:translateY(-1px);
}

.send:disabled{
    opacity:.35;
    cursor:default;
    transform:none;
}

/* =========================================================
   FOOTER
========================================================= */

.footer{
    width:100%;

    padding:9px 20px 13px;

    text-align:center;

    color:#4d5259;

    font-size:9px;
    letter-spacing:1.5px;

    text-transform:lowercase;

    flex:none;
}

.footer strong{
    color:#737880;
    font-weight:600;
}

/* =========================================================
   OVERLAY
========================================================= */

.overlay{
    display:none;

    position:fixed;
    inset:0;
    z-index:50;

    background:rgba(0,0,0,.65);
    backdrop-filter:blur(2px);
}

.overlay.show{
    display:block;
}

/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar{
    width:5px;
}

::-webkit-scrollbar-track{
    background:transparent;
}

::-webkit-scrollbar-thumb{
    background:#24272c;
    border-radius:10px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:760px){

    body{
        overflow:hidden;
    }

    .sidebar{
        position:fixed;
        z-index:100;

        left:0;
        top:0;

        transform:translateX(-105%);

        box-shadow:20px 0 50px rgba(0,0,0,.45);
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .mobile-menu{
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .header{
        height:62px;
        padding:0 13px;
    }

    .header-title{
        font-size:12px;
    }

    .header-logo .brand-name{
        display:none;
    }

    .header-logo .brand-icon{
        width:31px;
        height:31px;
    }

    .welcome{
        width:calc(100% - 28px);
        padding:45px 0 15px;
    }

    .welcome-logo .brand-icon{
        width:57px;
        height:57px;
    }

    .welcome h1{
        font-size:27px;
    }

    .welcome p{
        font-size:12px;
    }

    .messages{
        padding:15px 11px 10px;
    }

    .message-bubble{
        font-size:12px;
    }

    .bot .message-bubble{
        padding:13px;
    }

    .user .message-bubble{
        max-width:88%;
    }

    .composer-area{
        padding:7px 10px 0;
    }

    .composer{
        border-radius:12px;
    }

    .footer{
        padding:8px 10px 10px;
    }
}

/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:380px){

    .header-right .header-dot{
        display:none;
    }

    .welcome{
        padding-top:30px;
    }

    .welcome h1{
        font-size:24px;
    }

    .welcome p{
        font-size:11px;
    }

    .composer textarea{
        font-size:12px;
    }
}

</style>

function normalize(text){

    return text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .trim();

}

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

/* ---------------------------------------------------------

--------------------------------------------------------- */

function detectGame(text){

    const t = normalize(text);

    for(const gameName in games){

        const game = games[gameName];

        if(game.names.some(name => t.includes(name))){
            return gameName;
        }

    }

    return null;

}


/* ---------------------------------------------------------
   BUSCAR PERSONAJE
--------------------------------------------------------- */

function detectCharacter(text,gameName){

    if(!gameName || !games[gameName]) return null;

    const t = normalize(text);

    const characters = games[gameName].characters;

    for(const character of characters){

        if(t.includes(normalize(character))){
            return character;
        }

    }

    return null;

}


/* ---------------------------------------------------------
   DETECTAR SI NO QUIERE PERSONAJE
--------------------------------------------------------- */

function explicitlyNoCharacter(text){

    const t = normalize(text);

    const phrases = [

        "sin personaje",
        "sin agente",
        "no importa el personaje",
        "no importa el agente",
        "cualquiera",
        "el que sea",
        "sorprendeme",
        "sorprendeme tu",
        "tu elige",
        "elige tu",
        "uno cualquiera"

    ];

    return phrases.some(x => t.includes(x));

}

        asksScript:

        asksHook:
            /hook|gancho|inicio|primeros segundos|como empiezo/.test(t),

        asksMeme:
            /meme|humor|gracioso|chiste|shitpost/.test(t),

        asksBusiness:
            /negocio|emprendimiento|vender|ventas|cliente|marca|empresa/.test(t),

        asksProduct:
            /producto|tienda|catalogo|servicio|publicidad|anuncio/.test(t),

        asksStory:
            /historia|storytime|contar una historia|story telling|storytelling/.test(t),

        asksEducational:
            /explicar|educativo|enseñar|aprende|tutorial|explicacion/.test(t),

        asksTikTok:
            /tiktok|tik tok/.test(t),

        asksYouTube:
            /youtube|video largo/.test(t),

        asksInstagram:

        asksEditing:
            /editar|edicion|capcut|transicion|montaje|edit/.test(t),

        asksMotivation:
            /motivacion|motiva|motivame|estoy desanimado/.test(t)

    };

}

function analyze(text){

    const intent = detectIntent(text);

    return {

        game,
        character,
        noCharacter:explicitlyNoCharacter(text),
        intent

}

/* ---------------------------------------------------------
   SELECCIONAR ELEMENTOS SIN REPETIR
--------------------------------------------------------- */

let usedIdeas = JSON.parse(
    localStorage.getItem("sparky_used_ideas") || "[]"
);

function chooseDifferent(array){

    if(!array.length) return null;

    let available = array.filter(
        item => !usedIdeas.includes(item.title)
    );

    if(!available.length){

        usedIdeas = [];

        localStorage.setItem(
            "sparky_used_ideas",
            JSON.stringify(usedIdeas)
        );

        available = array;
    }

    const item =
        available[Math.floor(Math.random()*available.length)];

    if(item.title){

        usedIdeas.push(item.title);

        if(usedIdeas.length > 50){
            usedIdeas.shift();
        }

        localStorage.setItem(
            "sparky_used_ideas",
            JSON.stringify(usedIdeas)
        );

    }

    return item;

}

function buildGamingIdeas(context){

    let pool = [...gamingIdeas];

    if(context.game === "valorant"){

        pool = [
            ...valorantGeneric,
            ...gamingIdeas
        ];

    }

    const selected = [];

    while(selected.length < 6 && pool.length){

        const idea = chooseDifferent(pool);

        if(!idea) break;

        if(!selected.some(x => x.title === idea.title)){
            selected.push(idea);
        }

        pool = pool.filter(x => x.title !== idea.title);

    }

    return selected;

}


/* ---------------------------------------------------------

--------------------------------------------------------- */

function buildGeneralIdeas(){

    const pool = [
        ...generalIdeas,
        ...memeIdeas
    ];

    const selected = [];

    while(selected.length < 6 && pool.length){

        const idea = chooseDifferent(pool);

        if(!idea) break;

        if(!selected.some(x => x.title === idea.title)){
            selected.push(idea);
        }

        pool.splice(
            pool.findIndex(x => x.title === idea.title),
            1
        );

    }

    return selected;

}

/* ---------------------------------------------------------

--------------------------------------------------------- */

function genericResponse(context){

    const text = normalize(context.text);

    let html = `<p>${getGreeting()}. Te estoy siguiendo.</p>`;


    if(
        text.includes("hola") ||
        text.includes("buenas") ||
        text === "hey" ||
        text === "hello"
    ){

        html += `
            <p>
                Cuéntame qué tienes en mente, aunque todavía esté a medias.
                Puedes decirme simplemente el tema, el juego, el tipo de
                contenido o incluso decirme que no sabes qué hacer.
            </p>
        `;

    }

    else if(
        /no se|no tengo idea|no tengo nada|estoy perdido/.test(text)
    ){

        html += `
            <p>
                Perfecto, entonces no voy a obligarte a escoger una categoría.
                Dame aunque sea una palabra —un juego, tema, producto,
                situación o plataforma— y construiré opciones diferentes
                desde ahí.
            </p>
        `;

    }

    else{

        html += `
            <p>
                Entiendo la idea. Puedo convertir lo que acabas de decir
                en un concepto, una estructura de vídeo, un guion, un hook
                o varias ideas distintas.
            </p>

            <div class="section">

                <div class="section-title">
                    Lo que entendí
                </div>

                <div class="section-text">
                    ${escapeHTML(context.text)}
                </div>

            </div>

            <p>
                Si quieres, también puedo llevar esta idea directamente
                hacia contenido para redes.
            </p>
        `;

    }


    html += `

        <div class="motivation">
            ${escapeHTML(getMotivation())}
        </div>

    `;

    return html;

}


/* =========================================================
   ESTADO PENDIENTE
========================================================= */

let pendingCharacter = null;


/* ---------------------------------------------------------
   GENERADOR PRINCIPAL
--------------------------------------------------------- */

function generateResponse(text){

    const context = analyze(text);

    /*
       SI ESTÁBAMOS ESPERANDO QUE EL USUARIO ELIJA PERSONAJE
    */

    if(pendingCharacter){

        const previous = pendingCharacter;

        const newCharacter =
            detectCharacter(text,previous.game);

        const noCharacter =
            explicitlyNoCharacter(text);

        if(newCharacter){

            pendingCharacter = null;

            const combined = {
                ...previous,
                character:newCharacter,
                noCharacter:false,
                text:previous.text + " " + text
            };

            return generateAfterCharacter(combined);

        }

        if(noCharacter){

            pendingCharacter = null;

            const combined = {
                ...previous,
                character:null,
                noCharacter:true
            };

            return ideasResponse(combined);

        }

        if(
            normalize(text) === "si" ||
            normalize(text) === "si quiero" ||
            normalize(text) === "yes"
        ){

            return `
                <p>${getGreeting()}.</p>

                <p>
                    Perfecto. ¿Con qué agente o personaje quieres hacerlo?
                </p>

                <p>
                    Puedes decirme algo como <strong>Reyna</strong>,
                    <strong>Jett</strong>, <strong>Sage</strong> u otro.
                </p>
            `;

        }

        return `
            <p>${getGreeting()}.</p>

            <p>
                Solo me falta ese detalle: ¿qué personaje quieres utilizar?
            </p>

            <p>
                Si te da igual, escribe <strong>“cualquiera”</strong>
                y continúo sin limitar la idea a un personaje.
            </p>
        `;

    }


    /*
       GAMING:
       SI HAY JUEGO CON PERSONAJES Y NO HAY PERSONAJE,
       PREGUNTAMOS ANTES DE GENERAR.
    */

    if(
        context.game &&
        games[context.game] &&
        games[context.game].characters.length > 0 &&
        !context.character &&
        !context.noCharacter
    ){

        pendingCharacter = context;

        return characterQuestion(context.game);

    }


    return generateAfterCharacter(context);

}


/* ---------------------------------------------------------
   GENERAR DESPUÉS DE SABER PERSONAJE
--------------------------------------------------------- */

function generateAfterCharacter(context){

    const intent = context.intent;


    if(intent.asksIdeas){

        return ideasResponse(context);

    }


    if(intent.asksScript){

        return scriptResponse(context);

    }


    if(intent.asksMeme){

        return memeResponse();

    }


    if(intent.asksEditing){

        return editingResponse(context);

    }


    if(intent.asksMotivation){

        return motivationResponse();

    }


    /*
       SI SOLO DICE VALORANT PERO NO PIDE NADA,
       AHORA SÍ ENTENDEMOS EL CONTEXTO.
    */

    if(context.game){

        return ideasResponse({
            ...context,
            intent:{
                ...intent,
                asksIdeas:true
            }
        });

    }


    return genericResponse(context);

}

/* =========================================================
   HISTORIAL
========================================================= */

let chats = [];

try{

    chats =
        JSON.parse(
            localStorage.getItem("sparky_chats") || "[]"
        );

    if(!Array.isArray(chats)){
        chats=[];
    }

}catch(e){

    chats=[];

}


function saveChat(userText,botHTML){

    const chat = {

        id:Date.now(),

        title:userText.slice(0,55),

        user:userText,

        bot:botHTML,

        date:new Date().toLocaleString("es-ES",{
            day:"2-digit",
            month:"2-digit",
            hour:"2-digit",
            minute:"2-digit"
        })

    };


    chats.unshift(chat);

    if(chats.length > 40){

        chats =
            chats.slice(0,40);

    }


    try{

        localStorage.setItem(
            "sparky_chats",
            JSON.stringify(chats)
        );

    }catch(e){}


    renderHistory();

}


function renderHistory(){

    const list =
        $("#historyList");

    if(!chats.length){

        list.innerHTML = `

            <div class="history-empty">

                Tus conversaciones aparecerán aquí automáticamente.

            </div>

        `;

        return;

    }


    list.innerHTML = "";


    chats.forEach(chat=>{

        const button =
            document.createElement("button");

        button.className =
            "history-item";

        button.innerHTML = `

            <i class="fa-regular fa-message"></i>

            <span>
                ${escapeHTML(chat.title)}
            </span>

        `;


        button.addEventListener("click",()=>{

            openChat(chat.id);

            closeSidebar();

        });


        list.appendChild(button);

    });

}


function openChat(id){

    const chat =
        chats.find(x=>x.id===id);

    if(!chat) return;

    messagesInner.innerHTML="";

    welcome.classList.add("hidden");

    addMessage("user",chat.user);

    addMessage("bot",chat.bot);

}


function newProject(){

    messagesInner.innerHTML="";

    welcome.classList.remove("hidden");

    pendingCharacter=null;

    input.value="";

    input.focus();

}


/* =========================================================
   ENVIAR
========================================================= */

let busy=false;


function sendMessage(){

    if(busy) return;

    const text =
        input.value.trim();

    if(!text) return;


    busy=true;

    sendButton.disabled=true;

    input.value="";

    autoResize();


    addMessage(
        "user",
        text
    );


    addTyping();


    /*
       Pequeño retraso para que la respuesta
       se sienta natural sin bloquear.
    */

    setTimeout(()=>{

        removeTyping();


        const response =
            generateResponse(text);


        addMessage(
            "bot",
            response
        );


        saveChat(
            text,
            response
        );


        busy=false;

        sendButton.disabled=false;

        input.focus();

    },450 + Math.random()*450);

}


sendButton.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    e=>{

        if(e.key === "Enter" && !e.shiftKey){

            e.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   TEXTAREA AUTOMÁTICO
========================================================= */

function autoResize(){

    input.style.height="auto";

    input.style.height =
        Math.min(input.scrollHeight,140) + "px";

}

input.addEventListener(
    "input",
    autoResize
);


/* =========================================================
   ATAJOS
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.key === "/" &&
            document.activeElement !== input
        ){

            e.preventDefault();

            input.focus();

        }

        if(e.key === "Escape"){

            closeSidebar();

        }

    }
);

);

renderHistory();
